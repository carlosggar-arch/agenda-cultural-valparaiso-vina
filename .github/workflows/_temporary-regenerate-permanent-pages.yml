name: Temporary regenerate permanent pages

on:
  push:
    branches:
      - fix/permanent-pages-canonical-sync-v242

permissions:
  contents: write

jobs:
  regenerate-and-harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate permanent pages from canonical datasets
        run: |
          set -euo pipefail
          python scripts/generate_event_pages.py
      - name: Harden canonical generated-page gates and publish triggers
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pr_fast = Path('.github/workflows/pr-fast.yml')
          text = pr_fast.read_text(encoding='utf-8')
          old = '''      - name: Validate generated pages when affected\n        if: steps.impact.outputs.generated == 'true'\n        run: |\n          python scripts/generate_event_pages.py --check\n          python scripts/stage31_site_generator.py --check\n'''
          new = '''      - name: Validate generated pages when affected\n        if: steps.impact.outputs.generated == 'true'\n        run: |\n          python scripts/generate_event_pages.py\n          git diff --exit-code -- evento sitemap.xml\n          python scripts/stage31_site_generator.py --check\n'''
          if old not in text:
              raise SystemExit('Expected generated-page block not found in pr-fast.yml')
          pr_fast.write_text(text.replace(old, new, 1), encoding='utf-8')

          impact = Path('app/scripts/ci_change_impact.py')
          text = impact.read_text(encoding='utf-8')
          replacements = {
              'PRODUCT_PREFIXES = ("app/", "assets/", "scripts/", "shared/", "tests/")':
                  'PRODUCT_PREFIXES = ("app/", "assets/", "scripts/", "shared/", "tests/", "evento/")',
              'PRODUCT_FILES = {"index.html", "manifest.webmanifest", "agenda_web.json", "fuentes_publicas.json"}':
                  'PRODUCT_FILES = {"index.html", "manifest.webmanifest", "agenda_web.json", "fuentes_publicas.json", "sitemap.xml"}',
              'GENERATED_PREFIXES = ("shared/", "scripts/generate_", "scripts/stage31_", "assets/event-")':
                  'GENERATED_PREFIXES = ("shared/", "scripts/generate_", "scripts/stage31_", "assets/event-", "evento/")',
              'GENERATED_FILES = {"agenda_web.json", "app/data/gijon/agenda_web.json"}':
                  'GENERATED_FILES = {"agenda_web.json", "app/data/gijon/agenda_web.json", "sitemap.xml"}',
              'RELEASE_PREFIXES = ("assets/", "shared/")':
                  'RELEASE_PREFIXES = ("assets/", "shared/", "evento/")',
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f'Expected CI impact line not found: {old_value}')
              text = text.replace(old_value, new_value, 1)
          impact.write_text(text, encoding='utf-8')

          publish = Path('.github/workflows/publish.yml')
          text = publish.read_text(encoding='utf-8')
          anchor = '      - "agenda_web.json"\n'
          insertion = (
              '      - "agenda_web.json"\n'
              '      - "evento/**"\n'
              '      - "sitemap.xml"\n'
              '      - "scripts/generate_event_pages.py"\n'
              '      - "scripts/public_category_rules.py"\n'
          )
          if anchor not in text:
              raise SystemExit('Expected agenda_web.json path trigger not found in publish.yml')
          if '      - "evento/**"\n' not in text:
              text = text.replace(anchor, insertion, 1)
          publish.write_text(text, encoding='utf-8')
          PY
      - name: Commit regenerated artifacts and structural guardrails
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_temporary-regenerate-permanent-pages.yml
          git add -A -- evento sitemap.xml .github/workflows/pr-fast.yml .github/workflows/publish.yml app/scripts/ci_change_impact.py .github/workflows/_temporary-regenerate-permanent-pages.yml
          git diff --cached --stat
          git commit -m 'Keep permanent event pages synchronized with canonical data'
          git push origin HEAD:fix/permanent-pages-canonical-sync-v242
