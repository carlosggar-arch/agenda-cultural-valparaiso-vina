name: Balmaceda Valpo source validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/scripts/refresh_balmaceda_valpo.py"
      - "app/scripts/refresh_balmaceda_valpo_bounded.py"
      - "app/scripts/refresh_balmaceda_valpo_resilient.py"
      - "app/scripts/test_balmaceda_valpo.py"
      - "app/scripts/test_balmaceda_transport.py"
      - "app/scripts/apply_balmaceda_coverage.py"
      - "app/scripts/test_balmaceda_coverage.py"
      - ".github/workflows/balmaceda-valpo-source-check.yml"
  workflow_dispatch:
  schedule:
    # Daily after the base source refresh; GitHub cron is UTC.
    - cron: "5 10 * * *"

permissions:
  contents: write

concurrency:
  group: permanent-event-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run policy and transport tests
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/refresh_balmaceda_valpo.py \
            app/scripts/refresh_balmaceda_valpo_bounded.py \
            app/scripts/refresh_balmaceda_valpo_resilient.py \
            app/scripts/test_balmaceda_valpo.py \
            app/scripts/test_balmaceda_transport.py \
            app/scripts/apply_balmaceda_coverage.py \
            app/scripts/test_balmaceda_coverage.py
          python app/scripts/test_balmaceda_valpo.py
          python app/scripts/test_balmaceda_transport.py
          python app/scripts/test_balmaceda_coverage.py

      - name: Probe official Balmaceda Valpo source
        run: |
          set -euo pipefail
          python app/scripts/refresh_balmaceda_valpo_resilient.py --no-write > balmaceda-valpo-live-check.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('balmaceda-valpo-live-check.json').read_text(encoding='utf-8'))
          required = {
              'state', 'landings', 'links_discovered', 'pages_scanned',
              'recent_valpo_pages', 'future_dated_candidates', 'events_published', 'coverage'
          }
          missing = sorted(required - set(report))
          if missing:
              raise SystemExit(f'Incomplete Balmaceda diagnostic: {missing}')
          reachable = any(item.get('fetch_ok') for item in report.get('landings') or [])
          print('BALMACEDA_VALPO_LIVE_SOURCE_DIAGNOSTIC', json.dumps({
              'reachable': reachable,
              'state': report.get('state'),
              'links_discovered': report.get('links_discovered'),
              'pages_scanned': report.get('pages_scanned'),
              'recent_valpo_pages': report.get('recent_valpo_pages'),
              'future_dated_candidates': report.get('future_dated_candidates'),
              'events_published': report.get('events_published'),
              'semantic_duplicates_dropped': report.get('semantic_duplicates_dropped'),
              'coverage': report.get('coverage'),
          }, ensure_ascii=False))
          PY

      - name: Detect material source-state change
        if: github.event_name != 'pull_request'
        id: material
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          live = json.loads(Path('balmaceda-valpo-live-check.json').read_text(encoding='utf-8'))
          path = Path('app/data/quality/balmaceda-valpo.json')
          current = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          keys = (
              'state', 'links_discovered', 'pages_scanned', 'recent_valpo_pages',
              'recent_valpo_titles', 'future_dated_candidates', 'events_published',
              'semantic_duplicates_dropped', 'coverage'
          )
          changed = any(live.get(key) != current.get(key) for key in keys)
          live_reachable = any(item.get('fetch_ok') for item in live.get('landings') or [])
          current_reachable = any(item.get('fetch_ok') for item in current.get('landings') or [])
          changed = changed or live_reachable != current_reachable
          print(f"changed={'true' if changed else 'false'}")
          PY

      - name: Materialize Balmaceda recovery and synchronized diagnostics
        if: github.event_name != 'pull_request' && steps.material.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python app/scripts/refresh_balmaceda_valpo_resilient.py
          python app/scripts/refresh_quality_diagnostics.py
          python app/scripts/apply_source_coverage_overrides.py
          python app/scripts/apply_balmaceda_coverage.py
          python app/scripts/test_balmaceda_valpo.py
          python app/scripts/test_balmaceda_transport.py
          python app/scripts/test_balmaceda_coverage.py

      - name: Commit material Balmaceda source change
        if: github.event_name != 'pull_request' && steps.material.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "agenda-balmaceda-source[bot]"
          git config user.email "agenda-balmaceda-source[bot]@users.noreply.github.com"
          git add \
            agenda_web.json \
            app/data/quality/balmaceda-valpo.json \
            app/data/quality/source-coverage.json \
            app/data/quality/event-quality.json \
            app/data/quality/release-readiness.json
          if git diff --cached --quiet; then
            echo "Balmaceda source state already synchronized."
            exit 0
          fi
          git commit -m "Actualiza estado oficial de Balmaceda Valpo"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload live-source diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balmaceda-valpo-live-check
          path: balmaceda-valpo-live-check.json
          if-no-files-found: ignore
          retention-days: 14
