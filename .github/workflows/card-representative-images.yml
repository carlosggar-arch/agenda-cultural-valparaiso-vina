name: Card representative image guard

on:
  pull_request:
    branches: [main]
    paths:
      - "app/app.js"
      - "app/card-experience.js"
      - "app/card-experience.css"
      - "app/image-quality-guard.js"
      - "app/event-data-corrections.js"
      - "app/release-version.js"
      - "app/shared-presentation-runtime.test.mjs"
      - "tests/card-representative-images.test.mjs"
      - "tests/runtime-card-image-fallback.test.mjs"
      - ".github/workflows/card-representative-images.yml"
  push:
    branches: [main]
    paths:
      - "app/app.js"
      - "app/card-experience.js"
      - "app/card-experience.css"
      - "app/image-quality-guard.js"
      - "app/event-data-corrections.js"
      - "app/release-version.js"
      - "app/shared-presentation-runtime.test.mjs"
      - "tests/card-representative-images.test.mjs"
      - "tests/runtime-card-image-fallback.test.mjs"
      - ".github/workflows/card-representative-images.yml"

permissions:
  contents: read

jobs:
  representative-image-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check card JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/card-experience.js
          node --check app/image-quality-guard.js
      - name: Verify unified card image policies
        run: |
          node --test tests/card-representative-images.test.mjs tests/runtime-card-image-fallback.test.mjs
          node app/shared-presentation-runtime.test.mjs
