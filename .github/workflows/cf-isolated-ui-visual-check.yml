name: Cloudflare isolated UI visual check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_BASE: https://cf-preview-recuperacion-ui-2.vivamos.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify isolated Cloudflare deployment and recovered runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl -L -sS -o /tmp/app.html -w '%{http_code}' --max-time 10 -H 'Cache-Control: no-cache' "$PREVIEW_BASE/app/?city=valparaiso&when=todos&visualcheck=$RANDOM" || true)"
            if [[ "$code" == "200" ]] && grep -qi '<html' /tmp/app.html; then break; fi
            [[ "$attempt" == "30" ]] && { echo "Cloudflare branch preview unavailable" >&2; exit 1; }
            sleep 8
          done
          curl -L -fsS -H 'Cache-Control: no-cache' "$PREVIEW_BASE/app/app.js?visualcheck=$RANDOM" -o /tmp/app.js
          grep -q 'exhibition-hours.js?v=20260820-hours4' /tmp/app.js
          grep -q 'public-presentation-guard.js?v=20260820-text1' /tmp/app.js
          echo "CLOUDFLARE_RECOVERY_RUNTIME_OK"

      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium

      - name: Check Palacio Rioja visually and structurally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-artifacts
          python - <<'PY'
          import json, os, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          base = os.environ["PREVIEW_BASE"]
          out = Path("visual-artifacts")
          chrome = next((shutil.which(n) for n in ("google-chrome-stable","google-chrome","chromium","chromium-browser") if shutil.which(n)), None)
          if not chrome:
              raise SystemExit("No Chrome/Chromium binary available")

          options = Options(); options.binary_location = chrome
          for arg in ("--headless=new","--no-sandbox","--disable-gpu","--disable-dev-shm-usage","--window-size=1440,1200","--disable-extensions","--no-first-run","--no-default-browser-check"):
              options.add_argument(arg)

          driver = webdriver.Chrome(options=options)
          d = {}
          try:
              driver.get(f"{base}/app/?city=valparaiso&when=todos&visualcheck={int(time.time())}")
              WebDriverWait(driver, 30).until(lambda x: x.execute_script("return document.querySelectorAll('.event-card').length") > 0)
              time.sleep(4)

              d["public_event_card_count"] = int(driver.execute_script("return document.querySelectorAll('.event-card[data-event-id]').length"))
              d["monthly_agosto_as_event"] = bool(driver.execute_script("""
                return [...document.querySelectorAll('.event-card[data-event-id]')].some((card) => {
                  const t = String(card.textContent || '');
                  return t.includes('Destino Valparaíso') && t.includes('Agosto 2026');
                });
              """))
              if d["monthly_agosto_as_event"]:
                  raise AssertionError("Destino Valparaíso – Agosto 2026 reappeared as a normal event card")

              rioja = driver.execute_script("""
                return [...document.querySelectorAll('.exhibition-venue-card, .exhibition-group-card')]
                  .find((node) => String(node.textContent || '').includes('Museo Palacio Rioja')) || null;
              """)
              if rioja is None:
                  raise AssertionError("Grouped Museo Palacio Rioja card was not found")
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});", rioja)
              driver.execute_script("""
                const card=arguments[0];
                const e=[...card.querySelectorAll('summary,button')].find((n)=>String(n.textContent||'').includes('3 exposiciones'));
                if (e) { const details=e.closest('details'); if (e.getAttribute('aria-expanded')==='false' || (details && !details.open)) e.click(); }
              """, rioja)
              time.sleep(1)

              d["rioja_venue_hours_rows"] = int(driver.execute_script("return arguments[0].querySelectorAll('.exhibition-venue-hours').length", rioja))
              d["rioja_subcard_count"] = int(driver.execute_script("return arguments[0].querySelectorAll('.grouped-exhibition-item').length", rioja))
              d["rioja_clipped_rows"] = int(driver.execute_script("""
                return [...arguments[0].querySelectorAll('.grouped-exhibition-item')]
                  .filter((row)=>row.scrollHeight > row.clientHeight + 2).length;
              """, rioja))
              d["sources_total"] = int(driver.execute_script("""
                const n=document.querySelector('[data-sources-total]');
                const m=String(n?.textContent||'').match(/\d+/); return m ? Number(m[0]) : 0;
              """))

              if d["rioja_venue_hours_rows"] != 1:
                  raise AssertionError(f"Palacio Rioja has {d['rioja_venue_hours_rows']} venue-hours rows; expected 1")
              if d["rioja_subcard_count"] < 3:
                  raise AssertionError(f"Palacio Rioja has only {d['rioja_subcard_count']} grouped exhibition rows")
              if d["rioja_clipped_rows"] != 0:
                  raise AssertionError(f"Palacio Rioja still has {d['rioja_clipped_rows']} clipped subcards")

              rioja.screenshot(str(out / "palacio-rioja-card.png"))
              driver.save_screenshot(str(out / "valparaiso-preview-page.png"))
              print("PALACIO_RIOJA_GROUP_FOUND")
              print("PALACIO_RIOJA_SINGLE_HOURS_OK")
              print("PALACIO_RIOJA_SUBCARDS_NOT_CLIPPED")
              print("DESTINO_VALPARAISO_MONTHLY_EVENT_ABSENT")
              print("SOURCES_TOTAL", d["sources_total"])
          finally:
              (out / "diagnostics.json").write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding="utf-8")
              driver.quit()
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-isolated-ui-visual-evidence
          path: visual-artifacts/
          if-no-files-found: warn
          retention-days: 7
