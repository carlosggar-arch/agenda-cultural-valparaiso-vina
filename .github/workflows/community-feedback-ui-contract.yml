name: Community feedback UI contract

on:
  push:
    branches: [main]
    paths:
      - "app/app.js"
      - "app/community-source.js"
      - "app/community-source.css"
      - "app/participation-footer.js"
      - "app/web-actions-below-mosaic.js"
      - "app/action-strip-layout.js"
      - "app/installed-mosaic.js"
      - "app/pwa.js"
      - "app/service-worker.js"
      - "app/release-version.js"
      - "tests/community-feedback-ui.test.mjs"
      - ".github/workflows/community-feedback-ui-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/app.js"
      - "app/community-source.js"
      - "app/community-source.css"
      - "app/participation-footer.js"
      - "app/web-actions-below-mosaic.js"
      - "app/action-strip-layout.js"
      - "app/installed-mosaic.js"
      - "app/pwa.js"
      - "app/service-worker.js"
      - "app/release-version.js"
      - "tests/community-feedback-ui.test.mjs"
      - ".github/workflows/community-feedback-ui-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate client syntax and WEB/PWA action contracts
        run: |
          node --check app/app.js
          node --check app/community-source.js
          node --check app/participation-footer.js
          node --check app/web-actions-below-mosaic.js
          node --check app/action-strip-layout.js
          node --check app/installed-mosaic.js
          node --check app/pwa.js
          node --check app/service-worker.js
          node tests/community-feedback-ui.test.mjs
          git diff --check
