name: Public content quality guard

on:
  push:
    branches: [main]
    paths:
      - "agenda_web.json"
      - "app/scripts/apply_content_quality_guard.py"
      - "app/scripts/test_content_quality_guard.py"
      - ".github/workflows/content-quality-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

# Share the same lock as the post-publication composer so both writers serialize.
concurrency:
  group: permanent-event-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanitize-public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate content quality guard
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/apply_content_quality_guard.py \
            app/scripts/test_content_quality_guard.py
          python app/scripts/test_content_quality_guard.py
          python app/scripts/apply_content_quality_guard.py --no-write

      - name: Apply content quality guard
        run: |
          set -euo pipefail
          python app/scripts/apply_content_quality_guard.py

      - name: Commit sanitized public dataset
        run: |
          set -euo pipefail
          git config user.name "agenda-content-quality[bot]"
          git config user.email "agenda-content-quality[bot]@users.noreply.github.com"
          git add agenda_web.json app/data/quality/content-quality.json
          if git diff --cached --quiet; then
            echo "Public content is already sanitized."
            exit 0
          fi
          git commit -m "Sanea títulos, descripciones y duplicados públicos"
          git pull --rebase origin main
          git push origin HEAD:main
