name: Public content quality guard

on:
  push:
    branches: [main]
    paths:
      - "agenda_web.json"
      - "app/scripts/apply_content_quality_guard.py"
      - "app/scripts/test_content_quality_guard.py"
      - ".github/workflows/content-quality-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-content-quality-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate content quality without mutating public main
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/apply_content_quality_guard.py \
            app/scripts/test_content_quality_guard.py
          python app/scripts/test_content_quality_guard.py
          python app/scripts/apply_content_quality_guard.py --no-write
          echo "PUBLIC_CONTENT_QUALITY_READ_ONLY_OK"

      - name: Confirm writer ownership
        run: |
          echo "PUBLIC_WRITE=false"
          echo "PUBLIC_WRITER=agenda-cultural-core/.github/workflows/finalize-public-agenda.yml"
