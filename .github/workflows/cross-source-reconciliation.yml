name: Cross-source reconciliation (manual fallback)

on:
  pull_request:
    branches: [main]
    paths:
      - "app/scripts/refresh_valpocultura_zero_recovery_resilient.py"
      - "app/scripts/test_valpocultura_resilience.py"
      - "app/scripts/apply_event_derived_source_coverage.py"
      - "app/scripts/test_event_derived_source_coverage.py"
      - ".github/workflows/cross-source-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-source-reconciliation-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate reconciliation rules
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/refresh_valpocultura_zero_recovery_resilient.py \
            app/scripts/test_valpocultura_resilience.py \
            app/scripts/apply_event_derived_source_coverage.py \
            app/scripts/test_event_derived_source_coverage.py
          python app/scripts/test_valpocultura_resilience.py
          python app/scripts/test_event_derived_source_coverage.py

      - name: Reconcile in workspace only
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python app/scripts/refresh_valpocultura_zero_recovery_resilient.py
          python app/scripts/apply_title_quality_guard.py
          python app/scripts/apply_content_quality_guard.py
          python app/scripts/refresh_quality_diagnostics.py
          python app/scripts/apply_source_coverage_overrides.py
          python app/scripts/apply_balmaceda_coverage.py
          python app/scripts/apply_fonck_coverage.py
          python app/scripts/apply_estadio_espanol_coverage.py
          python app/scripts/apply_event_derived_source_coverage.py
          python scripts/stage31_site_generator.py

      - name: Validate reconciled integrity
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          dataset = json.loads((root / 'agenda_web.json').read_text(encoding='utf-8'))
          coverage = json.loads((root / 'app/data/quality/source-coverage.json').read_text(encoding='utf-8'))
          quality = json.loads((root / 'app/data/quality/event-quality.json').read_text(encoding='utf-8'))
          readiness = json.loads((root / 'app/data/quality/release-readiness.json').read_text(encoding='utf-8'))
          municipal = json.loads((root / 'app/data/quality/valpocultura-zero-recovery.json').read_text(encoding='utf-8'))
          events = dataset.get('events') or []
          city = (coverage.get('cities') or {}).get('valparaiso-vina') or {}
          summary = city.get('summary') or {}
          qcity = (quality.get('cities') or {}).get('valparaiso-vina') or {}
          if summary.get('total_events') != len(events) or summary.get('attributed_events') != len(events):
              raise SystemExit('CROSS_SOURCE_RECONCILIATION_UNSYNCHRONIZED_COVERAGE')
          if (qcity.get('summary') or {}).get('total_events') != len(events):
              raise SystemExit('CROSS_SOURCE_RECONCILIATION_UNSYNCHRONIZED_QUALITY')
          if readiness.get('blockers'):
              raise SystemExit(f'CROSS_SOURCE_RECONCILIATION_BLOCKERS: {readiness.get("blockers")}')
          if municipal.get('fetch_ok') is True and municipal.get('listing_discovered') == 0 and municipal.get('direct_fallback_added', 0) <= 0:
              raise SystemExit('VALPOCULTURA_LISTING_DRIFT_WITHOUT_FALLBACK')
          print('CROSS_SOURCE_RECONCILIATION_READ_ONLY_OK', f'total={len(events)}')
          PY

      - name: Confirm writer ownership
        run: |
          echo "PUBLIC_WRITE=false"
          echo "PUBLIC_WRITER=agenda-cultural-core/.github/workflows/finalize-public-agenda.yml"
