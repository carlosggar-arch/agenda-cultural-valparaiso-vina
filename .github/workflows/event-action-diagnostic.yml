name: Event action interaction diagnostic

on:
  push:
    branches:
      - fix/event-action-interactions-v1
    paths:
      - "app/**"
      - ".github/workflows/event-action-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile diagnostic
        run: python -m py_compile app/scripts/test_event_actions_browser.py app/scripts/test_runtime_browser.py
      - name: Exercise event actions with physical hit targets
        run: python app/scripts/test_event_actions_browser.py
