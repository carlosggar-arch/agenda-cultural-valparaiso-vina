name: Permanent event pages

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate_event_pages.py"
      - "scripts/stage31_site_generator.py"
      - "assets/event-page.css"
      - "assets/event-page.js"
      - "assets/accessibility.css"
      - "assets/city-page.css"
      - "assets/event-permalink.css"
      - "assets/web-event-enhancements.js"
      - "app/event-detail.js"
      - "app/pwa.js"
      - "app/service-worker.js"
      - "app/stage31-accessibility-seo.js"
      - "app/stage31-accessibility.css"
      - "app/data/high_value_sources.json"
      - "app/scripts/fetch_high_value_sources.py"
      - "app/scripts/validate_high_value_refresh.py"
      - "app/scripts/test_high_value_sources.py"
      - "app/scripts/refresh_museo_maritimo.py"
      - "app/scripts/test_museo_maritimo.py"
      - "app/scripts/refresh_balmaceda_valpo.py"
      - "app/scripts/refresh_balmaceda_valpo_bounded.py"
      - "app/scripts/test_balmaceda_valpo.py"
      - "app/scripts/apply_balmaceda_coverage.py"
      - "app/scripts/test_balmaceda_coverage.py"
      - "app/scripts/refresh_visitavina_fonck.py"
      - "app/scripts/test_visitavina_fonck.py"
      - "app/scripts/apply_fonck_coverage.py"
      - "app/scripts/test_fonck_coverage.py"
      - "app/scripts/refresh_visitavina_estadio_espanol.py"
      - "app/scripts/test_visitavina_estadio_espanol.py"
      - "app/scripts/apply_estadio_espanol_coverage.py"
      - "app/scripts/test_estadio_espanol_coverage.py"
      - "app/scripts/refresh_portaltickets_editorial.py"
      - "app/scripts/validate_portaltickets_editorial.py"
      - "app/scripts/test_portaltickets_editorial.py"
      - "app/scripts/refresh_quality_diagnostics.py"
      - "app/scripts/refresh_valpocultura_zero_recovery.py"
      - "app/scripts/refresh_priority_zero_monitors.py"
      - "app/scripts/test_priority_zero_monitors.py"
      - "app/scripts/apply_title_quality_guard.py"
      - "app/scripts/test_title_quality_guard.py"
      - "app/scripts/apply_content_quality_guard.py"
      - "app/scripts/test_content_quality_guard.py"
      - "app/scripts/apply_source_coverage_overrides.py"
      - "app/scripts/test_valpocultura_zero_recovery.py"
      - "app/scripts/test_source_coverage_overrides.py"
      - "app/scripts/atomic_maintenance_hook.py"
      - "app/scripts/event_page_tools.py"
      - "app/scripts/revalidate_upcoming_events.py"
      - "app/scripts/parser_drift_guard.py"
      - "app/scripts/audit_source_coherence.py"
      - "app/scripts/audit_and_recover_images.py"
      - "app/scripts/source_refresh_scope.py"
      - "app/scripts/test_source_refresh_scope.py"
      - "tests/test_stage31.py"
      - ".github/workflows/event-pages.yml"
  push:
    branches: [main]
    paths:
      - "agenda_web.json"
      - "agenda_changes.json"
      - "app/data/gijon/agenda_web.json"
      - "scripts/generate_event_pages.py"
      - "scripts/stage31_site_generator.py"
      - "assets/event-page.css"
      - "assets/event-page.js"
      - "assets/accessibility.css"
      - "assets/city-page.css"
      - "assets/event-permalink.css"
      - "assets/web-event-enhancements.js"
      - "app/event-detail.js"
      - "app/pwa.js"
      - "app/service-worker.js"
      - "app/stage31-accessibility-seo.js"
      - "app/stage31-accessibility.css"
      - "app/data/high_value_sources.json"
      - "app/scripts/fetch_high_value_sources.py"
      - "app/scripts/validate_high_value_refresh.py"
      - "app/scripts/test_high_value_sources.py"
      - "app/scripts/refresh_museo_maritimo.py"
      - "app/scripts/test_museo_maritimo.py"
      - "app/scripts/refresh_balmaceda_valpo.py"
      - "app/scripts/refresh_balmaceda_valpo_bounded.py"
      - "app/scripts/test_balmaceda_valpo.py"
      - "app/scripts/apply_balmaceda_coverage.py"
      - "app/scripts/test_balmaceda_coverage.py"
      - "app/scripts/refresh_visitavina_fonck.py"
      - "app/scripts/test_visitavina_fonck.py"
      - "app/scripts/apply_fonck_coverage.py"
      - "app/scripts/test_fonck_coverage.py"
      - "app/scripts/refresh_visitavina_estadio_espanol.py"
      - "app/scripts/test_visitavina_estadio_espanol.py"
      - "app/scripts/apply_estadio_espanol_coverage.py"
      - "app/scripts/test_estadio_espanol_coverage.py"
      - "app/scripts/refresh_portaltickets_editorial.py"
      - "app/scripts/validate_portaltickets_editorial.py"
      - "app/scripts/test_portaltickets_editorial.py"
      - "app/scripts/refresh_quality_diagnostics.py"
      - "app/scripts/refresh_valpocultura_zero_recovery.py"
      - "app/scripts/refresh_priority_zero_monitors.py"
      - "app/scripts/test_priority_zero_monitors.py"
      - "app/scripts/apply_title_quality_guard.py"
      - "app/scripts/test_title_quality_guard.py"
      - "app/scripts/apply_content_quality_guard.py"
      - "app/scripts/test_content_quality_guard.py"
      - "app/scripts/apply_source_coverage_overrides.py"
      - "app/scripts/test_valpocultura_zero_recovery.py"
      - "app/scripts/test_source_coverage_overrides.py"
      - "app/scripts/atomic_maintenance_hook.py"
      - "app/scripts/event_page_tools.py"
      - "app/scripts/revalidate_upcoming_events.py"
      - "app/scripts/parser_drift_guard.py"
      - "app/scripts/audit_source_coherence.py"
      - "app/scripts/audit_and_recover_images.py"
      - "app/scripts/source_refresh_scope.py"
      - "app/scripts/test_source_refresh_scope.py"
      - "tests/test_stage31.py"
      - ".github/workflows/event-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 9 * * *"

permissions:
  contents: write

concurrency:
  group: permanent-event-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate static runtime and page generation
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/generate_event_pages.py \
            scripts/stage31_site_generator.py \
            tests/test_stage31.py \
            app/scripts/fetch_high_value_sources.py \
            app/scripts/validate_high_value_refresh.py \
            app/scripts/test_high_value_sources.py \
            app/scripts/refresh_museo_maritimo.py \
            app/scripts/test_museo_maritimo.py \
            app/scripts/refresh_balmaceda_valpo.py \
            app/scripts/refresh_balmaceda_valpo_bounded.py \
            app/scripts/test_balmaceda_valpo.py \
            app/scripts/apply_balmaceda_coverage.py \
            app/scripts/test_balmaceda_coverage.py \
            app/scripts/refresh_visitavina_fonck.py \
            app/scripts/test_visitavina_fonck.py \
            app/scripts/apply_fonck_coverage.py \
            app/scripts/test_fonck_coverage.py \
            app/scripts/refresh_visitavina_estadio_espanol.py \
            app/scripts/test_visitavina_estadio_espanol.py \
            app/scripts/apply_estadio_espanol_coverage.py \
            app/scripts/test_estadio_espanol_coverage.py \
            app/scripts/refresh_portaltickets_editorial.py \
            app/scripts/validate_portaltickets_editorial.py \
            app/scripts/test_portaltickets_editorial.py \
            app/scripts/refresh_quality_diagnostics.py \
            app/scripts/refresh_valpocultura_zero_recovery.py \
            app/scripts/refresh_priority_zero_monitors.py \
            app/scripts/test_priority_zero_monitors.py \
            app/scripts/apply_title_quality_guard.py \
            app/scripts/test_title_quality_guard.py \
            app/scripts/apply_content_quality_guard.py \
            app/scripts/test_content_quality_guard.py \
            app/scripts/apply_source_coverage_overrides.py \
            app/scripts/test_valpocultura_zero_recovery.py \
            app/scripts/test_source_coverage_overrides.py \
            app/scripts/atomic_maintenance_hook.py \
            app/scripts/event_page_tools.py \
            app/scripts/revalidate_upcoming_events.py \
            app/scripts/parser_drift_guard.py \
            app/scripts/audit_source_coherence.py \
            app/scripts/audit_and_recover_images.py \
            app/scripts/source_refresh_scope.py \
            app/scripts/test_source_refresh_scope.py
          node --check assets/event-page.js
          node --check assets/web-event-enhancements.js
          node --check app/event-detail.js
          node --check app/stage31-accessibility-seo.js
          node --check app/pwa.js
          node --check app/service-worker.js
          python app/scripts/test_source_refresh_scope.py
          python -m unittest discover -s tests -p 'test_stage31.py' -v
          python scripts/stage31_site_generator.py --check

      - name: Classify PR source changes
        if: github.event_name == 'pull_request'
        id: pr_source_scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | python app/scripts/source_refresh_scope.py \
            | tee source-scope-output.txt
          cat source-scope-output.txt >> "$GITHUB_OUTPUT"

      - name: Validate source policy tests
        if: github.event_name == 'pull_request' && steps.pr_source_scope.outputs.tests_needed == 'true'
        run: |
          set -euo pipefail
          python app/scripts/test_high_value_sources.py
          python app/scripts/test_museo_maritimo.py
          python app/scripts/test_balmaceda_valpo.py
          python app/scripts/test_balmaceda_coverage.py
          python app/scripts/test_visitavina_fonck.py
          python app/scripts/test_fonck_coverage.py
          python app/scripts/test_visitavina_estadio_espanol.py
          python app/scripts/test_estadio_espanol_coverage.py
          python app/scripts/test_portaltickets_editorial.py
          python app/scripts/test_valpocultura_zero_recovery.py
          python app/scripts/test_priority_zero_monitors.py
          python app/scripts/test_title_quality_guard.py
          python app/scripts/test_content_quality_guard.py
          python app/scripts/test_source_coverage_overrides.py
          python app/scripts/test_source_refresh_scope.py

      - name: Validate live source dry-run
        if: github.event_name == 'pull_request' && steps.pr_source_scope.outputs.live_needed == 'true'
        run: |
          set -euo pipefail
          python app/scripts/fetch_high_value_sources.py --no-write
          python app/scripts/refresh_museo_maritimo.py --no-write
          python app/scripts/refresh_balmaceda_valpo_bounded.py --no-write
          python app/scripts/refresh_visitavina_fonck.py --no-write
          python app/scripts/refresh_visitavina_estadio_espanol.py --no-write
          python app/scripts/refresh_portaltickets_editorial.py --no-write
          python app/scripts/refresh_valpocultura_zero_recovery.py --no-write
          python app/scripts/refresh_priority_zero_monitors.py --no-write
          python app/scripts/apply_title_quality_guard.py --no-write
          python app/scripts/apply_content_quality_guard.py --no-write
          python app/scripts/refresh_quality_diagnostics.py --no-write

      - name: Decide whether source refresh is required
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: source_refresh
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Source refresh required by ${{ github.event_name }}."
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$before" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Source refresh required because no comparison base is available."
            exit 0
          fi

          git diff --name-only "$before" "${{ github.sha }}" \
            | python app/scripts/source_refresh_scope.py \
            | tee source-scope-output.txt
          refresh_needed="$(awk -F= '$1 == "refresh_needed" {print $2}' source-scope-output.txt)"
          if [[ "$refresh_needed" != "true" && "$refresh_needed" != "false" ]]; then
            echo "Invalid source refresh classification: $refresh_needed" >&2
            exit 1
          fi
          echo "needed=$refresh_needed" >> "$GITHUB_OUTPUT"
          if [[ "$refresh_needed" == "true" ]]; then
            echo "Source-affecting changes detected; full refresh will run."
          else
            echo "Page/data-only change; skipping redundant external source refresh."
          fi

      - name: Refresh and atomically compose verified sources and diagnostics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.source_refresh.outputs.needed == 'true'
        run: |
          set -euo pipefail
          python app/scripts/fetch_high_value_sources.py
          python app/scripts/refresh_museo_maritimo.py
          python app/scripts/refresh_balmaceda_valpo_bounded.py
          python app/scripts/refresh_visitavina_fonck.py
          python app/scripts/refresh_visitavina_estadio_espanol.py
          python app/scripts/refresh_portaltickets_editorial.py
          python app/scripts/refresh_valpocultura_zero_recovery.py
          python app/scripts/refresh_priority_zero_monitors.py
          python app/scripts/validate_portaltickets_editorial.py
          python app/scripts/validate_high_value_refresh.py
          python app/scripts/test_high_value_sources.py
          python app/scripts/test_museo_maritimo.py
          python app/scripts/test_balmaceda_valpo.py
          python app/scripts/test_balmaceda_coverage.py
          python app/scripts/test_visitavina_fonck.py
          python app/scripts/test_fonck_coverage.py
          python app/scripts/test_visitavina_estadio_espanol.py
          python app/scripts/test_estadio_espanol_coverage.py
          python app/scripts/test_portaltickets_editorial.py
          python app/scripts/test_valpocultura_zero_recovery.py
          python app/scripts/test_priority_zero_monitors.py
          python app/scripts/test_title_quality_guard.py
          python app/scripts/test_content_quality_guard.py
          python app/scripts/test_source_coverage_overrides.py
          python app/scripts/apply_title_quality_guard.py
          python app/scripts/apply_content_quality_guard.py
          python app/scripts/refresh_quality_diagnostics.py
          python app/scripts/apply_source_coverage_overrides.py
          python app/scripts/apply_balmaceda_coverage.py
          python app/scripts/apply_fonck_coverage.py
          python app/scripts/apply_estadio_espanol_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          dataset = json.loads((root / 'agenda_web.json').read_text(encoding='utf-8'))
          museum = json.loads((root / 'app/data/quality/museo-maritimo.json').read_text(encoding='utf-8'))
          balm = json.loads((root / 'app/data/quality/balmaceda-valpo.json').read_text(encoding='utf-8'))
          fonck = json.loads((root / 'app/data/quality/visitavina-fonck.json').read_text(encoding='utf-8'))
          estadio = json.loads((root / 'app/data/quality/visitavina-estadio-espanol.json').read_text(encoding='utf-8'))
          portal = json.loads((root / 'app/data/quality/portaltickets-editorial.json').read_text(encoding='utf-8'))
          municipal = json.loads((root / 'app/data/quality/valpocultura-zero-recovery.json').read_text(encoding='utf-8'))
          monitored_zero = json.loads((root / 'app/data/quality/priority-zero-monitors.json').read_text(encoding='utf-8'))
          content_quality = json.loads((root / 'app/data/quality/content-quality.json').read_text(encoding='utf-8'))
          coverage = json.loads((root / 'app/data/quality/source-coverage.json').read_text(encoding='utf-8'))
          quality = json.loads((root / 'app/data/quality/event-quality.json').read_text(encoding='utf-8'))
          readiness = json.loads((root / 'app/data/quality/release-readiness.json').read_text(encoding='utf-8'))
          events = dataset.get('events') or []

          checks = [
              ('Museo Maritimo', 'museo_maritimo_nacional', int(museum.get('events_published') or 0)),
              ('Balmaceda', 'balmaceda_arte_joven_valpo_official', int(balm.get('events_published') or 0)),
              ('Museo Fonck', 'visitavina_fonck_recovery', int(fonck.get('events_published') or 0)),
              ('Estadio Espanol', 'visitavina_estadio_espanol_recovery', int(estadio.get('events_published') or 0)),
          ]
          for label, source_id, expected in checks:
              actual = sum(e.get('source_id') == source_id for e in events)
              if actual != expected:
                  raise SystemExit(f'{label} composition mismatch: dataset={actual} report={expected}')

          portal_events = [e for e in events if e.get('source_id') == 'portaltickets_valparaiso']
          expected_portal = int((portal.get('refresh') or {}).get('corrected_published') or 0)
          if portal.get('fetch_ok') and int(portal.get('candidates_parsed') or 0) > 0:
              if expected_portal <= 0 or len(portal_events) != expected_portal:
                  raise SystemExit(f'PortalTickets composition mismatch: dataset={len(portal_events)} report={expected_portal}')

          municipal_events = [e for e in events if str((e.get('editorial') or {}).get('reason') or '') == 'official_cross_source:valpocultura']
          if municipal.get('fetch_ok') is True:
              expected_municipal = int((municipal.get('refresh') or {}).get('published') or 0)
              if len(municipal_events) != expected_municipal:
                  raise SystemExit(f'Valpo Cultura recovery mismatch: dataset={len(municipal_events)} report={expected_municipal}')

          counts = dataset.get('counts') or {}
          if counts.get('total') != len(events):
              raise SystemExit(f'Dataset count mismatch: counts.total={counts.get("total")} events={len(events)}')
          if content_quality.get('events_after') != len(events):
              raise SystemExit('content-quality.json is not synchronized with agenda_web.json')

          cov_city = (coverage.get('cities') or {}).get('valparaiso-vina') or {}
          cov_summary = cov_city.get('summary') or {}
          if cov_summary.get('total_events') != len(events) or cov_summary.get('attributed_events') != len(events):
              raise SystemExit('source-coverage.json is not synchronized with agenda_web.json')

          coverage_rows = {str(row.get('id') or ''): row for row in cov_city.get('sources') or []}
          expected_coverages = [
              (balm, 'balmaceda_arte_joven_valpo', 'Balmaceda'),
              (fonck, 'museo_fonck', 'Museo Fonck'),
              (estadio, 'estadio_espanol_recreo', 'Estadio Espanol'),
          ]
          for report, source_id, label in expected_coverages:
              if report.get('coverage'):
                  row = coverage_rows.get(source_id)
                  if not row or row.get('status') not in {'producing', 'covered_elsewhere'}:
                      raise SystemExit(f'{label} coverage was not reflected in source-coverage.json')

          monitored_ids = {
              str(row.get('id') or '') for row in monitored_zero.get('sources') or []
              if row.get('fetch_ok') is True and row.get('verified_inactive') is True
          }
          for source_id in monitored_ids:
              row = coverage_rows.get(source_id)
              if not row or row.get('status') != 'monitored_confirmed_zero':
                  raise SystemExit(f'Verified inactive source not reflected in coverage: {source_id}')

          quality_summary = ((quality.get('cities') or {}).get('valparaiso-vina') or {}).get('summary') or {}
          if quality_summary.get('total_events') != len(events):
              raise SystemExit('event-quality.json is not synchronized with agenda_web.json')
          release_check = (readiness.get('checks') or {}).get('valparaiso-vina') or {}
          if not release_check.get('events_present') or not release_check.get('duplicates_zero'):
              raise SystemExit('release-readiness.json reports an invalid Valpo dataset')
          if readiness.get('blockers'):
              raise SystemExit(f'Release blockers after atomic composition: {readiness.get("blockers")}')

          print(f'ATOMIC_VALPO_PUBLICATION_OK total={len(events)} zero_now={cov_summary.get("zero_now")} covered={cov_summary.get("covered_elsewhere")} verified_zero={len(monitored_ids)}')
          PY

      - name: Generate permanent pages and canonical city landing on public main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python scripts/stage31_site_generator.py
          test -f sitemap.xml
          test -f gijon/index.html
          test -d evento/valparaiso
          test -d evento/gijon

      - name: Commit refreshed data, diagnostics and generated pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "agenda-cultural-event-pages[bot]"
          git config user.email "agenda-cultural-event-pages[bot]@users.noreply.github.com"
          git add \
            agenda_web.json \
            app/data/gijon/agenda_web.json \
            app/data/quality/high-value-sources.json \
            app/data/quality/museo-maritimo.json \
            app/data/quality/balmaceda-valpo.json \
            app/data/quality/visitavina-fonck.json \
            app/data/quality/visitavina-estadio-espanol.json \
            app/data/quality/portaltickets-editorial.json \
            app/data/quality/valpocultura-zero-recovery.json \
            app/data/quality/priority-zero-monitors.json \
            app/data/quality/title-quality.json \
            app/data/quality/content-quality.json \
            app/data/quality/source-coverage.json \
            app/data/quality/event-quality.json \
            app/data/quality/release-readiness.json \
            index.html evento sitemap.xml gijon
          if git diff --cached --quiet; then
            echo "Sources, diagnostics and permanent pages already synchronized."
            exit 0
          fi
          git commit -m "Actualiza fuentes, diagnósticos y fichas permanentes"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Publication workflow left unstaged changes before rebase:" >&2
            git status --short >&2
            exit 1
          fi
          git pull --rebase origin main
          git push origin HEAD:main
