name: Permanent event pages

# Protected-main writes are finalized by
# agenda-cultural-core/.github/workflows/finalize-public-agenda.yml

on:
  pull_request:
    branches: [main]
    paths:
      - "agenda_web.json"
      - "app/data/gijon/agenda_web.json"
      - "shared/**"
      - "scripts/generate_event_pages.py"
      - "scripts/generate_public_category_module.py"
      - "scripts/public_category_rules.py"
      - "scripts/stage31_site_generator.py"
      - "assets/event-page.css"
      - "assets/event-page.js"
      - "assets/accessibility.css"
      - "assets/city-page.css"
      - "assets/event-permalink.css"
      - "assets/web-event-enhancements.js"
      - "app/public-category-taxonomy.generated.mjs"
      - "app/public-category-rules.mjs"
      - "app/public-category-rules.test.mjs"
      - "app/category-normalizer.js"
      - "app/formation-cycle-classifier.js"
      - "app/exhibition-group-core.mjs"
      - "app/exhibition-group-core.test.mjs"
      - "app/data-pipeline.js"
      - "app/event-detail.js"
      - "app/pwa.js"
      - "app/service-worker.js"
      - "app/stage31-accessibility-seo.js"
      - "app/stage31-accessibility.css"
      - "tests/test_public_category_rules.py"
      - "tests/test_shared_public_taxonomy.py"
      - "tests/test_stage31.py"
      - ".github/workflows/event-pages.yml"
  push:
    branches: [main]
    paths:
      - "agenda_web.json"
      - "app/data/gijon/agenda_web.json"
      - "shared/**"
      - "scripts/generate_event_pages.py"
      - "scripts/generate_public_category_module.py"
      - "scripts/public_category_rules.py"
      - "scripts/stage31_site_generator.py"
      - "app/public-category-taxonomy.generated.mjs"
      - "app/public-category-rules.mjs"
      - "app/category-normalizer.js"
      - "app/formation-cycle-classifier.js"
      - "app/exhibition-group-core.mjs"
      - "app/data-pipeline.js"
      - "tests/test_public_category_rules.py"
      - "tests/test_shared_public_taxonomy.py"
      - ".github/workflows/event-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permanent-event-pages-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shared taxonomy focal contracts
        run: |
          set -euo pipefail
          python scripts/generate_public_category_module.py --check
          node --check app/public-category-taxonomy.generated.mjs
          node --check app/public-category-rules.mjs
          node --check app/formation-cycle-classifier.js
          node --check app/exhibition-group-core.mjs
          node app/public-category-rules.test.mjs
          node app/exhibition-group-core.test.mjs
          python -m unittest discover -s tests -p 'test_public_category_rules.py' -v
          python -m unittest discover -s tests -p 'test_shared_public_taxonomy.py' -v

      - name: Validate permanent-page runtime
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/generate_event_pages.py \
            scripts/generate_public_category_module.py \
            scripts/public_category_rules.py \
            scripts/stage31_site_generator.py \
            tests/test_public_category_rules.py \
            tests/test_shared_public_taxonomy.py \
            tests/test_stage31.py
          node --check assets/event-page.js
          node --check assets/web-event-enhancements.js
          node --check app/category-normalizer.js
          node --check app/data-pipeline.js
          node --check app/event-detail.js
          node --check app/stage31-accessibility-seo.js
          node --check app/pwa.js
          node --check app/service-worker.js
          python -m unittest discover -s tests -p 'test_stage31.py' -v
          python scripts/stage31_site_generator.py --check

      - name: Generate both city outputs in validation checkout
        run: |
          set -euo pipefail
          python scripts/stage31_site_generator.py
          test -f index.html
          test -f sitemap.xml
          test -f gijon/index.html
          test -d evento/valparaiso
          test -d evento/gijon
          echo "MULTICITY_PERMANENT_PAGES_VALIDATION_OK"

      - name: Enforce generated-output scope and read-only contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed_exact = {"index.html", "sitemap.xml"}
          allowed_prefixes = ("evento/", "gijon/")
          output = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          unexpected = []
          for raw in output.splitlines():
              path = raw[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              if path in allowed_exact or path.startswith(allowed_prefixes):
                  continue
              unexpected.append(path)
          if unexpected:
            raise SystemExit(f"Unexpected generated paths: {unexpected}")
          print("READ_ONLY_GENERATION_SCOPE_OK")
          PY
