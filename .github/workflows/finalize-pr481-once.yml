name: Finalize PR 481 once

on:
  push:
    branches:
      - ops/materialize-convocatoria-guard-20260825

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: ops/materialize-convocatoria-guard-20260825
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create clean source boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vivamos-release-finalizer[bot]"
          git config user.email "vivamos-release-finalizer[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git rm .github/workflows/finalize-pr481-once.yml
          git commit -m "Set PR #481 canonical release source boundary"
          git push origin HEAD:ops/materialize-convocatoria-guard-20260825
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PR481_SOURCE_BOUNDARY $(git rev-parse HEAD)"

      - name: Prepare canonical release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "6740af3d8861e89d8f68b308ccf983f2d3437cf0"
          python app/scripts/release_finalizer.py \
            --prepare \
            --base-ref origin/main \
            --source-sha "$SOURCE_SHA" \
            --source-pr 481

          python - <<'PY'
          import json
          from pathlib import Path
          provenance = json.loads(Path("app/data/release-provenance.json").read_text(encoding="utf-8"))
          assert provenance["base_sha"] == "6740af3d8861e89d8f68b308ccf983f2d3437cf0", provenance
          assert provenance["source_sha"] == __import__("os").environ["SOURCE_SHA"], provenance
          assert provenance["source_pr"] == 481, provenance
          assert provenance["release"] == 239, provenance
          print(f"PR481_RELEASE_PREPARED release=v{provenance['release']} base={provenance['base_sha']} source={provenance['source_sha']}")
          PY

      - name: Commit exact finalizer outputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          printf 'FINALIZER_CHANGED_FILES\n'
          printf '%s\n' "${changed[@]}"
          python - <<'PY'
          import subprocess
          allowed = {
              "app/release-version.js",
              "app/service-worker-assets.generated.js",
              "app/venue-registry.generated.mjs",
              "app/data/release-bundle.json",
              "app/data/release-provenance.json",
              "app/index.html",
          }
          rows = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          changed = {row[3:] for row in rows if row.strip()}
          unexpected = sorted(changed - allowed)
          required = {
              "app/release-version.js",
              "app/data/release-bundle.json",
              "app/data/release-provenance.json",
              "app/index.html",
          }
          missing = sorted(required - changed)
          if unexpected:
              raise SystemExit(f"Unexpected finalizer files: {unexpected}")
          if missing:
              raise SystemExit(f"Missing required finalizer files: {missing}")
          PY
          git add app/release-version.js app/service-worker-assets.generated.js app/venue-registry.generated.mjs app/data/release-bundle.json app/data/release-provenance.json app/index.html
          git diff --cached --quiet && { echo "No finalizer changes staged" >&2; exit 1; }
          git commit -m "[release-finalized] finalize PR #481 convocatoria dataset"
          FINALIZER_SHA="$(git rev-parse HEAD)"
          python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref "$FINALIZER_SHA"
          git push origin HEAD:ops/materialize-convocatoria-guard-20260825
          echo "PR481_FINALIZER_OK source=$SOURCE_SHA finalizer=$FINALIZER_SHA release=v239"
