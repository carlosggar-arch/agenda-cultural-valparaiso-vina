name: Finalize PR 485 once

on:
  push:
    branches:
      - fix/administrative-application-non-events-v241

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: fix/administrative-application-non-events-v241
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create clean source boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vivamos-release-finalizer[bot]"
          git config user.email "vivamos-release-finalizer[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "d3f1bb7b6d5b6fed1b7a753ff332eb5c191b6029"
          git rm .github/workflows/finalize-pr485-once.yml
          git commit -m "Set PR #485 canonical release source boundary"
          git push origin HEAD:fix/administrative-application-non-events-v241
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PR485_SOURCE_BOUNDARY $(git rev-parse HEAD)"

      - name: Prepare canonical release
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/release_finalizer.py \
            --prepare \
            --base-ref origin/main \
            --source-sha "$SOURCE_SHA" \
            --source-pr 485

          python - <<'PY'
          import json, os
          from pathlib import Path
          provenance = json.loads(Path("app/data/release-provenance.json").read_text(encoding="utf-8"))
          assert provenance["base_sha"] == "d3f1bb7b6d5b6fed1b7a753ff332eb5c191b6029", provenance
          assert provenance["source_sha"] == os.environ["SOURCE_SHA"], provenance
          assert provenance["source_pr"] == 485, provenance
          assert provenance["release"] == 241, provenance
          print(f"PR485_RELEASE_PREPARED release=v{provenance['release']} base={provenance['base_sha']} source={provenance['source_sha']}")
          PY

      - name: Commit exact finalizer outputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'FINALIZER_CHANGED_FILES\n'
          git status --porcelain
          python - <<'PY'
          import subprocess
          allowed = {
              "app/release-version.js",
              "app/service-worker-assets.generated.js",
              "app/venue-registry.generated.mjs",
              "app/data/release-bundle.json",
              "app/data/release-provenance.json",
              "app/index.html",
          }
          rows = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          changed = {row[3:] for row in rows if row.strip()}
          unexpected = sorted(changed - allowed)
          required = {
              "app/release-version.js",
              "app/data/release-bundle.json",
              "app/data/release-provenance.json",
              "app/index.html",
          }
          missing = sorted(required - changed)
          if unexpected:
              raise SystemExit(f"Unexpected finalizer files: {unexpected}")
          if missing:
              raise SystemExit(f"Missing required finalizer files: {missing}")
          PY
          git add app/release-version.js app/service-worker-assets.generated.js app/venue-registry.generated.mjs app/data/release-bundle.json app/data/release-provenance.json app/index.html
          git diff --cached --quiet && { echo "No finalizer changes staged" >&2; exit 1; }
          git commit -m "[release-finalized] finalize PR #485 administrative non-event guard"
          FINALIZER_SHA="$(git rev-parse HEAD)"
          python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref "$FINALIZER_SHA"
          git push origin HEAD:fix/administrative-application-non-events-v241
          echo "PR485_FINALIZER_OK source=$SOURCE_SHA finalizer=$FINALIZER_SHA release=v241"
