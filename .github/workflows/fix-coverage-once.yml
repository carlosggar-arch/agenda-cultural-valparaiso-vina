name: Reconcile source coverage once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-coverage-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-source-coverage-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild diagnostics and preserve all overrides
        run: |
          set -euo pipefail
          python app/scripts/refresh_quality_diagnostics.py
          python app/scripts/apply_source_coverage_overrides.py
          python app/scripts/apply_balmaceda_coverage.py
          python app/scripts/apply_fonck_coverage.py
          python app/scripts/apply_estadio_espanol_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path('app/data/quality/source-coverage.json').read_text(encoding='utf-8'))
          city = (coverage.get('cities') or {}).get('valparaiso-vina') or {}
          rows = {str(r.get('id') or ''): r for r in city.get('sources') or []}

          estadio = rows.get('estadio_espanol_recreo') or {}
          if estadio.get('status') != 'covered_elsewhere':
              raise SystemExit(f'Estadio Español coverage lost: {estadio}')
          if 'visitavina_estadio_espanol_recovery' not in (estadio.get('covered_by_other_sources') or []):
              raise SystemExit('Estadio Español provider missing')

          for source_id in ('sala_teatro_ipa', 'teatro_la_peste'):
              row = rows.get(source_id) or {}
              if row.get('status') != 'monitored_confirmed_zero' or row.get('verified_inactive') is not True:
                  raise SystemExit(f'Verified inactive monitor lost for {source_id}: {row}')

          summary = city.get('summary') or {}
          if int(summary.get('verified_inactive_zero_now') or 0) < 2:
              raise SystemExit(f'Verified inactive count not preserved: {summary}')
          if int(summary.get('attributed_events') or 0) != int(summary.get('total_events') or 0):
              raise SystemExit(f'Attribution mismatch: {summary}')
          print('SOURCE_COVERAGE_RECONCILED_OK', json.dumps(summary, ensure_ascii=False))
          PY

      - name: Commit reconciled diagnostics and remove one-time workflows
        run: |
          set -euo pipefail
          git config user.name "agenda-coverage-reconciler[bot]"
          git config user.email "agenda-coverage-reconciler[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-coverage-once.yml .github/workflows/materialize-estadio-once.yml
          git add -A \
            .github/workflows/fix-coverage-once.yml \
            .github/workflows/materialize-estadio-once.yml \
            app/data/quality/source-coverage.json \
            app/data/quality/event-quality.json \
            app/data/quality/release-readiness.json
          if git diff --cached --quiet; then
            echo "Coverage already reconciled."
            exit 0
          fi
          git commit -m "Reconcilia coberturas y monitores de fuentes"
          git pull --rebase origin main
          git push origin HEAD:main
