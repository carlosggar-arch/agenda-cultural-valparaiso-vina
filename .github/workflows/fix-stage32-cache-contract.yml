name: Fix Stage 3.2 cache contract

on:
  push:
    branches: [feature/stage32-private-analytics]
    paths:
      - ".github/workflows/fix-stage32-cache-contract.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage32-private-analytics
          fetch-depth: 0
      - name: Update cache contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/scripts/test_multi_city_ui.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const CACHE_VERSION = "v36";', 'const CACHE_VERSION = "v37";')
          s = s.replace('Multi-city v36 city selection, install and offline contracts: OK', 'Multi-city v37 city selection, install and offline contracts: OK')
          p.write_text(s, encoding='utf-8')
          PY
          python app/scripts/test_multi_city_ui.py
      - name: Commit test update
        run: |
          set -euo pipefail
          git config user.name "agenda-cultural-stage32[bot]"
          git config user.email "agenda-cultural-stage32[bot]@users.noreply.github.com"
          git add app/scripts/test_multi_city_ui.py
          git commit -m "Update PWA v37 multi-city cache contract"
          git pull --rebase origin feature/stage32-private-analytics
          git push origin HEAD:feature/stage32-private-analytics
