name: Gijon V1 stability

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/favorites-core.mjs"
      - "assets/plan-ahead-core.mjs"
      - "tests/favorites-core.test.mjs"
      - "tests/plan-ahead-core.test.mjs"
      - "docs/GIJON_V1_STABLE.md"
      - ".github/workflows/gijon-v1-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gijon-v1-stability-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout public production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Gijon V1 data and multi-city contracts
        run: |
          python app/scripts/test_gijon_v1_stable.py
          python app/scripts/test_visual_multicity_v30.py

      - name: Validate favorites and planning cores
        run: node --test tests/favorites-core.test.mjs tests/plan-ahead-core.test.mjs

      - name: Validate both cities in a real browser
        run: python app/scripts/test_runtime_browser.py

      - name: Validate favorites and Mis planes in a real browser
        run: python app/scripts/test_favorites_browser.py
