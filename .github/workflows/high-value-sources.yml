name: High-value cultural sources

on:
  pull_request:
    paths:
      - "app/data/high_value_sources.json"
      - "app/scripts/fetch_high_value_sources.py"
      - "app/scripts/test_high_value_sources.py"
      - ".github/workflows/high-value-sources.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 9 * * *"

permissions:
  contents: write

concurrency:
  group: high-value-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile app/scripts/fetch_high_value_sources.py app/scripts/test_high_value_sources.py
      - name: Source regression tests
        run: python app/scripts/test_high_value_sources.py
      - name: Live fetch dry-run
        run: python app/scripts/fetch_high_value_sources.py --no-write

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh supplemental sources
        run: python app/scripts/fetch_high_value_sources.py
      - name: Re-run source regression tests
        run: python app/scripts/test_high_value_sources.py
      - name: Commit verified dataset changes
        shell: bash
        run: |
          if git diff --quiet -- agenda_web.json app/data/gijon/agenda_web.json app/data/quality/high-value-sources.json; then
            echo "No high-value source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda_web.json app/data/gijon/agenda_web.json app/data/quality/high-value-sources.json
          git commit -m "Refresh high-value cultural sources"
          git push
