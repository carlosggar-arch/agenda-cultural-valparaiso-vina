name: Maintenance automation guard

on:
  pull_request:
    branches: [main]
    paths:
      - "app/data/source-registry.json"
      - "app/scripts/event_page_tools.py"
      - "app/scripts/revalidate_upcoming_events.py"
      - "app/scripts/schedule_authority_guard.py"
      - "app/scripts/parser_drift_guard.py"
      - "app/scripts/audit_source_coherence.py"
      - "app/scripts/audit_and_recover_images.py"
      - "app/scripts/atomic_maintenance_hook.py"
      - "app/scripts/apply_estadio_espanol_coverage.py"
      - "app/scripts/test_maintenance_automation.py"
      - "app/scripts/test_source_coherence_registry.py"
      - "app/scripts/test_schedule_authority_guard.py"
      - "app/scripts/test_atomic_publication_contract.py"
      - ".github/workflows/maintenance-automation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate schedule authority and single-writer contract
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/event_page_tools.py \
            app/scripts/revalidate_upcoming_events.py \
            app/scripts/schedule_authority_guard.py \
            app/scripts/parser_drift_guard.py \
            app/scripts/audit_source_coherence.py \
            app/scripts/audit_and_recover_images.py \
            app/scripts/atomic_maintenance_hook.py \
            app/scripts/apply_estadio_espanol_coverage.py \
            app/scripts/test_maintenance_automation.py \
            app/scripts/test_source_coherence_registry.py \
            app/scripts/test_schedule_authority_guard.py \
            app/scripts/test_atomic_publication_contract.py
          python app/scripts/test_maintenance_automation.py
          python app/scripts/test_source_coherence_registry.py
          python app/scripts/audit_source_coherence.py --no-write --fail-on-critical
          python app/scripts/test_schedule_authority_guard.py
          python app/scripts/test_atomic_publication_contract.py

      - name: Exercise live reads without writing
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python app/scripts/revalidate_upcoming_events.py --days 10 --max-fetch 20 --no-write
          python app/scripts/schedule_authority_guard.py --days 120 --max-fetch 20 --no-write
          python app/scripts/audit_and_recover_images.py --max-fetch 20 --no-write
          python app/scripts/audit_source_coherence.py --no-write --fail-on-critical

          echo "Manual maintenance guard is read-only. Automatic maintenance runs inside Permanent event pages, the sole dataset writer."
