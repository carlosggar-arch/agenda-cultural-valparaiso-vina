name: Materialize convocatoria guard once

on:
  push:
    branches:
      - ops/materialize-convocatoria-guard-20260825

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: ops/materialize-convocatoria-guard-20260825
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply shared content-quality guard to Valpo dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          target = "agenda_0a67eaa41934144b3408c224"
          data = json.loads(Path("agenda_web.json").read_text(encoding="utf-8"))
          matches = [event for event in data.get("events", []) if event.get("id") == target]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one target before guard, found {len(matches)}")
          print(f"TARGET_BEFORE id={target} title={matches[0].get('title')!r}")
          PY

          python app/scripts/apply_content_quality_guard.py \
            --dataset agenda_web.json \
            --report /tmp/content-quality-materialization.json

          python - <<'PY'
          import json
          from pathlib import Path
          target = "agenda_0a67eaa41934144b3408c224"
          data = json.loads(Path("agenda_web.json").read_text(encoding="utf-8"))
          report = json.loads(Path("/tmp/content-quality-materialization.json").read_text(encoding="utf-8"))
          matches = [event for event in data.get("events", []) if event.get("id") == target]
          if matches:
              raise SystemExit("Target convocatoria still present after shared guard")
          expected = [{
              "id": target,
              "title": "Envía tu foto hasta el: 24/08",
              "reason": "call_for_submissions_deadline_not_event",
          }]
          if report.get("quarantined") != expected:
              raise SystemExit(f"Unexpected quarantine scope: {report.get('quarantined')!r}")
          if report.get("removed") != 1:
              raise SystemExit(f"Expected exactly one removed record, got {report.get('removed')!r}")
          for key in ("html_cleaned", "titles_recovered", "duplicates_consolidated", "expired_removed", "past_occurrences_pruned"):
              if report.get(key):
                  raise SystemExit(f"Unexpected collateral guard changes in {key}: {report.get(key)!r}")
          counts = data.get("counts") or {}
          if counts.get("total") != report.get("events_after"):
              raise SystemExit("Dataset counts.total is not synchronized after guard")
          print(
              "CONVOCATORIA_MATERIALIZED_OK "
              f"id={target} before={report.get('events_before')} after={report.get('events_after')} "
              "reason=call_for_submissions_deadline_not_event collateral=0"
          )
          PY

      - name: Commit generated dataset and self-remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vivamos-materialization[bot]"
          git config user.email "vivamos-materialization[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-convocatoria-once.yml
          git add agenda_web.json
          mapfile -t changed < <(git diff --cached --name-only)
          if [[ "${#changed[@]}" -ne 2 || "${changed[0]}" != ".github/workflows/materialize-convocatoria-once.yml" || "${changed[1]}" != "agenda_web.json" ]]; then
            printf 'Unexpected staged files:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          git commit -m "Materialize convocatoria content-quality guard in Valpo dataset"
          git push origin HEAD:ops/materialize-convocatoria-guard-20260825
