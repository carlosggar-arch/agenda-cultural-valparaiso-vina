name: Materialize Estadio Espanol once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-estadio-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-estadio-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose current Valpo supplements including Estadio Espanol
        run: |
          set -euo pipefail
          python app/scripts/test_visitavina_estadio_espanol.py
          python app/scripts/test_estadio_espanol_coverage.py
          python app/scripts/refresh_museo_maritimo.py
          python app/scripts/refresh_balmaceda_valpo_bounded.py
          python app/scripts/refresh_visitavina_fonck.py
          python app/scripts/refresh_visitavina_estadio_espanol.py
          python app/scripts/refresh_portaltickets_editorial.py
          python app/scripts/refresh_valpocultura_zero_recovery.py
          python app/scripts/refresh_priority_zero_monitors.py
          python app/scripts/validate_portaltickets_editorial.py
          python app/scripts/apply_title_quality_guard.py
          python app/scripts/apply_content_quality_guard.py
          python app/scripts/refresh_quality_diagnostics.py
          python app/scripts/apply_source_coverage_overrides.py
          python app/scripts/apply_balmaceda_coverage.py
          python app/scripts/apply_fonck_coverage.py
          python app/scripts/apply_estadio_espanol_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          dataset = json.loads((root / 'agenda_web.json').read_text(encoding='utf-8'))
          estadio = json.loads((root / 'app/data/quality/visitavina-estadio-espanol.json').read_text(encoding='utf-8'))
          coverage = json.loads((root / 'app/data/quality/source-coverage.json').read_text(encoding='utf-8'))
          readiness = json.loads((root / 'app/data/quality/release-readiness.json').read_text(encoding='utf-8'))

          events = [e for e in dataset.get('events') or [] if e.get('source_id') == 'visitavina_estadio_espanol_recovery']
          if len(events) != int(estadio.get('events_published') or 0) or len(events) < 1:
              raise SystemExit(f'Estadio Espanol materialization mismatch: dataset={len(events)} report={estadio.get("events_published")}')
          starts = [str((e.get('schedule') or {}).get('start') or '') for e in events]
          if not any(value.startswith('2026-08-27T19:30:00') for value in starts):
              raise SystemExit(f'Expected verified 2026-08-27 19:30 Estadio Espanol event, got {starts}')

          city = (coverage.get('cities') or {}).get('valparaiso-vina') or {}
          row = next((r for r in city.get('sources') or [] if r.get('id') == 'estadio_espanol_recreo'), None)
          if not row or row.get('status') not in {'producing', 'covered_elsewhere'}:
              raise SystemExit('estadio_espanol_recreo remains unresolved')
          if readiness.get('blockers'):
              raise SystemExit(f'Release blockers after composition: {readiness.get("blockers")}')
          if not ((readiness.get('checks') or {}).get('valparaiso-vina') or {}).get('duplicates_zero'):
              raise SystemExit('Duplicate check failed after Estadio Espanol composition')

          print('ESTADIO_ESPANOL_MATERIALIZED_OK', json.dumps({
              'counts': dataset.get('counts'),
              'events': len(events),
              'starts': starts,
              'source_status': row.get('status'),
              'covered_by': row.get('covered_by_other_sources'),
              'zero_now': (city.get('summary') or {}).get('zero_now'),
          }, ensure_ascii=False))
          PY

      - name: Commit composed dataset and synchronized diagnostics
        run: |
          set -euo pipefail
          git config user.name "agenda-estadio-materializer[bot]"
          git config user.email "agenda-estadio-materializer[bot]@users.noreply.github.com"
          git add \
            agenda_web.json \
            app/data/quality/museo-maritimo.json \
            app/data/quality/balmaceda-valpo.json \
            app/data/quality/visitavina-fonck.json \
            app/data/quality/visitavina-estadio-espanol.json \
            app/data/quality/portaltickets-editorial.json \
            app/data/quality/valpocultura-zero-recovery.json \
            app/data/quality/priority-zero-monitors.json \
            app/data/quality/content-quality.json \
            app/data/quality/source-coverage.json \
            app/data/quality/event-quality.json \
            app/data/quality/release-readiness.json
          if git diff --cached --quiet; then
            echo "Estadio Espanol already materialized."
            exit 0
          fi
          git commit -m "Materializa cobertura futura de Estadio Espanol"
          git pull --rebase origin main
          git push origin HEAD:main
