name: Multi-city pre-release validation

on:
  push:
    branches:
      - feature/multi-city-pwa
    paths:
      - "app/**"
      - "index.html"
      - ".github/workflows/multi-city-pre-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "index.html"
      - ".github/workflows/multi-city-pre-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile preview Python and JavaScript
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/update_gijon.py \
            app/scripts/fetch_gijon_xhtml.py \
            app/scripts/test_gijon_editorial.py \
            app/scripts/test_multi_city_ui.py \
            app/scripts/test_pwa.py \
            app/scripts/test_pre_release.py \
            app/scripts/test_runtime_browser.py \
            app/scripts/test_density_runtime.py \
            app/scripts/test_contextual_filters.py
          node --check app/app.js
          node --check app/pwa.js
          node --check app/service-worker.js
          node --check app/contextual-filters.js
          node --check app/density-polish.js
          node --check app/sources-toggle.js

      - name: Run existing multi-city contracts
        run: |
          set -euo pipefail
          python app/scripts/test_gijon_editorial.py
          python app/scripts/test_multi_city_ui.py
          python app/scripts/test_pwa.py
          python app/scripts/test_contextual_filters.py

      - name: Verify canonical root entry
        run: |
          set -euo pipefail
          grep -F 'url=./app/?city=valparaiso' index.html
          grep -F 'new URL("./app/", window.location.href)' index.html
          grep -F 'target.searchParams.set("city", city)' index.html
          grep -F 'window.location.replace(target.href)' index.html
          grep -F 'const APP_VERSION = "PWA v21"' app/pwa.js
          grep -F 'const CACHE_VERSION = "v21"' app/service-worker.js
          grep -F 'sourceDiagnosticText' app/sources-toggle.js
          grep -F 'source_diagnostics' app/sources-toggle.js

      - name: Run browser runtime contract
        run: |
          set -euo pipefail
          python app/scripts/test_runtime_browser.py
          python app/scripts/test_density_runtime.py

      - name: Run joint pre-release contract
        run: python app/scripts/test_pre_release.py

      - name: Verify production root isolation
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BASE="$(git merge-base origin/main HEAD)"
          PROTECTED=(agenda.js agenda-core.mjs agenda_web.json)
          if ! git diff --quiet "$BASE" HEAD -- "${PROTECTED[@]}"; then
            echo "A protected production-root data/runtime file changed in the multi-city PR:"
            git diff --name-only "$BASE" HEAD -- "${PROTECTED[@]}"
            exit 1
          fi

          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(app/|index\.html$|\.github/workflows/multi-city-pre-release\.yml$)' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected paths in multi-city PR:"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi

          echo "Canonical root parity and production data isolation: OK"
