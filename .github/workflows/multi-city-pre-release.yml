name: Multi-city pre-release validation

on:
  push:
    branches:
      - main
      - feature/multi-city-pwa
    paths:
      - "app/**"
      - "index.html"
      - "manifest.webmanifest"
      - "assets/web-event-enhancements.js"
      - "assets/event-media-layout.css"
      - "assets/event-schedule-display.mjs"
      - "assets/root-combined-filter-core.mjs"
      - "assets/root-combined-filters.js"
      - "assets/root-combined-filters.css"
      - "assets/event-page.css"
      - "assets/event-page.js"
      - "assets/event-permalink.css"
      - "assets/accessibility.css"
      - "assets/city-page.css"
      - "assets/plan-ahead-core.mjs"
      - "assets/plan-ahead-web.js"
      - "assets/plan-ahead.css"
      - "assets/favorites-core.mjs"
      - "assets/favorites-view.mjs"
      - "assets/favorites-reminders.mjs"
      - "assets/favorites-web.js"
      - "assets/favorites-event-page.js"
      - "assets/favorites.css"
      - "scripts/generate_event_pages.py"
      - "scripts/stage31_site_generator.py"
      - "tests/test_stage31.py"
      - "tests/root-combined-filters.test.mjs"
      - "tests/plan-ahead-core.test.mjs"
      - "tests/favorites-core.test.mjs"
      - "tests/favorites-reminders.test.mjs"
      - ".github/workflows/root-combined-filters.yml"
      - ".github/workflows/event-pages.yml"
      - ".github/workflows/multi-city-pre-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "index.html"
      - "manifest.webmanifest"
      - "assets/web-event-enhancements.js"
      - "assets/event-media-layout.css"
      - "assets/event-schedule-display.mjs"
      - "assets/root-combined-filter-core.mjs"
      - "assets/root-combined-filters.js"
      - "assets/root-combined-filters.css"
      - "assets/event-page.css"
      - "assets/event-page.js"
      - "assets/event-permalink.css"
      - "assets/accessibility.css"
      - "assets/city-page.css"
      - "assets/plan-ahead-core.mjs"
      - "assets/plan-ahead-web.js"
      - "assets/plan-ahead.css"
      - "assets/favorites-core.mjs"
      - "assets/favorites-view.mjs"
      - "assets/favorites-reminders.mjs"
      - "assets/favorites-web.js"
      - "assets/favorites-event-page.js"
      - "assets/favorites.css"
      - "scripts/generate_event_pages.py"
      - "scripts/stage31_site_generator.py"
      - "tests/test_stage31.py"
      - "tests/root-combined-filters.test.mjs"
      - "tests/plan-ahead-core.test.mjs"
      - "tests/favorites-core.test.mjs"
      - "tests/favorites-reminders.test.mjs"
      - ".github/workflows/root-combined-filters.yml"
      - ".github/workflows/event-pages.yml"
      - ".github/workflows/multi-city-pre-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile preview Python and JavaScript
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/update_gijon.py \
            app/scripts/fetch_gijon_xhtml.py \
            app/scripts/test_gijon_editorial.py \
            app/scripts/test_gijon_source_detail.py \
            app/scripts/test_multi_city_ui.py \
            app/scripts/test_visual_multicity_v30.py \
            app/scripts/test_pwa.py \
            app/scripts/test_pre_release.py \
            app/scripts/test_release_guard.py \
            app/scripts/test_first_render_browser.py \
            app/scripts/test_runtime_browser.py \
            app/scripts/test_event_actions_browser.py \
            app/scripts/test_schedule_interaction_browser.py \
            app/scripts/test_pwa_install_browser.py \
            app/scripts/test_favorites_browser.py \
            app/scripts/test_density_runtime.py \
            app/scripts/test_contextual_filters.py \
            scripts/generate_event_pages.py \
            scripts/stage31_site_generator.py \
            tests/test_stage31.py
          node --check app/app.js
          node --check app/pwa.js
          node --check app/service-worker.js
          node --check app/release-version.js
          node --check app/stage31-accessibility-seo.js
          node --check app/combined-filters.js
          node --check app/combined-filters-polish.js
          node --check app/density-polish.js
          node --check app/sources-toggle.js
          node --check app/schedule-display.js
          node --check app/gijon-venue-hours.js
          node --check app/event-detail.js
          node --check app/plan-ahead.js
          node --check app/favorites.js
          node --check assets/web-event-enhancements.js
          node --check assets/event-schedule-display.mjs
          node --check assets/root-combined-filters.js
          node --check assets/root-combined-filter-core.mjs
          node --check assets/event-page.js
          node --check assets/plan-ahead-web.js
          node --check assets/plan-ahead-core.mjs
          node --check assets/favorites-web.js
          node --check assets/favorites-event-page.js
          node --check assets/favorites-core.mjs
          node --check assets/favorites-view.mjs
          node --check assets/favorites-reminders.mjs

      - name: Run current multi-city contracts
        run: |
          set -euo pipefail
          python app/scripts/test_gijon_editorial.py
          python app/scripts/test_gijon_source_detail.py
          python app/scripts/test_multi_city_ui.py
          python app/scripts/test_visual_multicity_v30.py
          python app/scripts/test_contextual_filters.py
          node app/scripts/test_schedule_display.mjs
          python app/scripts/test_release_guard.py
          python app/scripts/test_pre_release.py
          node --test tests/root-combined-filters.test.mjs
          node --test tests/plan-ahead-core.test.mjs
          node --test tests/favorites-core.test.mjs
          node --test tests/favorites-reminders.test.mjs
          python -m unittest discover -s tests -p 'test_stage31.py' -v
          python scripts/generate_event_pages.py --check
          python scripts/stage31_site_generator.py --check

      - name: Verify independent Valparaiso web and current PWA shell
        run: |
          set -euo pipefail
          grep -F '<div class="mosaic-top"' index.html
          grep -F '<div class="mosaic-wave"' index.html
          grep -F '<div class="footer-mosaic"' index.html
          grep -F './assets/web-event-enhancements.js' index.html
          grep -F './plan-ahead-web.js?v=20260817' assets/web-event-enhancements.js
          grep -F './favorites-web.js?v=20260817' assets/web-event-enhancements.js
          grep -F 'favorites-event-page.js?v=20260817' assets/event-page.js
          ! grep -F 'window.location.replace(target.href)' index.html
          grep -F '"id": "./app/"' manifest.webmanifest
          grep -F '"start_url": "./app/"' manifest.webmanifest
          grep -F '"scope": "./app/"' manifest.webmanifest
          grep -F '"name": "¡Vivamos!"' manifest.webmanifest
          grep -F '<link rel="stylesheet" href="./compact-top.css">' app/index.html
          grep -F '<link rel="stylesheet" href="./header-redesign.css">' app/index.html
          grep -F '<script src="./release-version.js"></script>' app/index.html
          grep -F 'mobile-experience.css?v=20260817-topcontrols2' app/index.html
          ! grep -F 'document.createElement("style")' app/compact-top.js
          grep -F 'globalThis.__VIVAMOS_RELEASE__' app/pwa.js
          grep -F 'import "./plan-ahead.js";' app/pwa.js
          grep -F 'import "./favorites.js";' app/pwa.js
          grep -F 'import "./stage31-accessibility-seo.js";' app/pwa.js
          grep -F 'importScripts("./release-version.js")' app/service-worker.js
          grep -F '"./release-version.js"' app/service-worker.js
          grep -F '"./plan-ahead.js"' app/service-worker.js
          grep -F '"./favorites.js"' app/service-worker.js
          grep -F '"./mis-planes.html"' app/service-worker.js
          grep -F '"./stage31-accessibility-seo.js"' app/service-worker.js
          grep -F '"./stage31-accessibility.css"' app/service-worker.js
          grep -F '"../assets/plan-ahead-core.mjs"' app/service-worker.js
          grep -F '"../assets/plan-ahead.css"' app/service-worker.js
          grep -F '"../assets/favorites-core.mjs"' app/service-worker.js
          grep -F '"../assets/favorites-view.mjs"' app/service-worker.js
          grep -F '"../assets/favorites-reminders.mjs"' app/service-worker.js
          grep -F '"../assets/favorites.css"' app/service-worker.js
          grep -F '"./compact-top.css"' app/service-worker.js
          grep -F '"./combined-filters.js"' app/service-worker.js
          grep -F '"./combined-filters.css"' app/service-worker.js
          grep -F '"./combined-filters-polish.js"' app/service-worker.js
          grep -F '"./gijon-venue-hours.js"' app/service-worker.js
          grep -F '"./event-detail.js"' app/service-worker.js
          ! grep -F 'client.navigate(' app/service-worker.js
          ! grep -F 'refreshOpenWindows' app/service-worker.js
          grep -F 'object-fit: contain !important' assets/event-media-layout.css
          grep -F '.card-media > button' assets/event-media-layout.css
          grep -F 'export function formatSchedule' assets/event-schedule-display.mjs
          grep -F 'sourceDiagnosticText' app/sources-toggle.js
          grep -F 'source_diagnostics' app/sources-toggle.js

      - name: Run browser runtime contract
        run: |
          set -euo pipefail
          python app/scripts/test_first_render_browser.py
          python app/scripts/test_runtime_browser.py
          python app/scripts/test_event_actions_browser.py
          python app/scripts/test_schedule_interaction_browser.py
          python app/scripts/test_pwa_install_browser.py
          python app/scripts/test_favorites_browser.py
          python app/scripts/test_density_runtime.py

      - name: Verify production data/runtime isolation
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BASE="$(git merge-base origin/main HEAD)"
          PROTECTED=(agenda.js agenda-core.mjs agenda_web.json assets/agenda.js assets/agenda-core.mjs)
          if ! git diff --quiet "$BASE" HEAD -- "${PROTECTED[@]}"; then
            echo "A protected production data/runtime file changed unexpectedly:"
            git diff --name-only "$BASE" HEAD -- "${PROTECTED[@]}"
            exit 1
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(app/|index\.html$|manifest\.webmanifest$|assets/web-event-enhancements\.js$|assets/event-media-layout\.css$|assets/event-schedule-display\.mjs$|assets/root-combined-filter-core\.mjs$|assets/root-combined-filters\.js$|assets/root-combined-filters\.css$|assets/event-page\.css$|assets/event-page\.js$|assets/event-permalink\.css$|assets/accessibility\.css$|assets/city-page\.css$|assets/plan-ahead-core\.mjs$|assets/plan-ahead-web\.js$|assets/plan-ahead\.css$|assets/favorites-core\.mjs$|assets/favorites-view\.mjs$|assets/favorites-reminders\.mjs$|assets/favorites-web\.js$|assets/favorites-event-page\.js$|assets/favorites\.css$|scripts/generate_event_pages\.py$|scripts/stage31_site_generator\.py$|tests/test_stage31\.py$|tests/root-combined-filters\.test\.mjs$|tests/plan-ahead-core\.test\.mjs$|tests/favorites-core\.test\.mjs$|tests/favorites-reminders\.test\.mjs$|\.github/workflows/root-combined-filters\.yml$|\.github/workflows/event-pages\.yml$|\.github/workflows/multi-city-pre-release\.yml$)' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected paths in web/app PR:"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi
          echo "Independent Valparaiso web and app isolation: OK"
