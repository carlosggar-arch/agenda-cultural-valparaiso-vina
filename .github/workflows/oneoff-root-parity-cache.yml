name: One-off root parity cache bump

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - ".github/workflows/oneoff-root-parity-cache.yml"

permissions:
  contents: write

jobs:
  bump:
    if: github.head_ref == 'web/root-app-parity-race-safe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/root-app-parity-race-safe
          fetch-depth: 0
      - name: Bump root parity runtime cache key
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = './assets/root-app-parity-runtime.mjs?v=20260820-app-parity2'
          new = './assets/root-app-parity-runtime.mjs?v=20260820-app-parity3'
          if old not in text:
              raise SystemExit("Expected parity2 cache key not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump root APP parity runtime cache key"
          git push origin HEAD:web/root-app-parity-race-safe
