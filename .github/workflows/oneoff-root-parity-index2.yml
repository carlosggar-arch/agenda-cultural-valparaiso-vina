name: One-off root parity index patch 2

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - ".github/workflows/oneoff-root-parity-index2.yml"

permissions:
  contents: write

jobs:
  patch-index:
    if: github.head_ref == 'web/root-app-parity-clean2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: web/root-app-parity-clean2
          fetch-depth: 0

      - name: Keep parity adapter before existing WEB scripts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '  <script type="module" src="./assets/root-app-parity-runtime.mjs?v=20260820-app-parity1"></script>'
          new = '''  <script type="module" src="./assets/root-app-parity-runtime.mjs?v=20260820-app-parity2"></script>\n  <script type="module" src="./assets/agenda.js?v=20260729-recommended-hidden"></script>\n  <script type="module" src="./assets/web-event-enhancements.js?v=20260820-webparity3"></script>'''
          if old not in text:
              raise SystemExit("Expected parity-only root entrypoint not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          node --test tests/root-app-parity-contract.test.mjs
          if git status --porcelain | awk '{print $2}' | grep -q '^app/'; then
            echo "ERROR: APP file modified"
            exit 1
          fi

      - name: Commit root index only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load root parity adapter before WEB renderers"
          git push origin HEAD:web/root-app-parity-clean2
