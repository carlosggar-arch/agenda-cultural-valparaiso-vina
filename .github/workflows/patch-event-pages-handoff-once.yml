name: One-shot event pages handoff patch

on:
  push:
    branches:
      - fix/event-pages-handoff-identity-20260818
    paths:
      - ".github/workflows/patch-event-pages-handoff-once.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-event-pages-handoff-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-pages-handoff-identity-20260818
          fetch-depth: 0

      - name: Patch Permanent event pages writer identity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/event-pages.yml')
          text = path.read_text(encoding='utf-8')

          permissions_old = "permissions:\n  contents: write\n"
          permissions_new = "permissions:\n  contents: read\n"
          if text.count(permissions_old) != 1:
              raise SystemExit('Unexpected event-pages permissions block')
          text = text.replace(permissions_old, permissions_new, 1)

          dollar = '$'
          checkout_old = (
              "      - name: Checkout\n"
              "        uses: actions/checkout@v4\n"
              "        with:\n"
              "          fetch-depth: 0\n"
              f"          ref: {dollar}{{{{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}}}\n"
          )
          checkout_new = checkout_old + "          persist-credentials: false\n"
          if text.count(checkout_old) != 1:
              raise SystemExit('Unexpected event-pages checkout block')
          text = text.replace(checkout_old, checkout_new, 1)

          marker = "      - name: Commit refreshed data, diagnostics and generated pages\n"
          if text.count(marker) != 1:
              raise SystemExit('Unexpected event-pages commit marker')

          client_expr = dollar + "{{ vars.AGENDA_HANDOFF_APP_CLIENT_ID }}"
          key_expr = dollar + "{{ secrets.AGENDA_HANDOFF_APP_PRIVATE_KEY }}"
          token_expr = dollar + "{{ steps.handoff_app_token.outputs.token }}"

          handoff = f'''      - name: Verify Agenda Cultural Handoff credentials
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          APP_CLIENT_ID: {client_expr}
          APP_PRIVATE_KEY: {key_expr}
        run: |
          set -euo pipefail
          test -n "$APP_CLIENT_ID" || {{ echo "AGENDA_HANDOFF_APP_CLIENT_ID is not configured for this repository." >&2; exit 1; }}
          test -n "$APP_PRIVATE_KEY" || {{ echo "AGENDA_HANDOFF_APP_PRIVATE_KEY is not configured for this repository." >&2; exit 1; }}
          echo "AGENDA_HANDOFF_CREDENTIALS_OK"

      - name: Create Agenda Cultural Handoff token
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: handoff_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: {client_expr}
          private-key: {key_expr}
          owner: carlosggar-arch
          repositories: agenda-cultural-valparaiso-vina
          permission-contents: write

      - name: Configure protected main remote with Agenda Cultural Handoff
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APP_TOKEN: {token_expr}
        run: |
          set -euo pipefail
          test -n "$APP_TOKEN"
          git remote set-url origin "https://x-access-token:${{APP_TOKEN}}@github.com/${{GITHUB_REPOSITORY}}.git"
          echo "Protected-main writes delegated to Agenda Cultural Handoff."

'''
          text = text.replace(marker, handoff + marker, 1)

          old_name = 'git config user.name "agenda-cultural-event-pages[bot]"'
          old_email = 'git config user.email "agenda-cultural-event-pages[bot]@users.noreply.github.com"'
          if text.count(old_name) != 1 or text.count(old_email) != 1:
              raise SystemExit('Unexpected event-pages commit identity')
          text = text.replace(old_name, 'git config user.name "agenda-cultural-handoff[bot]"', 1)
          text = text.replace(old_email, 'git config user.email "actions@users.noreply.github.com"', 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -- .github/workflows/patch-event-pages-handoff-once.yml
          git diff --check
          git diff -- .github/workflows/event-pages.yml

      - name: Commit exact patch and remove patcher
        run: |
          set -euo pipefail
          git config user.name "agenda-cultural-maintenance[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/event-pages.yml .github/workflows/patch-event-pages-handoff-once.yml
          git commit -m "Use Agenda Cultural Handoff for event-page writes"
          git push origin HEAD:fix/event-pages-handoff-identity-20260818
