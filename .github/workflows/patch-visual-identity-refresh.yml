name: One-shot visual identity integration

on:
  push:
    branches:
      - feature/visual-identity-refresh
    paths:
      - .github/workflows/patch-visual-identity-refresh.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-identity-refresh
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate city and category visual identity
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('app/index.html')
          index = index_path.read_text(encoding='utf-8')
          anchor = '  <link rel="stylesheet" href="./app.css">\n'
          addition = anchor + '  <link rel="stylesheet" href="./visual-identity.css">\n'
          if 'visual-identity.css' not in index:
              if index.count(anchor) != 1:
                  raise SystemExit('index stylesheet anchor not unique')
              index = index.replace(anchor, addition, 1)
          index_path.write_text(index, encoding='utf-8')

          app_path = Path('app/app.js')
          app = app_path.read_text(encoding='utf-8')
          event_anchor = '  card.dataset.eventId = event?.id || "";\n'
          event_addition = event_anchor + '  card.dataset.category = eventCategoryId(event);\n'
          if 'card.dataset.category = eventCategoryId(event);' not in app:
              if app.count(event_anchor) != 1:
                  raise SystemExit('event card anchor not unique')
              app = app.replace(event_anchor, event_addition, 1)
          city_anchor = '  document.documentElement.lang = id === "gijon" ? "es-ES" : "es-CL";\n'
          city_addition = city_anchor + '  document.documentElement.dataset.city = id;\n'
          if 'document.documentElement.dataset.city = id;' not in app:
              if app.count(city_anchor) != 1:
                  raise SystemExit('city theme anchor not unique')
              app = app.replace(city_anchor, city_addition, 1)
          app_path.write_text(app, encoding='utf-8')

          pwa_path = Path('app/pwa.js')
          pwa = pwa_path.read_text(encoding='utf-8').replace('const APP_VERSION = "PWA v6";', 'const APP_VERSION = "PWA v7";')
          pwa_path.write_text(pwa, encoding='utf-8')

          sw_path = Path('app/service-worker.js')
          sw = sw_path.read_text(encoding='utf-8').replace('const CACHE_VERSION = "v6";', 'const CACHE_VERSION = "v7";')
          shell_anchor = '  "./app.css",\n'
          if '"./visual-identity.css"' not in sw:
              if sw.count(shell_anchor) != 1:
                  raise SystemExit('service worker shell anchor not unique')
              sw = sw.replace(shell_anchor, shell_anchor + '  "./visual-identity.css",\n', 1)
          sw_path.write_text(sw, encoding='utf-8')

          test_path = Path('app/scripts/test_pwa.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('const APP_VERSION = "PWA v6";', 'const APP_VERSION = "PWA v7";')
          test = test.replace('const CACHE_VERSION = "v6"', 'const CACHE_VERSION = "v7"')
          test_path.write_text(test, encoding='utf-8')

          ui_test_path = Path('app/scripts/test_multi_city_ui.py')
          ui_test = ui_test_path.read_text(encoding='utf-8').replace('const CACHE_VERSION = "v6";', 'const CACHE_VERSION = "v7";')
          ui_test_path.write_text(ui_test, encoding='utf-8')

          visual_test = Path('app/scripts/test_visual_identity.py')
          visual_test.write_text('''from pathlib import Path\n\nAPP = Path("app")\nindex = (APP / "index.html").read_text(encoding="utf-8")\napp_js = (APP / "app.js").read_text(encoding="utf-8")\npwa = (APP / "pwa.js").read_text(encoding="utf-8")\nsw = (APP / "service-worker.js").read_text(encoding="utf-8")\ncss = (APP / "visual-identity.css").read_text(encoding="utf-8")\n\nassert '<link rel="stylesheet" href="./visual-identity.css">' in index\nassert 'document.documentElement.dataset.city = id;' in app_js\nassert 'card.dataset.category = eventCategoryId(event);' in app_js\nassert 'const APP_VERSION = "PWA v7";' in pwa\nassert 'const CACHE_VERSION = "v7"' in sw\nassert '"./visual-identity.css"' in sw.split("const SHELL_ASSETS = [", 1)[1].split("];", 1)[0]\nassert 'html[data-city="valparaiso"]' in css\nassert 'html[data-city="gijon"]' in css\nfor category in ("musica", "cine", "teatro", "exposiciones", "museos", "cursos-talleres"):\n    assert f'data-category="{category}"' in css\n    assert f'data-category-filter="{category}"' in css\nassert '.sources-section' in css\nassert 'prefers-reduced-motion' in css\nprint("Visual identity contract: OK")\n''', encoding='utf-8')
          PY

      - name: Compile JavaScript and Python
        run: |
          node --check app/app.js
          node --check app/pwa.js
          node --check app/card-experience.js
          node --check app/card-image-fallback.js
          python -m py_compile app/scripts/test_visual_identity.py app/scripts/test_pwa.py app/scripts/test_multi_city_ui.py app/scripts/test_runtime_browser.py

      - name: Run PWA and visual contracts
        run: |
          python app/scripts/test_multi_city_ui.py
          python app/scripts/test_pwa.py
          python app/scripts/test_visual_identity.py
          python app/scripts/test_runtime_browser.py

      - name: Commit validated visual refresh and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-visual-identity-refresh.yml
          git add app/index.html app/app.js app/pwa.js app/service-worker.js app/visual-identity.css app/scripts/test_pwa.py app/scripts/test_multi_city_ui.py app/scripts/test_visual_identity.py
          git commit -m "Give the multi-city PWA a stronger visual identity"
          git push origin HEAD:feature/visual-identity-refresh
