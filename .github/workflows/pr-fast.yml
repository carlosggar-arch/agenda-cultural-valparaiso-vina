name: PR fast contracts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: fast-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Classify change impact
        id: impact
        run: python app/scripts/ci_change_impact.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"
      - name: Validate CI topology and writer boundary
        run: |
          python app/scripts/test_ci_economy.py
          python app/scripts/test_ci_domain_selection.py
          python scripts/verify_canonical_main_writer.py
          python app/scripts/test_contract_topology.py
          python app/scripts/test_fast_production_close_contract.py
          python app/scripts/test_production_certification_history.py
          python app/scripts/test_production_certification_watchdog.py
          python app/scripts/test_production_title_identity.py
          node --test tests/admin-staging-terminal-panel.test.mjs
      - name: Diagnose latest production publication
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MAIN: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --workflow publish.yml --branch main --limit 10 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,event,url)"
          echo "PRODUCTION_DIAG_RUNS=$runs"
          run_id="$(jq -r --arg sha "$TARGET_MAIN" '[.[] | select(.headSha == $sha)][0].databaseId // empty' <<<"$runs")"
          if [[ -z "$run_id" ]]; then
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$runs")"
          fi
          echo "PRODUCTION_DIAG_SELECTED run=$run_id target_main=$TARGET_MAIN"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | ["PRODUCTION_DIAG_JOB", .id, .name, .status, (.conclusion // "null")] | @tsv'
      - name: Run canonical fast contracts
        if: steps.impact.outputs.product == 'true'
        run: |
          python app/scripts/run_impacted_contracts.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
          node --test tests/root-combined-filters.test.mjs tests/root-public-presentation-rules.test.mjs tests/event-data-corrections.test.mjs
          python scripts/generate_public_category_module.py --check
          python scripts/generate_event_semantics_module.py --check
      - name: Validate generated pages when affected
        if: steps.impact.outputs.generated == 'true'
        run: |
          python scripts/generate_event_pages.py --check
          python scripts/stage31_site_generator.py --check
      - name: Document-only change
        if: steps.impact.outputs.product != 'true'
        run: echo "No product contract can be affected; structural CI checks passed."
