name: PR fast contracts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-pr489-once:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 489 && github.head_ref == 'fix/permanent-pages-current-main-v243' }}
    name: canonical-pages-and-finalizer-once
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/permanent-pages-current-main-v243
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Regenerate permanent pages and canonical release
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "ac5c48a32d2edd8f8d880b03c4a26397a9dc4619"

          # Restore the permanent PR gate before writing any product artifact.
          git show 8fe04d66d8dc93846c8da7098c261059619493ee:.github/workflows/pr-fast.yml > .github/workflows/pr-fast.yml

          python scripts/generate_event_pages.py
          python scripts/stage31_site_generator.py
          git add .github/workflows/pr-fast.yml evento sitemap.xml
          git diff --cached --quiet && { echo 'Permanent-page writer produced no changes'; exit 1; }
          git commit -m "Regenerate permanent pages from canonical datasets"

          SOURCE_SHA="$(git rev-parse HEAD)"
          python app/scripts/release_finalizer.py --prepare --base-ref origin/main --source-sha "$SOURCE_SHA" --source-pr 489
          git add app/release-version.js app/service-worker-assets.generated.js app/venue-registry.generated.mjs app/data/release-bundle.json app/data/release-provenance.json app/index.html
          git diff --cached --quiet && { echo 'Canonical finalizer produced no release changes'; exit 1; }
          git commit -m "[release-finalized] Finalize PR 489 canonical release"
          python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref HEAD
          git push origin HEAD:fix/permanent-pages-current-main-v243

  fast-contracts:
    name: fast-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Classify change impact
        id: impact
        run: python app/scripts/ci_change_impact.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"
      - name: Validate CI topology and writer boundary
        run: |
          python app/scripts/test_ci_economy.py
          python app/scripts/test_ci_domain_selection.py
          python scripts/verify_canonical_main_writer.py
          python app/scripts/test_contract_topology.py
          python app/scripts/test_fast_production_close_contract.py
          python app/scripts/test_production_certification_history.py
          python app/scripts/test_production_certification_watchdog.py
          python app/scripts/test_production_certification_latency_contract.py
          python app/scripts/test_production_title_identity.py
          node --test tests/admin-staging-terminal-panel.test.mjs
      - name: Run canonical fast contracts
        if: steps.impact.outputs.product == 'true'
        run: |
          python app/scripts/run_impacted_contracts.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
          node --test tests/root-combined-filters.test.mjs tests/root-public-presentation-rules.test.mjs tests/event-data-corrections.test.mjs
          python scripts/generate_public_category_module.py --check
          python scripts/generate_event_semantics_module.py --check
      - name: Validate generated pages when affected
        if: steps.impact.outputs.generated == 'true'
        run: |
          python scripts/generate_event_pages.py
          git diff --exit-code -- evento sitemap.xml
          python scripts/stage31_site_generator.py --check
      - name: Document-only change
        if: steps.impact.outputs.product != 'true'
        run: echo "No product contract can be affected; structural CI checks passed."
