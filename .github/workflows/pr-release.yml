name: PR release gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-guard:
    name: release-guard
    runs-on: ubuntu-latest
    timeout-minutes: 24
    concurrency:
      group: release-integration-queue
      cancel-in-progress: false
    env:
      FINALIZER_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch current integration base
        id: queue
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${FINALIZER_REF}^{commit}"
          git checkout --detach "$FINALIZER_REF"
          test "$(git rev-parse HEAD)" = "$FINALIZER_REF"
          echo "RELEASE_QUEUE_BASE=$(git rev-parse origin/main)"
          echo "RELEASE_QUEUE_CANDIDATE=$FINALIZER_REF"
          echo "base_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Classify release impact against current main
        id: impact
        run: python app/scripts/ci_change_impact.py --base "$(git rev-parse origin/main)" --head "$FINALIZER_REF" --github-output "$GITHUB_OUTPUT"

      - name: Run independent release diagnostics and aggregate failures
        id: diagnostics
        run: |
          set +e
          python -m py_compile app/scripts/release_finalizer.py app/scripts/release_bundle.py app/scripts/test_release_finalizer.py app/scripts/production_release_chain.py app/scripts/production_series_contract.py
          syntax_result=$?
          python app/scripts/test_release_finalizer.py
          finalizer_result=$?
          python app/scripts/test_atomic_publication_contract.py
          atomic_result=$?
          python scripts/verify_canonical_main_writer.py
          writer_result=$?
          status() { if [[ "$1" -eq 0 ]]; then echo success; else echo failure; fi; }
          python app/scripts/pr_release_automation.py summarize \
            --result "syntax=$(status "$syntax_result")" \
            --result "finalizer=$(status "$finalizer_result")" \
            --result "atomic-publication=$(status "$atomic_result")" \
            --result "single-writer=$(status "$writer_result")"

      - name: Require or transiently prepare canonical finalization
        id: finalization
        if: steps.impact.outputs.release == 'true'
        env:
          SOURCE_PR: ${{ github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          if git log -1 --format=%s "$FINALIZER_REF" | grep -Fq '[release-finalized]'; then
            echo "transient=false" >> "$GITHUB_OUTPUT"
            python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref "$FINALIZER_REF"
          else
            echo "transient=true" >> "$GITHUB_OUTPUT"
            git config user.name "vivamos-pr-finalizer[validation]"
            git config user.email "vivamos-pr-finalizer-validation@users.noreply.github.com"
            python app/scripts/pr_release_automation.py prepare \
              --base "$(git rev-parse origin/main)" \
              --source "$FINALIZER_REF" \
              --source-pr "$SOURCE_PR" \
              --commit
            python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref HEAD
          fi

      - name: Preflight release workflow contracts before browser setup
        id: preflight
        if: steps.impact.outputs.release == 'true'
        run: |
          set -euo pipefail
          python app/scripts/test_release_guard.py
          python app/scripts/test_production_pwa_smoke_contract.py
          python app/scripts/test_production_series_contract.py

      - name: Install browser test dependency
        id: browser_setup
        if: steps.impact.outputs.release == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile guarded shell
        id: compile_shell
        if: steps.impact.outputs.release == 'true'
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/run_contracts.py \
            app/scripts/run_browser_scenarios.py \
            app/scripts/test_release_guard.py \
            app/scripts/test_release_delta.py \
            app/scripts/test_ui_computed_contracts_browser.py \
            app/scripts/test_first_render_browser.py \
            app/scripts/test_startup_resilience_browser.py \
            app/scripts/test_schedule_interaction_browser.py \
            app/scripts/test_runtime_browser.py \
            app/scripts/test_runtime_user_flow_browser.py \
            app/scripts/test_temporal_priority_browser.py \
            app/scripts/test_pwa_cache_first_startup.py \
            app/scripts/test_date_filter_browser.py \
            app/scripts/test_exhibition_visual_parity.py \
            app/scripts/test_exhibition_filter_isolation_browser.py \
            app/scripts/test_structural_event_visibility_browser.py \
            app/scripts/test_pwa_install_browser.py \
            app/scripts/test_ios_install_intent_browser.py \
            app/scripts/test_multicity_source_registry_coverage.py \
            app/scripts/test_priority_zero_monitors.py \
            app/scripts/production_*_smoke.py \
            app/scripts/production_warm_start_smoke.py \
            app/scripts/production_release_attestation.py \
            app/scripts/production_release_chain.py \
            app/scripts/production_series_contract.py \
            app/scripts/test_production_release_attestation.py \
            app/scripts/test_production_pwa_smoke_contract.py \
            app/scripts/test_web_pwa_visibility_parity.py \
            app/scripts/generate_runtime_contracts.py \
            app/scripts/release_bundle.py \
            app/scripts/release_finalizer.py \
            app/scripts/test_release_finalizer.py \
            app/scripts/semantic_quality_history.py \
            app/scripts/test_semantic_quality_history.py \
            app/scripts/test_structural_hardening.py
          node --check app/app.js
          node --check assets/agenda.js
          node --check app/app-core.js
          node --check app/data-pipeline.js
          node --check app/time-independent-cache.test.mjs
          node --check app/local-day-boundary.mjs
          node --check app/local-day-boundary.test.mjs
          node --check app/event-correction-rules.mjs
          node --check app/event-correction-rules.test.mjs
          node --check app/artequin-session-correction.js
          node --check app/artequin-session-correction.test.mjs
          node --check app/event-card-data-quality.mjs
          node --check app/event-card-data-quality.test.mjs
          node --check app/runtime-data-consumer-authority.test.mjs
          node --check app/startup-stability.js
          node --check app/app-safe-mode.js
          node --check app/program-visibility-policy.js
          node --check app/session-occurrence-normalizer.js
          node --check app/combined-filters.js
          node --check app/combined-filters-safety.js
          node --check app/semantic-search.mjs
          node --check app/semantic-search.test.mjs
          node --check app/date-filter-architecture.test.mjs
          node --check app/pwa-release-handoff.test.mjs
          node --check app/public-selection-core.mjs
          node --check app/public-selection-parity.test.mjs
          node --check app/public-title-normalizer.test.mjs
          node --check app/exhibition-groups.js
          node --check app/exhibition-group-core.mjs
          node --check app/exhibition-group-core.test.mjs
          node --check app/city-presentation-adapter.mjs
          node --check app/formation-cycle-classifier.js
          node --check app/registration-reminder-classifier.test.mjs
          node --check app/registration-reminders-architecture.test.mjs
          node --check app/venue-registry.generated.mjs
          node --check app/venue-identity.mjs
          node --check app/venue-identity.test.mjs
          node --check app/gijon-venue-hours.js
          node --check app/exhibition-hours.js
          node --check app/sources-toggle.js
          node --check app/scripts/test_public_presentation.mjs
          node --check app/pwa.js
          node --check app/service-worker.js
          node --check app/service-worker-assets.generated.js
          node --check app/release-version.js
          node --check app/header-redesign.js
          node --check app/mobile-experience.js

      - name: Run required release and architecture contracts
        id: contracts
        if: steps.impact.outputs.release == 'true'
        run: |
          set -euo pipefail
          python app/scripts/generate_runtime_contracts.py --check
          python app/scripts/test_release_delta.py
          python app/scripts/release_bundle.py --check
          python app/scripts/test_semantic_quality_history.py
          python app/scripts/semantic_quality_history.py --no-write
          python app/scripts/test_production_release_attestation.py
          python app/scripts/test_structural_hardening.py
          python app/scripts/test_priority_zero_monitors.py
          node app/venue-identity.test.mjs
          node app/event-card-data-quality.test.mjs
          node app/semantic-search.test.mjs
          python app/scripts/run_contracts.py --profile required-release
          python app/scripts/test_pwa_cache_first_startup.py
          node app/data-pipeline.test.mjs
          node --test app/time-independent-cache.test.mjs app/local-day-boundary.test.mjs app/event-correction-rules.test.mjs app/runtime-past-event-guard.test.mjs
          node app/artequin-session-correction.test.mjs
          node app/session-occurrence-normalizer.test.mjs
          node app/program-visibility-policy.test.mjs
          node app/exhibition-group-core.test.mjs
          node app/registration-reminder-classifier.test.mjs
          node app/registration-reminders-architecture.test.mjs
          node app/date-filter-architecture.test.mjs
          node app/pwa-release-handoff.test.mjs
          node app/public-selection-parity.test.mjs
          node app/public-title-normalizer.test.mjs
          python app/scripts/test_multicity_source_registry_coverage.py

      - name: Run canonical browser scenarios
        id: browser
        if: steps.impact.outputs.release == 'true'
        run: python app/scripts/run_browser_scenarios.py --all

      - name: Require local WEB versus cached PWA ordered presentation parity
        id: parity
        if: steps.impact.outputs.release == 'true'
        run: python app/scripts/test_web_pwa_visibility_parity.py --local

      - name: Upload exhibition visual parity
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: exhibition-visual-parity
          path: /tmp/exhibition-visual-parity/*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Note structural release gate roles
        if: steps.impact.outputs.release == 'true'
        run: |
          echo "The global release-integration queue serializes candidates."
          echo "Cheap workflow-contract preflights run before browser dependency setup, so stale architecture fails early."
          echo "A candidate is mergeable only when latest main is an ancestor, the canonical finalizer owns generated outputs, release == current-main+1, and all release/browser/parity contracts are green."
          echo "Production network, series semantics and exact source-to-production chain certification run after merge."
      - name: No release surface affected
        id: no_release
        if: steps.impact.outputs.release != 'true'
        run: echo "Release browser gate skipped by deterministic path classification; canonical finalizer unit contracts still ran."

      - name: Publish one aggregate diagnostic summary
        id: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          normalize() {
            case "$1" in
              success|failure|skipped) printf '%s' "$1" ;;
              *) printf 'skipped' ;;
            esac
          }
          python app/scripts/pr_release_automation.py summarize \
            --result "diagnostics=$(normalize '${{ steps.diagnostics.outcome }}')" \
            --result "finalization=$(normalize '${{ steps.finalization.outcome }}')" \
            --result "preflight=$(normalize '${{ steps.preflight.outcome }}')" \
            --result "browser-setup=$(normalize '${{ steps.browser_setup.outcome }}')" \
            --result "compile-shell=$(normalize '${{ steps.compile_shell.outcome }}')" \
            --result "contracts=$(normalize '${{ steps.contracts.outcome }}')" \
            --result "browser=$(normalize '${{ steps.browser.outcome }}')" \
            --result "parity=$(normalize '${{ steps.parity.outcome }}')"

      - name: Bind successful source validation to an immutable handoff
        if: always() && steps.summary.outcome == 'success' && steps.finalization.outputs.transient == 'true'
        env:
          SOURCE_PR: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ env.FINALIZER_REF }}
          BASE_SHA: ${{ steps.queue.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-finalization-ready
          jq -n \
            --argjson pr "$SOURCE_PR" \
            --arg source "$SOURCE_SHA" \
            --arg base "$BASE_SHA" \
            --arg workflow_run "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            '{schema_version: 1, repository: $repository, workflow: $workflow, workflow_ref: $workflow_ref, pr: $pr, source_sha: $source, base_sha: $base, workflow_run_id: $workflow_run, run_attempt: $run_attempt, diagnostics: "passed"}' \
            > /tmp/pr-finalization-ready/handoff.json

      - name: Upload immutable finalization handoff
        if: always() && steps.summary.outcome == 'success' && steps.finalization.outputs.transient == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pr-finalization-ready-${{ github.event.pull_request.number }}
          path: /tmp/pr-finalization-ready/handoff.json
          if-no-files-found: error
          retention-days: 1

      - name: Keep source-only candidate blocked until final commit exists
        if: always() && steps.summary.outcome == 'success' && steps.finalization.outputs.transient == 'true'
        run: |
          echo "PR_FINALIZATION_COMMIT_PENDING source=$FINALIZER_REF"
          exit 1
