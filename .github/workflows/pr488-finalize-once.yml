name: PR 488 one-shot canonical finalizer

on:
  push:
    branches:
      - fix/root-public-category-authority-20260825

permissions:
  contents: write

jobs:
  finalize-once:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[release-finalized]') }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: fix/root-public-category-authority-20260825
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Remove one-shot runner and prepare canonical release
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main
          git rm .github/workflows/pr488-finalize-once.yml
          git commit -m "Remove one-shot PR 488 finalizer runner"
          SOURCE_SHA="$(git rev-parse HEAD)"
          python app/scripts/release_finalizer.py --prepare --base-ref origin/main --source-sha "$SOURCE_SHA" --source-pr 488
          git add app/release-version.js app/service-worker-assets.generated.js app/venue-registry.generated.mjs app/data/release-bundle.json app/data/release-provenance.json app/index.html
          git diff --cached --quiet && { echo 'Canonical finalizer produced no release changes'; exit 1; }
          git commit -m "[release-finalized] Finalize PR 488 canonical release"
          python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref HEAD
          git push origin HEAD:fix/root-public-category-authority-20260825
