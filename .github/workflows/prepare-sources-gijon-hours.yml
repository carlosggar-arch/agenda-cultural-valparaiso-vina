name: Prepare sources and Gijon hours release

on:
  push:
    branches:
      - release/sources-gijon-hours-v159

permissions:
  contents: write

concurrency:
  group: prepare-sources-gijon-hours-v159
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[skip prepare]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply validated Valpo source expansion
        run: |
          set -euo pipefail
          rm -rf /tmp/valpo10
          mkdir -p /tmp/valpo10
          unzip -q .tmp/valpo10_payload.zip -d /tmp/valpo10
          python /tmp/valpo10/public_repo_valpo10/apply_to_repo.py "$GITHUB_WORKSPACE"
          python app/scripts/test_valpo_source_expansion.py
          python app/scripts/test_sync_valpo_source_expansion_catalog.py
          python -m py_compile app/scripts/refresh_valpo_source_expansion.py app/scripts/sync_valpo_source_expansion_catalog.py

      - name: Wire verified Gijon venue hours into the stable runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          pipeline_path = Path('app/data-pipeline.js')
          pipeline = pipeline_path.read_text(encoding='utf-8')
          import_line = 'import { publishAgendaRuntimeSnapshot } from "./agenda-runtime-state.mjs?v=20260819-runtime1";\n'
          hours_import = 'import { scheduleForGijonEvent, gijonLocationForEvent } from "./gijon-venue-hours.js?v=20260820-hours1";\n'
          if hours_import not in pipeline:
              if import_line not in pipeline:
                  raise SystemExit('data-pipeline import anchor not found')
              pipeline = pipeline.replace(import_line, import_line + hours_import, 1)

          helper = '''\nfunction enrichGijonVenueHours(dataset) {\n  if (!dataset || !Array.isArray(dataset.events)) return dataset;\n  return {\n    ...dataset,\n    events: dataset.events.map((event) => ({\n      ...event,\n      schedule: scheduleForGijonEvent(event),\n      location: gijonLocationForEvent(event),\n    })),\n  };\n}\n'''
          export_anchor = '\nexport async function loadAgendaDataset(city, { fetchImpl = globalThis.fetch, now = new Date() } = {}) {'
          if 'function enrichGijonVenueHours(dataset)' not in pipeline:
              if export_anchor not in pipeline:
                  raise SystemExit('data-pipeline helper anchor not found')
              pipeline = pipeline.replace(export_anchor, helper + export_anchor, 1)

          stage_anchor = '''  dataset = applyStage("formation-cycle-classifier", normalizeFormationCycles, dataset, diagnostics);\n  if (city.id === "valparaiso") {'''
          stage_replacement = '''  dataset = applyStage("formation-cycle-classifier", normalizeFormationCycles, dataset, diagnostics);\n  if (city.id === "gijon") {\n    dataset = applyStage("gijon-venue-hours", enrichGijonVenueHours, dataset, diagnostics);\n  } else {\n    diagnostics.push({ name: "gijon-venue-hours", status: "not-applicable" });\n  }\n  if (city.id === "valparaiso") {'''
          if 'applyStage("gijon-venue-hours"' not in pipeline:
              if stage_anchor not in pipeline:
                  raise SystemExit('data-pipeline stage anchor not found')
              pipeline = pipeline.replace(stage_anchor, stage_replacement, 1)
          pipeline_path.write_text(pipeline, encoding='utf-8')

          core_path = Path('app/app-core.js')
          core = core_path.read_text(encoding='utf-8')
          card_anchor = '''  const link = eventLink(event);\n  const badge = typeBadge(event);\n  card.innerHTML = `'''
          card_replacement = '''  const link = eventLink(event);\n  const badge = typeBadge(event);\n  const venueHours = String(event?.schedule?.opening_hours?.display_text || "").trim();\n  const venueHoursHtml = venueHours\n    ? `<p class="venue-opening-hours">${escapeHtml(`Horario del recinto: ${venueHours}`)}</p>`\n    : "";\n  card.innerHTML = `'''
          if 'const venueHours = String(event?.schedule?.opening_hours?.display_text' not in core:
              if card_anchor not in core:
                  raise SystemExit('app-core card anchor not found')
              core = core.replace(card_anchor, card_replacement, 1)

          schedule_anchor = '''    <h4>${escapeHtml(event?.title || "Actividad sin título")}</h4>\n    <p>${escapeHtml(formatSchedule(event, activeCity))}</p>\n    <p>${escapeHtml(location)}</p>'''
          schedule_replacement = '''    <h4>${escapeHtml(event?.title || "Actividad sin título")}</h4>\n    <p>${escapeHtml(formatSchedule(event, activeCity))}</p>\n    ${venueHoursHtml}\n    <p>${escapeHtml(location)}</p>'''
          if '${venueHoursHtml}' not in core:
              if schedule_anchor not in core:
                  raise SystemExit('app-core schedule anchor not found')
              core = core.replace(schedule_anchor, schedule_replacement, 1)
          core_path.write_text(core, encoding='utf-8')

          release_path = Path('app/release-version.js')
          release = release_path.read_text(encoding='utf-8')
          release, count = re.subn(r'const RELEASE = \d+;', 'const RELEASE = 159;', release, count=1)
          if count != 1:
              raise SystemExit('release version anchor not found')
          release = re.sub(
              r'// v\d+[^\n]*\n(?:\s*//[^\n]*\n)*\s*const RELEASE = 159;',
              '// v159 publishes the expanded Valpo/Viña sources and verified Gijón venue hours.\n  const RELEASE = 159;',
              release,
              count=1,
          )
          release_path.write_text(release, encoding='utf-8')
          PY

          node --check app/data-pipeline.js
          node --check app/app-core.js
          node app/startup-architecture.test.mjs

      - name: Audit Gijon exhibition hour coverage
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { scheduleForGijonEvent } from './app/gijon-venue-hours.js';

          const dataset = JSON.parse(readFileSync('app/data/gijon/agenda_web.json', 'utf8'));
          const exhibitions = (dataset.events || []).filter((event) => {
            const ids = [event?.primary_category?.id, ...(event?.categories || []).map((c) => c?.id)];
            return ids.includes('exposiciones') || ids.includes('museos');
          });
          let withExplicitTime = 0;
          let enrichedHours = 0;
          const missingVenues = new Map();
          for (const event of exhibitions) {
            const display = String(event?.schedule?.display_text || '');
            if (/\b(?:[01]?\d|2[0-3]):[0-5]\d\b/.test(display)) withExplicitTime += 1;
            const schedule = scheduleForGijonEvent(event);
            if (schedule?.opening_hours?.display_text) enrichedHours += 1;
            else if (!/\b(?:[01]?\d|2[0-3]):[0-5]\d\b/.test(display)) {
              const venue = String(event?.location?.venue || 'Sin recinto');
              missingVenues.set(venue, (missingVenues.get(venue) || 0) + 1);
            }
          }
          console.log(`GIJON_EXHIBITIONS total=${exhibitions.length} explicit_time=${withExplicitTime} venue_hours=${enrichedHours}`);
          console.log('GIJON_EXHIBITION_MISSING_VENUES', [...missingVenues.entries()].sort((a,b)=>b[1]-a[1]).slice(0,20));
          if (exhibitions.length && enrichedHours === 0) throw new Error('No Gijon exhibition received verified venue hours');
          NODE

      - name: Refresh direct official Valpo sources
        run: |
          set -euo pipefail
          python app/scripts/refresh_official_source_recoveries.py
          python app/scripts/test_priority_zero_monitors.py

      - name: Validate source catalogue and expanded events
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          catalog = json.loads(Path('fuentes_publicas.json').read_text(encoding='utf-8'))
          sources = catalog.get('sources') or []
          names = {str(item.get('name') or '') for item in sources}
          expected = {
              'Universidad de Valparaíso — Agenda',
              'Sala El Farol — Universidad de Valparaíso',
              'Jardín Botánico Nacional de Viña del Mar',
              'UPLA — Vinculación con el Medio',
              'Museo Universitario del Grabado UPLA',
              'Biblioteca Santiago Severin',
              'Distrito BAC — Barrio Alegre y Concepción',
              'Ipanema Club Viña',
              'Barrio Poniente Viña',
          }
          missing = sorted(expected - names)
          if missing:
              raise SystemExit(f'Missing public sources: {missing}')
          if any('vamoseventos' in name.casefold().replace(' ', '') for name in names):
              raise SystemExit('VamosEventos must remain discovery-only')
          if len(sources) < 46:
              raise SystemExit(f'Expected at least 46 public sources, got {len(sources)}')

          dataset = json.loads(Path('agenda_web.json').read_text(encoding='utf-8'))
          counts = Counter(str(item.get('source_id') or '') for item in dataset.get('events') or [])
          tracked = [
              'centro_extension_duoc_valpo_official',
              'universidad_valparaiso_agenda',
              'sala_el_farol_uv',
              'jardin_botanico_vina',
              'upla_vinculacion',
              'mug_upla',
              'biblioteca_severin',
              'cultura_pucv_official',
              'barrio_alegre_concepcion',
              'ipanema_club_vina',
          ]
          print(f'PUBLIC_SOURCES_TOTAL={len(sources)}')
          print('EXPANDED_EVENT_COUNTS=' + json.dumps({key: counts.get(key, 0) for key in tracked}, ensure_ascii=False, sort_keys=True))
          print(f'AGENDA_EVENTS_TOTAL={len(dataset.get("events") or [])}')
          PY

      - name: Commit prepared release branch
        run: |
          set -euo pipefail
          git config user.name "agenda-cultural-preparer[bot]"
          git config user.email "agenda-cultural-preparer[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release branch already prepared."
            exit 0
          fi
          git commit -m "Integrate expanded sources and Gijon venue hours [skip prepare]"
          git push origin HEAD:release/sources-gijon-hours-v159
