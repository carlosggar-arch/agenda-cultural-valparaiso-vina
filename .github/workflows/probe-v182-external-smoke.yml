name: Probe v182 external HTTP/browser

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-v182-external-smoke.yml"

permissions:
  contents: read

concurrency:
  group: probe-v182-external-http-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out published main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm v182 candidate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const RELEASE = 182;' app/release-version.js
          echo "PROBE_TARGET=$(git rev-parse HEAD)"

      - name: Install browser dependency
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Validate local shell
        run: python app/scripts/production_pwa_smoke.py local

      - name: Verify external HTTP parity
        run: python app/scripts/production_pwa_smoke.py http

      - name: Cold-load both cities on both public origins
        run: python app/scripts/production_pwa_smoke.py browser

      - name: Warm-reopen Valpo mobile on both public origins
        run: python app/scripts/production_warm_start_smoke.py
