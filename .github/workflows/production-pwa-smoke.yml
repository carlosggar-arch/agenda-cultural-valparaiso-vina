name: Production PWA smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-pwa-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout production smoke candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local shell before network smoke
        run: |
          set -euo pipefail
          python -m py_compile app/scripts/production_pwa_smoke.py app/scripts/temp_production_functional_probe.py
          python app/scripts/production_pwa_smoke.py local

      - name: Wait for both deployments and verify byte parity
        run: python app/scripts/production_pwa_smoke.py http

      - name: Probe all four production browser cases
        run: python app/scripts/temp_production_functional_probe.py
