name: Production PWA smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "app/*.js"
      - "app/*.css"
      - "app/*.html"
      - "app/*.webmanifest"
      - "app/cities.json"
      - "app/data/source-registry.json"
      - "app/data/gijon/agenda_web.json"
      - "agenda_web.json"
      - "fuentes_publicas.json"
      - "manifest.webmanifest"
      - "app/scripts/test_public_presentation.mjs"
      - "app/scripts/production_pwa_smoke.py"
      - "app/scripts/production_warm_start_smoke.py"
      - "app/scripts/test_production_pwa_smoke_contract.py"
      - ".github/workflows/production-pwa-smoke.yml"
  push:
    branches: [main]
    paths:
      - "app/*.js"
      - "app/*.css"
      - "app/*.html"
      - "app/*.webmanifest"
      - "app/cities.json"
      - "app/data/source-registry.json"
      - "app/data/gijon/agenda_web.json"
      - "agenda_web.json"
      - "fuentes_publicas.json"
      - "manifest.webmanifest"
      - "app/scripts/production_pwa_smoke.py"
      - "app/scripts/production_warm_start_smoke.py"
      - ".github/workflows/production-pwa-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pwa-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate local PWA shell contract
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/production_pwa_smoke.py \
            app/scripts/production_warm_start_smoke.py \
            app/scripts/test_production_pwa_smoke_contract.py
          node --check app/pwa.js
          node --check app/sources-toggle.js
          node --check app/service-worker.js
          node --check app/release-version.js
          node --check app/header-redesign.js
          node --check app/mobile-experience.js
          node app/scripts/test_public_presentation.mjs
          python app/scripts/production_pwa_smoke.py local
          python app/scripts/test_production_pwa_smoke_contract.py

  warm-production-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Verify live parity and warm mobile reopen
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/production_pwa_smoke.py \
            app/scripts/production_warm_start_smoke.py
          python app/scripts/production_pwa_smoke.py http
          python app/scripts/production_warm_start_smoke.py

  production-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout published candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require release bump for runtime pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$before" ]]; then
            echo "No comparison base available; continuing conservatively with production smoke."
            exit 0
          fi

          git diff --name-only "$before" "${{ github.sha }}" | tee changed-pwa-files.txt
          runtime_changed="$(grep -E '^(app/[^/]+\.(js|css|html|webmanifest)|app/cities\.json|manifest\.webmanifest)$' changed-pwa-files.txt || true)"
          release_changed="$(grep -Fx 'app/release-version.js' changed-pwa-files.txt || true)"
          if [[ -n "$runtime_changed" && -z "$release_changed" ]]; then
            echo "Production-visible PWA runtime changed without bumping app/release-version.js:" >&2
            printf '%s\n' "$runtime_changed" >&2
            echo "Bump the shared release before relying on a production smoke; otherwise the deployment cannot be distinguished from the previous runtime." >&2
            exit 1
          fi

      - name: Align smoke candidate with latest public main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "PRODUCTION_SMOKE_HEAD=$(git rev-parse HEAD)"

      - name: Validate local shell before network smoke
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/production_pwa_smoke.py \
            app/scripts/production_warm_start_smoke.py
          python app/scripts/production_pwa_smoke.py local

      - name: Wait for both deployments and verify byte parity
        run: python app/scripts/production_pwa_smoke.py http

      - name: Cold-load both cities on GitHub Pages and Cloudflare
        run: python app/scripts/production_pwa_smoke.py browser

      - name: Warm-reopen Valpo mobile on GitHub Pages and Cloudflare
        run: python app/scripts/production_warm_start_smoke.py
