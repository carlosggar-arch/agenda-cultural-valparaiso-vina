name: Public sources regression guard

on:
  pull_request:
    branches: [main]
    paths:
      - "fuentes_publicas.json"
      - "agenda_web.json"
      - "app/data/gijon/agenda_web.json"
      - "app/data/quality/source-coverage.json"
      - "app/data/source-registry.json"
      - "app/scripts/validate_source_registry.py"
      - "app/scripts/test_source_registry.py"
      - "app/scripts/source_refresh_scope.py"
      - "app/scripts/test_source_refresh_scope.py"
      - "app/scripts/public-sources-preservation.test.mjs"
      - "tests/public-sources-regression.test.mjs"
      - ".github/workflows/public-sources-regression.yml"
  push:
    branches: [main]
    paths:
      - "fuentes_publicas.json"
      - "agenda_web.json"
      - "app/data/gijon/agenda_web.json"
      - "app/data/quality/source-coverage.json"
      - "app/data/source-registry.json"
      - "app/scripts/validate_source_registry.py"
      - "app/scripts/test_source_registry.py"
      - "app/scripts/source_refresh_scope.py"
      - "app/scripts/test_source_refresh_scope.py"
      - "app/scripts/public-sources-preservation.test.mjs"
      - "tests/public-sources-regression.test.mjs"
      - ".github/workflows/public-sources-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare previous public source baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" == "null" ]]; then
            base_sha="$BEFORE_SHA"
          fi
          if [[ -n "$base_sha" && "$base_sha" != "null" && ! "$base_sha" =~ ^0+$ ]] \
             && git cat-file -e "$base_sha:fuentes_publicas.json" 2>/dev/null; then
            git show "$base_sha:fuentes_publicas.json" > /tmp/fuentes_publicas.baseline.json
            echo "PUBLIC_SOURCE_BASELINE_SHA=$base_sha"
          else
            cp fuentes_publicas.json /tmp/fuentes_publicas.baseline.json
            echo "PUBLIC_SOURCE_BASELINE_SHA=self"
          fi
          echo "PUBLIC_SOURCES_BASELINE=/tmp/fuentes_publicas.baseline.json" >> "$GITHUB_ENV"
      - name: Preserve public source catalogue regression tests
        run: node --test tests/public-sources-regression.test.mjs app/scripts/public-sources-preservation.test.mjs
      - name: Test source registry contract
        working-directory: app/scripts
        run: |
          python test_source_registry.py
          python test_source_refresh_scope.py
      - name: Validate repository source registry
        run: python app/scripts/validate_source_registry.py
