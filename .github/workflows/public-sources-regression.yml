name: Public sources regression guard

on:
  pull_request:
    branches:
      - main
    paths:
      - "fuentes_publicas.json"
      - "tests/public-sources-regression.test.mjs"
      - ".github/workflows/public-sources-regression.yml"
  push:
    branches:
      - main
    paths:
      - "fuentes_publicas.json"
      - "tests/public-sources-regression.test.mjs"
      - ".github/workflows/public-sources-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run public sources regression tests
        run: node --test tests/public-sources-regression.test.mjs
