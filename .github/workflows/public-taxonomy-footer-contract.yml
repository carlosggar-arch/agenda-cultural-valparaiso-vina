name: Public taxonomy and footer contract

on:
  push:
    branches: [main]
    paths:
      - "shared/public-category-taxonomy.json"
      - "shared/event-semantics.json"
      - "shared/event-semantics-fixtures.json"
      - "scripts/public_category_rules.py"
      - "scripts/event_semantics.py"
      - "scripts/semantic_quality_audit.py"
      - "scripts/generate_event_semantics_module.py"
      - "app/public-category-taxonomy.generated.mjs"
      - "app/public-category-rules.mjs"
      - "app/event-semantics.generated.mjs"
      - "app/event-semantics.mjs"
      - "app/event-semantics.test.mjs"
      - "app/category-normalizer.js"
      - "app/formation-cycle-classifier.js"
      - "app/category-authority.test.mjs"
      - "app/app-core.js"
      - "app/combined-filters.js"
      - "app/combined-filters-bootstrap.js"
      - "app/index.html"
      - "app/exhibition-groups.js"
      - "app/exhibition-compact.css"
      - "app/footer-credit.js"
      - "app/community-source.js"
      - "app/community-source.css"
      - "app/pwa.js"
      - "app/service-worker.js"
      - "app/release-version.js"
      - "app/cities.json"
      - "agenda_web.json"
      - "app/data/**/agenda_web.json"
      - "app/scripts/test_public_taxonomy_footer.mjs"
      - "app/scripts/test_gijon_exhibition_filter_contract.mjs"
      - "app/scripts/test_public_feedback_contract.mjs"
      - "tests/test_event_semantics.py"
      - "tests/test_semantic_quality_audit.py"
      - ".github/workflows/public-taxonomy-footer-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "shared/public-category-taxonomy.json"
      - "shared/event-semantics.json"
      - "shared/event-semantics-fixtures.json"
      - "scripts/public_category_rules.py"
      - "scripts/event_semantics.py"
      - "scripts/semantic_quality_audit.py"
      - "scripts/generate_event_semantics_module.py"
      - "app/public-category-taxonomy.generated.mjs"
      - "app/public-category-rules.mjs"
      - "app/event-semantics.generated.mjs"
      - "app/event-semantics.mjs"
      - "app/event-semantics.test.mjs"
      - "app/category-normalizer.js"
      - "app/formation-cycle-classifier.js"
      - "app/category-authority.test.mjs"
      - "app/app-core.js"
      - "app/combined-filters.js"
      - "app/combined-filters-bootstrap.js"
      - "app/index.html"
      - "app/exhibition-groups.js"
      - "app/exhibition-compact.css"
      - "app/footer-credit.js"
      - "app/community-source.js"
      - "app/community-source.css"
      - "app/pwa.js"
      - "app/service-worker.js"
      - "app/release-version.js"
      - "app/cities.json"
      - "agenda_web.json"
      - "app/data/**/agenda_web.json"
      - "app/scripts/test_public_taxonomy_footer.mjs"
      - "app/scripts/test_gijon_exhibition_filter_contract.mjs"
      - "app/scripts/test_public_feedback_contract.mjs"
      - "tests/test_event_semantics.py"
      - "tests/test_semantic_quality_audit.py"
      - ".github/workflows/public-taxonomy-footer-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated semantic contract
        run: python scripts/generate_event_semantics_module.py --check
      - name: Check JavaScript syntax
        run: |
          node --check app/public-category-rules.mjs
          node --check app/event-semantics.generated.mjs
          node --check app/event-semantics.mjs
          node --check app/event-semantics.test.mjs
          node --check app/category-normalizer.js
          node --check app/formation-cycle-classifier.js
          node --check app/category-authority.test.mjs
          node --check app/app-core.js
          node --check app/combined-filters.js
          node --check app/combined-filters-bootstrap.js
          node --check app/exhibition-groups.js
          node --check app/footer-credit.js
          node --check app/community-source.js
          node --check app/pwa.js
          node --check app/service-worker.js
          node --check app/scripts/test_gijon_exhibition_filter_contract.mjs
          node --check app/scripts/test_public_feedback_contract.mjs
      - name: Run public contracts
        run: |
          node app/category-authority.test.mjs
          node app/event-semantics.test.mjs
          node app/scripts/test_public_taxonomy_footer.mjs
          node app/scripts/test_gijon_exhibition_filter_contract.mjs
          node app/scripts/test_public_feedback_contract.mjs
          python tests/test_event_semantics.py
          python tests/test_semantic_quality_audit.py
      - name: Build semantic quality report
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          mkdir -p /tmp/semantic-quality
          BASE_REF="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            python scripts/semantic_quality_audit.py \
              --compare-ref "$BASE_REF" \
              --json-output /tmp/semantic-quality/report.json \
              --markdown-output /tmp/semantic-quality/report.md
          else
            python scripts/semantic_quality_audit.py \
              --json-output /tmp/semantic-quality/report.json \
              --markdown-output /tmp/semantic-quality/report.md
          fi
          cat /tmp/semantic-quality/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload semantic quality audit
        uses: actions/upload-artifact@v4
        with:
          name: semantic-quality-audit
          path: /tmp/semantic-quality/
          if-no-files-found: error
