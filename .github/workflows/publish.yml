name: Publish and production verification

on:
  push:
    branches: [main]
    paths:
      - "app/*.js"
      - "app/*.mjs"
      - "app/*.css"
      - "app/*.html"
      - "app/*.webmanifest"
      - "app/cities.json"
      - "app/data/source-registry.json"
      - "app/data/gijon/agenda_web.json"
      - "agenda_web.json"
      - "fuentes_publicas.json"
      - "manifest.webmanifest"
      - "app/scripts/production_pwa_smoke.py"
      - "app/scripts/production_browser_selenium_smoke.py"
      - "app/scripts/production_warm_start_smoke.py"
      - "app/scripts/test_web_pwa_visibility_parity.py"
      - "app/scripts/production_release_attestation.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-production
  cancel-in-progress: true

jobs:
  sync-cloudflare:
    name: sync-cloudflare
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v7
        with:
          ref: cloudflare-preview
          fetch-depth: 0
      - name: Merge approved main without rewriting deployment history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Guard Cloudflare-only divergence
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only origin/main HEAD | grep -v '^cloudflare-build\.sh$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "cloudflare-preview diverged from main outside cloudflare-build.sh:"
            echo "$unexpected"
            exit 1
          fi

      - name: Validate Cloudflare build snapshot
        run: |
          set -euo pipefail
          bash cloudflare-build.sh
          test -f _cloudflare_site/app/index.html
          test -f _cloudflare_site/app/release-version.js
          test -f _cloudflare_site/app/service-worker.js
          test -f _cloudflare_site/app/event-detail.js
          test -f _cloudflare_site/app/data/gijon/agenda_web.json
          cmp app/release-version.js _cloudflare_site/app/release-version.js
          python scripts/verify_canonical_main_writer.py

      - name: Push synchronized deployment branch
        run: |
          set -euo pipefail
          git push origin HEAD:cloudflare-preview

      - name: Fast-close changed dataset freshness and identity
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main^ origin/main || true)"
          printf '%s\n' "$changed" | tee /tmp/fast-close-changed.txt
          export REQUIRE_VALPO=false
          export REQUIRE_GIJON=false
          if grep -Fxq 'agenda_web.json' /tmp/fast-close-changed.txt; then REQUIRE_VALPO=true; fi
          if grep -Fxq 'app/data/gijon/agenda_web.json' /tmp/fast-close-changed.txt; then REQUIRE_GIJON=true; fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          specs = (
              ("valparaiso", Path("agenda_web.json"), os.environ.get("REQUIRE_VALPO") == "true"),
              ("gijon", Path("app/data/gijon/agenda_web.json"), os.environ.get("REQUIRE_GIJON") == "true"),
          )
          now_utc = datetime.now(timezone.utc)
          for city, path, require_fresh in specs:
              payload = json.loads(path.read_text(encoding="utf-8"))
              events = payload.get("events") or []
              ids = [str(event.get("id") or "").strip() for event in events if isinstance(event, dict)]
              if len(ids) != len(events) or any(not value for value in ids) or len(ids) != len(set(ids)):
                  raise SystemExit(f"FAST_CLOSE_IDS_INVALID city={city}")
              counts = payload.get("counts") or {}
              if counts.get("total") is not None and int(counts.get("total")) != len(events):
                  raise SystemExit(f"FAST_CLOSE_COUNT_MISMATCH city={city} declared={counts.get('total')} actual={len(events)}")
              generated_raw = str(payload.get("generated_at") or "").strip()
              publication_date = str(payload.get("publication_date") or "")[:10]
              timezone_name = str(payload.get("timezone") or "").strip()
              if not generated_raw or not publication_date or not timezone_name:
                  raise SystemExit(f"FAST_CLOSE_METADATA_MISSING city={city}")
              generated = datetime.fromisoformat(generated_raw.replace("Z", "+00:00"))
              if generated.tzinfo is None:
                  generated = generated.replace(tzinfo=ZoneInfo(timezone_name))
              generated_local = generated.astimezone(ZoneInfo(timezone_name))
              if publication_date != generated_local.date().isoformat():
                  raise SystemExit(
                      f"FAST_CLOSE_PUBLICATION_DATE_MISMATCH city={city} publication_date={publication_date} generated_local={generated_local.date()}"
                  )
              age_hours = (now_utc - generated.astimezone(timezone.utc)).total_seconds() / 3600
              if require_fresh and (age_hours < -0.25 or age_hours > 6):
                  raise SystemExit(f"FAST_CLOSE_DATASET_STALE city={city} age_hours={age_hours:.2f}")
              print(
                  f"FAST_CLOSE_DATASET_OK city={city} events={len(events)} publication_date={publication_date} "
                  f"age_hours={age_hours:.2f} freshness_required={str(require_fresh).lower()}"
              )
          PY

      - name: Fast-close deterministic runtime contracts
        run: |
          set -euo pipefail
          node app/runtime-past-event-guard.test.mjs
          node app/data-pipeline.test.mjs
          python app/scripts/production_pwa_smoke.py local

      - name: Fast-close GitHub Pages and Cloudflare byte parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/production-fast-close
          python app/scripts/production_pwa_smoke.py http \
            | tee /tmp/production-fast-close/http.log
          grep -q '^PRODUCTION_ORIGIN_PARITY_OK origin=github-pages ' /tmp/production-fast-close/http.log
          grep -q '^PRODUCTION_ORIGIN_PARITY_OK origin=cloudflare ' /tmp/production-fast-close/http.log

      - name: Mark fast production closure
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse origin/main)"
          echo "PUBLICATION_FAST_CLOSE_VERIFIED head=$head origins=github-pages,cloudflare temporal=deterministic datasets=validated"
          {
            echo "## Fast production closure"
            echo ""
            echo "- Public main: \`$head\`"
            echo "- GitHub Pages byte parity: OK"
            echo "- Cloudflare byte parity: OK"
            echo "- Changed dataset freshness/identity: OK"
            echo "- Shared temporal/data-pipeline contracts: OK"
            echo "- Exhaustive Selenium/warm/offline PWA smoke continues as the deeper post-close defense."
          } >> "$GITHUB_STEP_SUMMARY"

  production-smoke:
    needs: sync-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout published candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install browser timing dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Require release bump for runtime pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$before" ]]; then
            echo "No comparison base available; continuing conservatively with production smoke."
            exit 0
          fi

          git diff --name-only "$before" "${{ github.sha }}" | tee changed-pwa-files.txt
          runtime_changed="$(grep -E '^(app/[^/]+\.(js|mjs|css|html|webmanifest)|app/cities\.json|manifest\.webmanifest)$' changed-pwa-files.txt || true)"
          release_changed="$(grep -Fx 'app/release-version.js' changed-pwa-files.txt || true)"
          if [[ -n "$runtime_changed" && -z "$release_changed" ]]; then
            echo "Production-visible PWA runtime changed without bumping app/release-version.js:" >&2
            printf '%s\n' "$runtime_changed" >&2
            echo "Bump the shared release before relying on a production smoke; otherwise the deployment cannot be distinguished from the previous runtime." >&2
            exit 1
          fi

      - name: Align smoke candidate with latest public main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "PRODUCTION_SMOKE_HEAD=$(git rev-parse HEAD)"
          mkdir -p /tmp/production-release-verification

      - name: Validate local shell before network smoke
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/production_pwa_smoke.py \
            app/scripts/production_browser_selenium_smoke.py \
            app/scripts/production_warm_start_smoke.py \
            app/scripts/test_web_pwa_visibility_parity.py \
            app/scripts/production_release_attestation.py
          python app/scripts/production_pwa_smoke.py local

      - name: Wait for both deployments and verify byte parity
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_pwa_smoke.py http \
            | tee /tmp/production-release-verification/http.log

      - name: Cold-load both cities on GitHub Pages and Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_browser_selenium_smoke.py \
            | tee /tmp/production-release-verification/browser.log

      - name: Warm-reopen Valpo mobile on GitHub Pages and Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_warm_start_smoke.py \
            | tee /tmp/production-release-verification/warm.log

      - name: Require exact live WEB versus cached PWA event IDs
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/test_web_pwa_visibility_parity.py \
            --production \
            --json-output /tmp/production-release-verification/web-pwa-parity.json \
            | tee /tmp/production-release-verification/parity.log

      - name: Create auditable production release attestation
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_release_attestation.py \
            --http-log /tmp/production-release-verification/http.log \
            --browser-log /tmp/production-release-verification/browser.log \
            --warm-log /tmp/production-release-verification/warm.log \
            --parity-report /tmp/production-release-verification/web-pwa-parity.json \
            --output /tmp/production-release-verification/production-release-attestation.json \
            --markdown-output /tmp/production-release-verification/summary.md \
            | tee /tmp/production-release-verification/attestation.log
          grep -q '^PRODUCTION_RELEASE_VERIFIED ' /tmp/production-release-verification/attestation.log
          cat /tmp/production-release-verification/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production release attestation
        uses: actions/upload-artifact@v6
        with:
          name: production-release-verification-${{ github.run_id }}
          path: /tmp/production-release-verification/
          if-no-files-found: error
          retention-days: 30
