name: Publish and production verification

on:
  push:
    branches: [main]
    paths:
      - "app/*.js"
      - "app/*.mjs"
      - "app/*.css"
      - "app/*.html"
      - "app/*.webmanifest"
      - "app/cities.json"
      - "app/data/source-registry.json"
      - "app/data/gijon/agenda_web.json"
      - "app/data/production-series-contracts.json"
      - "app/data/release-provenance.json"
      - "app/assets/event-images/**"
      - "admin-staging/**"
      - "assets/*.js"
      - "assets/*.mjs"
      - "index.html"
      - "agenda_web.json"
      - "fuentes_publicas.json"
      - "manifest.webmanifest"
      - "app/scripts/deployment_readiness.py"
      - "app/scripts/fast_close_dataset_validation.py"
      - "app/scripts/runtime_release_guard.py"
      - "app/scripts/production_pwa_smoke.py"
      - "app/scripts/production_browser_selenium_smoke.py"
      - "app/scripts/production_warm_start_smoke.py"
      - "app/scripts/test_web_pwa_visibility_parity.py"
      - "app/scripts/production_release_attestation.py"
      - "app/scripts/production_certification_history.py"
      - "app/scripts/production_admin_staging_smoke.py"
      - "app/scripts/production_release_chain.py"
      - "app/scripts/production_series_contract.py"
      - "app/scripts/release_finalizer.py"
      - "app/scripts/release_bundle.py"
      - ".github/workflows/publish.yml"
      - "cloudflare-build.sh"
  workflow_dispatch:
    # Explicit recovery path when an automated merge does not emit a push run.

permissions:
  contents: read
  pull-requests: read

env:
  CANDIDATE_SHA: ${{ github.sha }}
  GH_TOKEN: ${{ github.token }}

# Never cancel an already-started publication. Main releases are serialized so
# every accepted release gets its own complete deployment and attestation.
# Each run is immutable: it certifies the SHA that triggered the run, never a
# later origin/main that happened to arrive while verification was running.
concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  sync-cloudflare:
    name: sync-cloudflare
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v7
        with:
          ref: cloudflare-preview
          fetch-depth: 0

      - name: Create exact-tree handoff preserving deployment history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cloudflare-preview main
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "origin/cloudflare-preview^{commit}"
          git checkout --detach "$CANDIDATE_SHA"
          git merge --no-edit -s ours origin/cloudflare-preview

      - name: Require exact deployment-branch parity with candidate
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "$CANDIDATE_SHA" HEAD)"
          if [[ -n "$unexpected" ]]; then
            echo "cloudflare-preview diverged from candidate $CANDIDATE_SHA:"
            echo "$unexpected"
            exit 1
          fi

      - name: Require release bump for runtime pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-parse "${CANDIDATE_SHA}^" 2>/dev/null || true)"
          fi
          if [[ -z "$before" ]]; then
            echo "No comparison base available; continuing conservatively."
            exit 0
          fi

          python app/scripts/runtime_release_guard.py \
            --base-ref "$before" \
            --head-ref "$CANDIDATE_SHA"

      - name: Validate Cloudflare build snapshot and exact release lineage
        run: |
          set -euo pipefail
          bash cloudflare-build.sh
          test -f _cloudflare_site/app/index.html
          test -f _cloudflare_site/app/release-version.js
          test -f _cloudflare_site/app/service-worker.js
          test -f _cloudflare_site/app/event-detail.js
          test -f _cloudflare_site/app/data/gijon/agenda_web.json
          cmp app/release-version.js _cloudflare_site/app/release-version.js
          python scripts/verify_canonical_main_writer.py
          python app/scripts/release_finalizer.py --check-published --finalizer-ref "$CANDIDATE_SHA"

      - name: Push synchronized deployment branch
        run: |
          set -euo pipefail
          git push origin HEAD:cloudflare-preview

      - name: Fast-close changed dataset freshness and identity
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-parse "${CANDIDATE_SHA}^" 2>/dev/null || true)"
          fi
          python app/scripts/fast_close_dataset_validation.py --base-ref "$before"

      - name: Fast-close deterministic runtime contracts
        run: |
          set -euo pipefail
          node app/runtime-past-event-guard.test.mjs
          node app/data-pipeline.test.mjs
          python app/scripts/production_pwa_smoke.py local

      - name: Wait once for both production origins in parallel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/production-fast-close
          python app/scripts/deployment_readiness.py \
            --wait \
            --candidate-sha "$CANDIDATE_SHA" \
            --timeout-seconds 90 \
            --poll-seconds 2 \
            --output /tmp/production-fast-close/deployment-readiness.json \
            | tee /tmp/production-fast-close/http.log
          grep -q '^DEPLOYMENT_READY ' /tmp/production-fast-close/http.log
          grep -q '^PRODUCTION_ORIGIN_PARITY_OK origin=github-pages ' /tmp/production-fast-close/http.log
          grep -q '^PRODUCTION_ORIGIN_PARITY_OK origin=cloudflare ' /tmp/production-fast-close/http.log

      - name: Mark byte deployment, pending visual verification
        shell: bash
        run: |
          set -euo pipefail
          head="$CANDIDATE_SHA"
          echo "DEPLOYED_BYTE_VERIFIED head=$head origins=github-pages,cloudflare visual=pending"
          {
            echo "## Deployment byte verification"
            echo ""
            echo "- Candidate SHA: \`$head\`"
            echo "- GitHub Pages + Cloudflare reached byte parity within the bounded readiness gate."
            echo "- Changed dataset freshness/identity: OK"
            echo "- Shared temporal/data-pipeline contracts: OK"
            echo "- Canonical release lineage: OK"
            echo "- Publication is not final yet: visual verification is pending."
          } >> "$GITHUB_STEP_SUMMARY"

  production-smoke:
    needs: sync-cloudflare
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout immutable published candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install browser timing dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Assert immutable candidate and local contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin cloudflare-preview
          mkdir -p /tmp/production-release-verification
          echo "PRODUCTION_SMOKE_HEAD=$CANDIDATE_SHA"
          echo "PRODUCTION_CLOUDFLARE_HEAD=$(git rev-parse origin/cloudflare-preview)"
          python app/scripts/release_finalizer.py --check-published --finalizer-ref "$CANDIDATE_SHA" \
            | tee /tmp/production-release-verification/release-lineage.log
          python -m py_compile \
            app/scripts/deployment_readiness.py \
            app/scripts/fast_close_dataset_validation.py \
            app/scripts/runtime_release_guard.py \
            app/scripts/production_pwa_smoke.py \
            app/scripts/production_browser_selenium_smoke.py \
            app/scripts/production_warm_start_smoke.py \
            app/scripts/test_web_pwa_visibility_parity.py \
            app/scripts/production_release_attestation.py \
            app/scripts/production_certification_history.py \
            app/scripts/production_admin_staging_smoke.py \
            app/scripts/production_release_chain.py \
            app/scripts/production_series_contract.py \
            app/scripts/release_finalizer.py
          python app/scripts/production_pwa_smoke.py local

      - name: Re-assert deployed bytes without waiting
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/deployment_readiness.py \
            --assert-ready \
            --candidate-sha "$CANDIDATE_SHA" \
            --output /tmp/production-release-verification/deployment-readiness.json \
            | tee /tmp/production-release-verification/http.log
          grep -q '^DEPLOYMENT_READY_ASSERTED ' /tmp/production-release-verification/http.log

      - name: Run independent production probes in parallel
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/production-release-verification

          (
            set -euo pipefail
            python app/scripts/production_admin_staging_smoke.py >"$evidence/admin-staging.log" 2>&1
            python app/scripts/production_series_contract.py >"$evidence/series.log" 2>&1
            grep -q '^PRODUCTION_SERIES_CONTRACTS_VERIFIED ' "$evidence/series.log"
          ) &
          semantic_pid=$!

          python app/scripts/production_browser_selenium_smoke.py >"$evidence/browser.log" 2>&1 &
          browser_pid=$!

          python app/scripts/production_warm_start_smoke.py >"$evidence/warm.log" 2>&1 &
          warm_pid=$!

          python app/scripts/test_web_pwa_visibility_parity.py \
            --production \
            --json-output "$evidence/web-pwa-parity.json" \
            >"$evidence/parity.log" 2>&1 &
          parity_pid=$!

          failed=0
          wait_probe() {
            local label="$1"
            local pid="$2"
            if wait "$pid"; then
              echo "PRODUCTION_PROBE_OK probe=$label"
            else
              echo "::error title=Production probe failed::$label"
              failed=1
            fi
          }

          wait_probe semantics "$semantic_pid"
          wait_probe browser "$browser_pid"
          wait_probe warm-pwa "$warm_pid"
          wait_probe web-pwa-parity "$parity_pid"

          for log in admin-staging.log series.log browser.log warm.log parity.log; do
            echo "===== $log ====="
            cat "$evidence/$log" 2>/dev/null || true
          done

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "PRODUCTION_PROBES_PARALLEL_OK groups=4"

      - name: Create auditable production release attestation
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_release_attestation.py \
            --http-log /tmp/production-release-verification/http.log \
            --browser-log /tmp/production-release-verification/browser.log \
            --warm-log /tmp/production-release-verification/warm.log \
            --parity-report /tmp/production-release-verification/web-pwa-parity.json \
            --output /tmp/production-release-verification/production-release-attestation.json \
            --markdown-output /tmp/production-release-verification/summary.md \
            | tee /tmp/production-release-verification/attestation.log
          grep -q '^PRODUCTION_RELEASE_VERIFIED ' /tmp/production-release-verification/attestation.log
          grep -q '^PRODUCTION_ADMIN_STAGING_VERIFIED ' /tmp/production-release-verification/admin-staging.log
          cat /tmp/production-release-verification/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Certify exact source-to-production chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin cloudflare-preview
          python app/scripts/production_release_chain.py \
            --cloudflare-ref origin/cloudflare-preview \
            --attestation /tmp/production-release-verification/production-release-attestation.json \
            --output /tmp/production-release-verification/production-release-chain.json \
            | tee /tmp/production-release-verification/release-chain.log
          grep -q '^PRODUCTION_RELEASE_CHAIN_CERTIFIED ' /tmp/production-release-verification/release-chain.log
          {
            echo ""
            echo "### Exact release chain"
            echo '```'
            tail -n 1 /tmp/production-release-verification/release-chain.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout permanent production certification history
        uses: actions/checkout@v7
        with:
          ref: state/production-certifications
          path: .production-certification-state
          fetch-depth: 1

      - name: Persist immutable production certification
        shell: bash
        run: |
          set -euo pipefail
          attestation=/tmp/production-release-verification/production-release-attestation.json
          python app/scripts/production_certification_history.py \
            --attestation "$attestation" \
            --state-root .production-certification-state
          release="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["release"])' "$attestation")"
          head_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["head_sha"])' "$attestation")"
          if [[ "$head_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Certification attempted for mutable head: expected=$CANDIDATE_SHA actual=$head_sha" >&2
            exit 1
          fi
          git -C .production-certification-state config user.name "vivamos-production-certification[bot]"
          git -C .production-certification-state config user.email "vivamos-production-certification[bot]@users.noreply.github.com"
          git -C .production-certification-state add data/index.json data/releases
          if ! git -C .production-certification-state diff --cached --quiet; then
            git -C .production-certification-state commit -m "Record production certification v${release} ${head_sha:0:12}"
            git -C .production-certification-state push origin HEAD:state/production-certifications
          else
            echo "PRODUCTION_CERTIFICATION_HISTORY_UNCHANGED release=v${release} head=${head_sha}"
          fi

      - name: Upload production release attestation
        uses: actions/upload-artifact@v6
        with:
          name: production-release-verification-${{ github.run_id }}
          path: /tmp/production-release-verification/
          if-no-files-found: error
          retention-days: 30

  refresh-open-release-prs:
    name: refresh-open-release-prs
    needs: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refresh open same-repository PR candidates onto published main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.draft == false and .head.repo.full_name == .base.repo.full_name) | [.number, .head.sha] | @tsv' \
            | while IFS=$'\t' read -r number head_sha; do
                [[ -n "$number" && -n "$head_sha" ]] || continue
                echo "Refreshing PR #$number from head=$head_sha against newly published main"
                if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${number}/update-branch" -f expected_head_sha="$head_sha" >/tmp/update-branch.json 2>/tmp/update-branch.err; then
                  cat /tmp/update-branch.json
                else
                  echo "::notice title=PR refresh deferred::PR #$number could not be updated automatically (conflict, protected branch or concurrent head change). Fresh-main gate remains authoritative."
                  cat /tmp/update-branch.err || true
                fi
              done
          echo "OPEN_RELEASE_PRS_REFRESHED_OR_SAFELY_DEFERRED"
