name: PWA stale-worker recovery contract

on:
  push:
    branches: [main]
    paths:
      - "app/release-version.js"
      - "app/pwa.js"
      - "app/scripts/test_pwa_recovery_contract.mjs"
      - ".github/workflows/pwa-recovery-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/release-version.js"
      - "app/pwa.js"
      - "app/scripts/test_pwa_recovery_contract.mjs"
      - ".github/workflows/pwa-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check recovery scripts
        run: |
          node --check app/release-version.js
          node --check app/pwa.js
      - name: Verify stale-worker recovery contract
        run: node app/scripts/test_pwa_recovery_contract.mjs
