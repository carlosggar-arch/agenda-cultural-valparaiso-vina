name: Required release guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guard:
    name: release-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Compile guarded shell
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/run_contracts.py \
            app/scripts/run_browser_scenarios.py \
            app/scripts/test_release_guard.py \
            app/scripts/test_first_render_browser.py \
            app/scripts/test_startup_resilience_browser.py \
            app/scripts/test_schedule_interaction_browser.py \
            app/scripts/test_runtime_browser.py \
            app/scripts/test_pwa_cache_first_startup.py \
            app/scripts/test_date_filter_browser.py \
            app/scripts/test_exhibition_visual_parity.py \
            app/scripts/test_exhibition_filter_isolation_browser.py \
            app/scripts/test_structural_event_visibility_browser.py \
            app/scripts/test_pwa_install_browser.py \
            app/scripts/test_multicity_source_registry_coverage.py \
            app/scripts/test_priority_zero_monitors.py \
            app/scripts/generate_runtime_contracts.py \
            app/scripts/release_bundle.py \
            app/scripts/test_structural_hardening.py
          node --check app/app.js
          node --check app/app-core.js
          node --check app/data-pipeline.js
          node --check app/artequin-session-correction.js
          node --check app/artequin-session-correction.test.mjs
          node --check app/event-card-data-quality.mjs
          node --check app/event-card-data-quality.test.mjs
          node --check app/startup-stability.js
          node --check app/app-safe-mode.js
          node --check app/program-visibility-policy.js
          node --check app/session-occurrence-normalizer.js
          node --check app/combined-filters.js
          node --check app/combined-filters-safety.js
          node --check app/date-filter-architecture.test.mjs
          node --check app/public-title-normalizer.test.mjs
          node --check app/exhibition-groups.js
          node --check app/exhibition-group-core.mjs
          node --check app/exhibition-group-core.test.mjs
          node --check app/city-presentation-adapter.mjs
          node --check app/formation-cycle-classifier.js
          node --check app/registration-reminder-classifier.test.mjs
          node --check app/registration-reminders-architecture.test.mjs
          node --check app/venue-registry.generated.mjs
          node --check app/venue-identity.mjs
          node --check app/venue-identity.test.mjs
          node --check app/gijon-venue-hours.js
          node --check app/exhibition-hours.js
          node --check app/pwa.js
          node --check app/service-worker.js
          node --check app/service-worker-assets.generated.js
          node --check app/release-version.js
          node --check app/header-redesign.js
          node --check app/mobile-experience.js

      - name: Run required release and architecture contracts
        run: |
          set -euo pipefail
          python app/scripts/generate_runtime_contracts.py --check
          python app/scripts/release_bundle.py --check
          python app/scripts/test_structural_hardening.py
          python app/scripts/test_priority_zero_monitors.py
          node app/venue-identity.test.mjs
          node app/event-card-data-quality.test.mjs
          python app/scripts/run_contracts.py --profile required-release
          python app/scripts/test_pwa_cache_first_startup.py
          node app/data-pipeline.test.mjs
          node app/artequin-session-correction.test.mjs
          node app/session-occurrence-normalizer.test.mjs
          node app/program-visibility-policy.test.mjs
          node app/exhibition-group-core.test.mjs
          node app/registration-reminder-classifier.test.mjs
          node app/registration-reminders-architecture.test.mjs
          node app/date-filter-architecture.test.mjs
          node app/public-title-normalizer.test.mjs
          python app/scripts/test_multicity_source_registry_coverage.py

      - name: Run canonical browser scenarios
        run: |
          set -euo pipefail
          python app/scripts/run_browser_scenarios.py --all

      - name: Upload exhibition visual parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-visual-parity
          path: /tmp/exhibition-visual-parity/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Note production browser coverage
        run: |
          echo "This required check composes canonical product contracts plus browser scenarios for startup/city switching, filters/detail/media, and exhibitions."
          echo "Cache-first service-worker startup remains a release contract; the post-merge production PWA smoke verifies the deployed runtime."
