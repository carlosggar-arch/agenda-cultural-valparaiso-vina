name: Schedule contract PR validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/schedule-contract.mjs"
      - "app/schedule-contract.test.mjs"
      - "app/agenda-runtime-state.mjs"
      - "app/date-aware-exhibition-hours.mjs"
      - "app/schedule-display.js"
      - "app/today-session-presentation.mjs"
      - "app/venue-hours.mjs"
      - "assets/event-schedule-display.mjs"
      - "app/scripts/test_schedule_contract_point8.mjs"
      - "app/service-worker-assets.generated.js"
      - "app/data/release-bundle.json"
      - "app/release-version.js"
      - ".github/workflows/schedule-contract-pr-validation.yml"
  push:
    branches:
      - main
    paths:
      - "app/schedule-contract.mjs"
      - "app/schedule-contract.test.mjs"
      - "app/agenda-runtime-state.mjs"
      - "app/date-aware-exhibition-hours.mjs"
      - "app/schedule-display.js"
      - "app/today-session-presentation.mjs"
      - "app/venue-hours.mjs"
      - "assets/event-schedule-display.mjs"
      - "app/scripts/test_schedule_contract_point8.mjs"
      - "app/service-worker-assets.generated.js"
      - "app/data/release-bundle.json"
      - "app/release-version.js"
      - ".github/workflows/schedule-contract-pr-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check schedule modules
        run: |
          node --check app/schedule-contract.mjs
          node --check assets/event-schedule-display.mjs
          node --check app/date-aware-exhibition-hours.mjs
          node --check app/schedule-display.js
          node --check app/today-session-presentation.mjs
          node --check app/venue-hours.mjs

      - name: Run schedule contract regressions
        run: |
          node app/schedule-contract.test.mjs
          node app/scripts/test_schedule_contract_point8.mjs
          node app/session-occurrence-normalizer.test.mjs
          node app/date-aware-exhibition-hours.test.mjs
          node app/venue-hours.test.mjs
          node app/today-session-presentation.test.mjs

      - name: Check generated runtime contracts
        run: |
          python app/scripts/generate_runtime_contracts.py --check
          python app/scripts/release_bundle.py --check
