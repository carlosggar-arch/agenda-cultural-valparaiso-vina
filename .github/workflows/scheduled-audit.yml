name: Scheduled adaptive source audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit depth
        required: false
        default: weekly
        type: choice
        options:
          - daily
          - weekly
  schedule:
    # Lightweight source-health audit every day; deep live probes remain weekly.
    - cron: "35 11 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep the previous public state available as a cheap semantic baseline.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate audit code
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/audit_source_health.py \
            app/scripts/test_source_health_audit.py \
            app/scripts/source_health_contract.py \
            app/scripts/source_pipeline_health.py \
            app/scripts/test_source_pipeline_health.py \
            app/scripts/refresh_balmaceda_valpo_resilient.py \
            app/scripts/test_balmaceda_transport.py \
            scripts/semantic_quality_audit.py \
            scripts/classification_uncertainty_audit.py \
            app/scripts/test_classification_uncertainty_audit.py
          python app/scripts/test_source_health_audit.py
          python app/scripts/test_source_pipeline_health.py
          python app/scripts/test_balmaceda_transport.py
          python app/scripts/test_classification_uncertainty_audit.py

      - name: Measure weekly Actions budget
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python app/scripts/audit_actions_budget.py --repository "${{ github.repository }}"

      - name: Select audit mode
        id: audit_mode
        shell: bash
        run: |
          set -euo pipefail
          mode="daily"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Sunday retains the deep probes; all other scheduled days stay cheap.
            if [[ "$(date -u +%u)" == "7" ]]; then
              mode="weekly"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Audit mode: $mode"

      - name: Weekly live source probes
        if: steps.audit_mode.outputs.mode == 'weekly'
        shell: bash
        run: |
          set +e
          python app/scripts/refresh_balmaceda_valpo_resilient.py --no-write > audit-live-balmaceda.json
          echo $? > audit-live-balmaceda.exit
          python app/scripts/refresh_priority_zero_monitors.py --no-write > audit-live-priority-zero.json
          echo $? > audit-live-priority-zero.exit
          python app/scripts/refresh_valpocultura_zero_recovery.py --no-write > audit-live-valpocultura.json
          echo $? > audit-live-valpocultura.exit
          set -e

      - name: Build per-source acquisition and publication funnel
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/source_pipeline_health.py \
            --output source-pipeline-health.json

      - name: Build persisted diagnostic audit
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/audit_source_health.py \
            --mode "${{ steps.audit_mode.outputs.mode }}" \
            --output source-health-audit.json

      - name: Build automatic classification quality diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/semantic_quality_audit.py \
            --compare-ref HEAD^ \
            --json-output classification-semantic-quality.json \
            --markdown-output classification-semantic-quality.md
          python scripts/classification_uncertainty_audit.py \
            --compare-ref HEAD^ \
            --json-output classification-uncertainty.json \
            --markdown-output classification-uncertainty.md

      - name: Write audit summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('source-health-audit.json').read_text(encoding='utf-8'))
          pipeline = json.loads(Path('source-pipeline-health.json').read_text(encoding='utf-8'))
          s = report.get('summary') or {}
          print(f"## Source health audit — {report.get('status')}\n")
          print(f"Mode: **{report.get('mode')}**  ")
          print(f"Events: **{s.get('total_events')}** · Quality: **{s.get('quality_score')}**  ")
          print(f"Actionable zero sources: **{s.get('actionable_zero_sources')}** · Covered elsewhere: **{s.get('covered_elsewhere')}** · Verified inactive: **{s.get('verified_inactive_zero_sources')}**  ")
          print(f"BAJ: **{s.get('balmaceda_state')}**\n")
          if report.get('critical'):
              print('### Critical')
              for value in report['critical']:
                  print(f"- {value}")
          if report.get('warnings'):
              print('### Warnings')
              for value in report['warnings']:
                  print(f"- {value}")
          print(f"\n## Per-source acquisition/publication funnel — {pipeline.get('status')}\n")
          for city_id, city in (pipeline.get('cities') or {}).items():
              summary = city.get('summary') or {}
              print(
                  f"### {city_id}\n"
                  f"Healthy: **{summary.get('healthy', 0)}** · Stale: **{summary.get('stale', 0)}** · "
                  f"Fetch failed: **{summary.get('fetch_failed', 0)}** · Changed/no candidates: **{summary.get('content_changed_not_processed', 0)}** · "
                  f"Rejected: **{summary.get('candidates_rejected', 0)}** · Accepted/not published: **{summary.get('accepted_not_published', 0)}** · "
                  f"Freshness unknown: **{summary.get('freshness_unknown', 0)}**"
              )
              for row in city.get('sources') or []:
                  if row.get('health') in {'stale','fetch_failed','content_changed_not_processed','candidates_rejected','accepted_not_published'}:
                      print(
                          f"- `{row.get('id')}`: **{row.get('health')}** · current={row.get('published_current_count')} · "
                          f"age={row.get('age_hours')}h/SLA={row.get('expected_sla_hours')}h · "
                          f"raw/candidate/accepted/published={row.get('raw_items')}/{row.get('candidate_events')}/{row.get('accepted_events')}/{row.get('published_events')}"
                      )
          PY
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat classification-semantic-quality.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat classification-uncertainty.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classification quality evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: classification-quality-${{ steps.audit_mode.outputs.mode }}-${{ github.run_id }}
          path: |
            classification-semantic-quality.json
            classification-semantic-quality.md
            classification-uncertainty.json
            classification-uncertainty.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-health-audit-${{ steps.audit_mode.outputs.mode }}
          path: |
            source-health-audit.json
            source-pipeline-health.json
            audit-live-*.json
            audit-live-*.exit
            actions-budget-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail only on integrity blockers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('source-health-audit.json').read_text(encoding='utf-8'))
          pipeline = json.loads(Path('source-pipeline-health.json').read_text(encoding='utf-8'))
          blockers = []
          if report.get('status') == 'critical':
              blockers.extend(report.get('critical') or [])
          for city_id, city in (pipeline.get('cities') or {}).items():
              for source_id in city.get('critical_source_ids') or []:
                  blockers.append(f"accepted_not_published:{city_id}:{source_id}")
          if blockers:
              raise SystemExit('SOURCE_HEALTH_AUDIT_CRITICAL: ' + ', '.join(blockers))
          print('SOURCE_HEALTH_AUDIT_OK_OR_ATTENTION', report.get('status'), pipeline.get('status'))
          PY
