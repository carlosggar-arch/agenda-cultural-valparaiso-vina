name: Shared presentation runtime

on:
  pull_request:
    paths:
      - "app/**"
      - "assets/city-registry.mjs"
      - "assets/event-schedule-display.mjs"
      - "docs/CONTRACT_ARCHITECTURE.md"
      - "tests/contract-topology.json"
      - ".github/workflows/shared-presentation-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-presentation-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shared presentation contracts
        run: |
          python app/scripts/test_contract_topology.py
          python app/scripts/run_contracts.py --profile shared-presentation
          node --check app/schedule-contract.mjs
          node --check app/date-aware-exhibition-hours.mjs
          node --check app/gijon-venue-hours.js
          node --check app/city-source-evidence-adapter.mjs
          node --check app/source-evidence-normalizer.mjs
          node --check app/source-evidence-authority.test.mjs
          node --check app/public-text-sanitizer.mjs
          node --check assets/event-schedule-display.mjs
          node app/scripts/test_schedule_contract_point8.mjs
          node app/public-text-sanitizer.test.mjs
          node app/exhibition-group-architecture.test.mjs
          node app/event-card-data-quality.test.mjs
          node app/session-occurrence-normalizer.test.mjs
          node app/date-aware-exhibition-hours.test.mjs
          node app/venue-hours.test.mjs
          node app/today-session-presentation.test.mjs
