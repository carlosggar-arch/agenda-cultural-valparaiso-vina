name: Source pipeline health

on:
  pull_request:
    paths:
      - "agenda_web.json"
      - "app/data/gijon/agenda_web.json"
      - "app/data/quality/source-coverage.json"
      - "app/scripts/source_health_contract.py"
      - "app/scripts/source_pipeline_health.py"
      - "app/scripts/test_source_pipeline_health.py"
      - ".github/workflows/source-pipeline-health.yml"
  push:
    branches: [main]
    paths:
      - "agenda_web.json"
      - "app/data/gijon/agenda_web.json"
      - "app/data/quality/source-coverage.json"
      - "app/scripts/source_health_contract.py"
      - "app/scripts/source_pipeline_health.py"
      - "app/scripts/test_source_pipeline_health.py"
      - ".github/workflows/source-pipeline-health.yml"
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate source health contract
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/source_health_contract.py \
            app/scripts/source_pipeline_health.py \
            app/scripts/test_source_pipeline_health.py
          python app/scripts/test_source_pipeline_health.py
      - name: Build per-source acquisition/publication funnel
        run: |
          set -euo pipefail
          python app/scripts/source_pipeline_health.py \
            --output source-pipeline-health.json \
            --fail-on-critical
      - name: Summarize health
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("source-pipeline-health.json")
          if not path.exists():
              print("Source pipeline report was not produced.")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"## Source pipeline health — {report.get('status')}\n")
          for city_id, city in (report.get('cities') or {}).items():
              s = city.get('summary') or {}
              print(f"### {city_id}")
              print(
                  f"Healthy: **{s.get('healthy', 0)}** · Stale: **{s.get('stale', 0)}** · "
                  f"Fetch failed: **{s.get('fetch_failed', 0)}** · Changed/no candidates: **{s.get('content_changed_not_processed', 0)}** · "
                  f"Rejected: **{s.get('candidates_rejected', 0)}** · Accepted/not published: **{s.get('accepted_not_published', 0)}** · "
                  f"Freshness unknown: **{s.get('freshness_unknown', 0)}**"
              )
              for row in city.get('sources') or []:
                  if row.get('health') in {'stale','fetch_failed','content_changed_not_processed','candidates_rejected','accepted_not_published'}:
                      print(
                          f"- `{row.get('id')}`: **{row.get('health')}** · published={row.get('published_current_count')} · "
                          f"age={row.get('age_hours')}h · SLA={row.get('expected_sla_hours')}h · "
                          f"raw/candidate/accepted/published={row.get('raw_items')}/{row.get('candidate_events')}/{row.get('accepted_events')}/{row.get('published_events')}"
                      )
          PY
      - name: Upload source health evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-pipeline-health-${{ github.run_id }}
          path: source-pipeline-health.json
          if-no-files-found: ignore
          retention-days: 14
