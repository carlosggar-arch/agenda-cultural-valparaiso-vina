name: Changed source validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/scripts/refresh_*.py"
      - "app/scripts/test_*source*.py"
      - "app/scripts/test_balmaceda*.py"
      - "app/scripts/test_visitavina*.py"
      - "app/scripts/apply_*coverage.py"
      - "app/scripts/audit_source_health.py"
      - "app/scripts/test_source_health_audit.py"
      - "app/scripts/test_classification_uncertainty_audit.py"
      - "app/scripts/run_changed_source_tests.py"
      - "app/scripts/cache_official_images.py"
      - "app/scripts/test_cache_official_images.py"
      - "scripts/semantic_quality_audit.py"
      - "scripts/classification_uncertainty_audit.py"
      - "requirements-image-cache.txt"
      - "app/data/high_value_sources.json"
      - "app/data/source-registry.json"
      - "fuentes_publicas.json"
      - ".github/workflows/source-validation.yml"
      - ".github/workflows/scheduled-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-image-cache.txt
      - name: Classify image-cache dependency impact
        id: image_cache
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed="$(git diff --name-only "$base" "$head")"
          if grep -Eq '^(app/scripts/(cache_official_images|test_cache_official_images)\.py|requirements-image-cache\.txt)$' <<<"$changed"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "IMAGE_CACHE_DEPENDENCY_REQUIRED"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "IMAGE_CACHE_DEPENDENCY_SKIPPED"
          fi
      - name: Install image-cache dependency
        if: steps.image_cache.outputs.needed == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-image-cache.txt
      - name: Validate only affected source adapters
        run: python app/scripts/run_changed_source_tests.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
      - name: Validate classification quality diagnostic
        run: |
          python -m py_compile scripts/semantic_quality_audit.py scripts/classification_uncertainty_audit.py app/scripts/test_classification_uncertainty_audit.py
          python app/scripts/test_classification_uncertainty_audit.py
          python scripts/semantic_quality_audit.py --compare-ref "${{ github.event.pull_request.base.sha }}" --json-output /tmp/semantic-quality-pr.json
          python scripts/classification_uncertainty_audit.py --compare-ref "${{ github.event.pull_request.base.sha }}" --json-output /tmp/classification-uncertainty-pr.json
      - name: TEMP audit every current Teatro y danza event
        shell: bash
        run: |
          python - <<'PY'
          import json
          from scripts.event_semantics import build_event_semantics
          from scripts.semantic_quality_audit import load_city_events

          rows = []
          for item in load_city_events():
              city_id = str(item.get("city_id") or "")
              event = item.get("event") or {}
              semantics = build_event_semantics(event)
              if ((semantics.get("category") or {}).get("id")) != "teatro":
                  continue
              rows.append({
                  "city": city_id,
                  "id": event.get("id"),
                  "title": event.get("title"),
                  "source_id": event.get("source_id"),
                  "source_name": event.get("source_name"),
                  "raw_primary_category": event.get("primary_category"),
                  "description": str(event.get("description") or "")[:700],
                  "confidence": semantics.get("confidence"),
                  "score": semantics.get("score"),
                  "candidates": [
                      {
                          "category": (candidate.get("category") or {}).get("id"),
                          "score": candidate.get("score"),
                          "confidence": candidate.get("confidence"),
                      }
                      for candidate in (semantics.get("domain_candidates") or [])[:4]
                  ],
                  "evidence": semantics.get("evidence") or [],
              })
          rows.sort(key=lambda row: (row["city"], str(row["source_name"] or ""), str(row["title"] or "")))
          print("---THEATRE_CATEGORY_AUDIT_BEGIN---")
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          print(f"THEATRE_CATEGORY_AUDIT_COUNT={len(rows)}")
          print("---THEATRE_CATEGORY_AUDIT_END---")
          PY
      - name: Upload diagnostics only after failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: changed-source-diagnostics
          path: |
            source-diagnostics/
            /tmp/semantic-quality-pr.json
            /tmp/classification-uncertainty-pr.json
          if-no-files-found: ignore
          retention-days: 3
