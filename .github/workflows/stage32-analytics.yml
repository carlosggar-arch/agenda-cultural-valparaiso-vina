name: Stage 3.2 analytics validation

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/usage-analytics.js"
      - "index.html"
      - "app/index.html"
      - "app/service-worker.js"
      - "privacidad.html"
      - "scripts/generate_event_pages.py"
      - "scripts/stage31_site_generator.py"
      - "tests/test_stage32_analytics.py"
      - ".github/workflows/stage32-analytics.yml"
  push:
    branches: [main]
    paths:
      - "assets/usage-analytics.js"
      - "index.html"
      - "app/index.html"
      - "app/service-worker.js"
      - "privacidad.html"
      - "scripts/generate_event_pages.py"
      - "scripts/stage31_site_generator.py"
      - "tests/test_stage32_analytics.py"
      - ".github/workflows/stage32-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate analytics runtime and generated surfaces
        run: |
          set -euo pipefail
          node --check assets/usage-analytics.js
          node --check app/service-worker.js
          python -m py_compile scripts/generate_event_pages.py scripts/stage31_site_generator.py tests/test_stage32_analytics.py
          python -m unittest discover -s tests -p 'test_stage32_analytics.py' -v
          python scripts/stage31_site_generator.py --check
          git diff --check
