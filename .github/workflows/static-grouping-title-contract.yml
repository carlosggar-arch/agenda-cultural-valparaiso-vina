name: Unified grouping, title and layout contract

on:
  push:
    branches: [main]
    paths:
      - "app/app.js"
      - "app/public-title-normalizer.mjs"
      - "app/title-normalizer-bootstrap.js"
      - "app/exhibition-groups.js"
      - "app/exhibition-group-core.mjs"
      - "app/exhibition-hours.js"
      - "app/exhibition-compact.css"
      - "app/combined-filters-safety.js"
      - "app/service-worker.js"
      - "app/public-presentation-rules.mjs"
      - "app/data/gijon/agenda_web.json"
      - "app/release-version.js"
      - "app/scripts/test_static_grouping_title_contract.mjs"
      - ".github/workflows/static-grouping-title-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/app.js"
      - "app/public-title-normalizer.mjs"
      - "app/title-normalizer-bootstrap.js"
      - "app/exhibition-groups.js"
      - "app/exhibition-group-core.mjs"
      - "app/exhibition-hours.js"
      - "app/exhibition-compact.css"
      - "app/combined-filters-safety.js"
      - "app/service-worker.js"
      - "app/public-presentation-rules.mjs"
      - "app/data/gijon/agenda_web.json"
      - "app/release-version.js"
      - "app/scripts/test_static_grouping_title_contract.mjs"
      - ".github/workflows/static-grouping-title-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check canonical modules
        run: |
          node --check app/public-title-normalizer.mjs
          node --check app/title-normalizer-bootstrap.js
          node --check app/exhibition-groups.js
          node --check app/exhibition-group-core.mjs
          node --check app/exhibition-hours.js
          node --check app/combined-filters-safety.js
          node --check app/service-worker.js
          node --check app/app.js
      - name: Verify unified grouping, filter ownership and layout contract
        run: node app/scripts/test_static_grouping_title_contract.mjs
