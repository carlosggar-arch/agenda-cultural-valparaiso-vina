name: Sync Cloudflare preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cloudflare-preview
  cancel-in-progress: false

jobs:
  sync:
    name: Keep Cloudflare branch aligned with main
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Cloudflare deployment branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-preview
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge latest main without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Guard Cloudflare-only divergence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          unexpected="$(git diff --name-only origin/main HEAD | grep -v '^cloudflare-build\.sh$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "cloudflare-preview diverged from main outside cloudflare-build.sh:"
            echo "$unexpected"
            exit 1
          fi

      - name: Validate Cloudflare build snapshot
        shell: bash
        run: |
          set -euo pipefail
          bash cloudflare-build.sh
          test -f _cloudflare_site/app/index.html
          test -f _cloudflare_site/app/release-version.js
          test -f _cloudflare_site/app/service-worker.js
          test -f _cloudflare_site/app/event-detail.js
          test -f _cloudflare_site/app/data/gijon/agenda_web.json
          cmp app/release-version.js _cloudflare_site/app/release-version.js

      - name: Push synchronized Cloudflare branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:cloudflare-preview

      - name: Lightweight smoke of vivamos.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import time
          import urllib.request
          import uuid
          from pathlib import Path

          BASE = "https://vivamos.pages.dev"
          EXPECTED = {
              "/app/event-detail.js": Path("_cloudflare_site/app/event-detail.js").read_bytes(),
              "/app/data/gijon/agenda_web.json": Path("_cloudflare_site/app/data/gijon/agenda_web.json").read_bytes(),
              "/agenda_web.json": Path("_cloudflare_site/agenda_web.json").read_bytes(),
          }


          def digest(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()


          def fetch(path: str, timeout: int = 6) -> bytes:
              separator = "&" if "?" in path else "?"
              url = f"{BASE}{path}{separator}smoke={uuid.uuid4().hex}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "vivamos-cloudflare-light-smoke/1",
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:  # nosec B310 - fixed HTTPS origin
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}: {url}")
                  return response.read()


          remote = {}
          last_error = ""
          for attempt in range(1, 13):
              try:
                  candidate = {path: fetch(path) for path in EXPECTED}
                  mismatches = [
                      path
                      for path, expected in EXPECTED.items()
                      if digest(candidate[path]) != digest(expected)
                  ]
                  if not mismatches:
                      remote = candidate
                      print(f"CLOUDFLARE_DEPLOY_MATCH attempt={attempt}")
                      break
                  last_error = "stale files: " + ", ".join(mismatches)
              except Exception as exc:
                  last_error = str(exc)

              if attempt < 12:
                  time.sleep(5)
          else:
              raise SystemExit(f"Cloudflare did not publish the synchronized snapshot: {last_error}")

          detail = remote["/app/event-detail.js"].decode("utf-8", errors="replace")
          for marker in (
              "function gijonCorroboratingSource",
              '"Fuente mostrada"',
              '"Fuente corroborante ↗"',
              '"Open Data — último recurso ↗"',
          ):
              if marker not in detail:
                  raise SystemExit(f"Cloudflare Gijón source runtime is missing: {marker}")

          for city in ("valparaiso", "gijon"):
              page = fetch(f"/app/?city={city}")
              if b"<html" not in page.lower():
                  raise SystemExit(f"Cloudflare app shell is invalid for city={city}")
              print(f"CLOUDFLARE_LIGHT_HTTP_OK city={city}")

          print("CLOUDFLARE_LIGHT_SMOKE_OK")
          PY

      - name: Verify public Gijón corroborating event on Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import urllib.request
          import uuid
          from pathlib import Path
          from urllib.parse import urlparse

          BASE = "https://vivamos.pages.dev"
          ROOT = Path("_cloudflare_site")
          DATASET = ROOT / "app" / "data" / "gijon" / "agenda_web.json"


          def is_open_data_url(value: object) -> bool:
              text = str(value or "").strip()
              if not text.lower().startswith(("http://", "https://")):
                  return False
              try:
                  return (urlparse(text).hostname or "").lower() == "opendata.gijon.es"
              except ValueError:
                  return False


          def fetch(path: str, timeout: int = 6) -> bytes:
              separator = "&" if "?" in path else "?"
              url = f"{BASE}{path}{separator}smoke={uuid.uuid4().hex}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "vivamos-cloudflare-public-event-smoke/1",
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:  # nosec B310 - fixed HTTPS origin
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}: {url}")
                  return response.read()


          payload = json.loads(DATASET.read_text(encoding="utf-8"))
          selected = None
          for event in payload.get("events") or []:
              links = event.get("links") or {}
              source_name = str(event.get("source_name") or "").lower()
              provenance = event.get("source_url") or links.get("source")
              if not (is_open_data_url(provenance) or ("open data" in source_name and "gij" in source_name)):
                  continue

              corroborating = None
              for candidate in (links.get("municipal_page"), links.get("official")):
                  text = str(candidate or "").strip()
                  if text.lower().startswith(("http://", "https://")) and not is_open_data_url(text):
                      corroborating = text
                      break
              if not corroborating:
                  continue

              event_id = str(event.get("id") or "").strip()
              local_html = ROOT / "evento" / "gijon" / event_id / "index.html"
              local_ics = ROOT / "evento" / "gijon" / event_id / "evento.ics"
              if event_id and local_html.is_file() and local_ics.is_file():
                  selected = (event_id, str(event.get("title") or event_id), corroborating, local_html, local_ics)
                  break

          if selected is None:
              raise SystemExit("No deployed Gijón Open Data event with a corroborating permanent page was found")

          event_id, title, corroborating, local_html, local_ics = selected
          html_path = f"/evento/gijon/{event_id}/"
          ics_path = f"/evento/gijon/{event_id}/evento.ics"
          remote_html = fetch(html_path)
          remote_ics = fetch(ics_path)

          for label, remote, local in (
              ("HTML", remote_html, local_html.read_bytes()),
              ("ICS", remote_ics, local_ics.read_bytes()),
          ):
              if hashlib.sha256(remote).digest() != hashlib.sha256(local).digest():
                  raise SystemExit(f"Cloudflare {label} does not match the synchronized build for {event_id}")

          event_html = remote_html.decode("utf-8", errors="replace")
          escaped_url = html.escape(corroborating, quote=True)
          if corroborating not in event_html and escaped_url not in event_html:
              raise SystemExit(f"Corroborating URL is absent from deployed HTML: {corroborating}")
          for marker in ("Fuente mostrada", "Fuente corroborante", '"sameAs"'):
              if marker not in event_html:
                  raise SystemExit(f"Deployed permanent page is missing {marker}: {event_id}")
          if "opendata.gijon.es" in event_html.lower():
              raise SystemExit(f"Open Data leaked into the deployed public HTML for {event_id}")

          event_ics = remote_ics.decode("utf-8", errors="replace")
          if f"URL:{corroborating}" not in event_ics:
              raise SystemExit(f"Corroborating URL is absent from deployed ICS: {event_id}")
          if "opendata.gijon.es" in event_ics.lower():
              raise SystemExit(f"Open Data leaked into the deployed public ICS for {event_id}")

          print(f"CLOUDFLARE_GIJON_CORROBORATING_EVENT_OK id={event_id} title={title!r}")
          PY

      - name: Recheck Gijón source policy against deployed snapshot
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/test_gijon_source_detail.py
