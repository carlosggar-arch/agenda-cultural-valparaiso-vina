name: Multicity temporal priority validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/agenda-order-core.mjs"
      - "app/agenda-order-core.test.mjs"
      - "app/app-core.js"
      - "app/app.js"
      - "app/cities.json"
      - "app/exhibition-presentation-guard.js"
      - "app/release-version.js"
      - "app/temporal-priority.js"
      - "app/temporal-priority-core.mjs"
      - "app/scripts/test_temporal_priority_browser.py"
      - "tests/temporal-priority-core.test.mjs"
      - ".github/workflows/temporal-priority-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate temporal and agenda order contracts
        run: |
          node --check app/temporal-priority-core.mjs
          node --check app/temporal-priority.js
          node --check app/agenda-order-core.mjs
          node --check app/app.js
          node --check app/app-core.js
          node --test tests/temporal-priority-core.test.mjs
          node --test app/agenda-order-core.test.mjs

      - name: Validate multi-city architecture
        run: |
          python app/scripts/test_visual_multicity_v30.py
          python app/scripts/test_third_city_architecture.py

      - name: Validate temporal priority in a real browser
        run: |
          python app/scripts/test_first_render_browser.py
          python app/scripts/test_temporal_priority_browser.py
