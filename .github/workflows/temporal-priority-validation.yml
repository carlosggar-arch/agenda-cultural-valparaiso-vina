name: Multicity temporal priority validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/agenda-order-core.mjs"
      - "app/agenda-order-core.test.mjs"
      - "app/temporal-priority.js"
      - "app/temporal-priority-core.mjs"
      - "app/scripts/run_contracts.py"
      - "tests/temporal-priority-core.test.mjs"
      - "tests/contract-topology.json"
      - ".github/workflows/temporal-priority-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate fast temporal contracts
        run: |
          set -euo pipefail
          node --check app/temporal-priority-core.mjs
          node --check app/temporal-priority.js
          node --check app/agenda-order-core.mjs
          python app/scripts/run_contracts.py --profile temporal-fast

      - name: Note browser ownership
        run: echo "Temporal browser behavior is composed once by Required release guard via the canonical temporal-order scenario."
