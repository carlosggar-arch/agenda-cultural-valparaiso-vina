name: Temporary administrative non-event materialization

on:
  push:
    branches:
      - fix/administrative-application-non-events

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: fix/administrative-application-non-events
          fetch-depth: 0

      - name: Patch guard, tests and Valpo dataset
        run: python tmp_materialize_admin_non_event.py

      - name: Run content-quality regressions
        run: |
          python -m py_compile app/scripts/apply_content_quality_guard.py app/scripts/test_content_quality_guard.py
          python app/scripts/test_content_quality_guard.py

      - name: Verify intended diff and target absence
        run: |
          git status --short
          python -c "import json; d=json.load(open('agenda_web.json', encoding='utf-8')); assert 'agenda_7b8121a1ee3ce9d593a851ec' not in {e.get('id') for e in d.get('events', [])}; print('ADMIN_TARGET_ABSENT', d.get('counts'))"

      - name: Commit structural correction and remove temporary executor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-admin-non-event-materialize.yml tmp_materialize_admin_non_event.py
          git add app/scripts/apply_content_quality_guard.py app/scripts/test_content_quality_guard.py agenda_web.json
          git commit -m "Filter administrative application support from events"
          git push origin HEAD:fix/administrative-application-non-events
