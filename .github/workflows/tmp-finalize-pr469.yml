name: TEMP finalize PR 469

on:
  push:
    branches:
      - diag/review-current-theatre-category-20260825

permissions:
  contents: write

concurrency:
  group: tmp-finalize-pr469
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/structural-event-classification-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch current main
        run: git fetch --no-tags origin main
      - name: Prepare canonical release
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          python app/scripts/release_finalizer.py \
            --prepare \
            --base-ref origin/main \
            --source-sha "$source_sha" \
            --source-pr 469
      - name: Commit canonical generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/release-version.js \
            app/index.html \
            app/service-worker-assets.generated.js \
            app/venue-registry.generated.mjs \
            app/data/release-bundle.json \
            app/data/release-provenance.json
          git diff --cached --name-only
          git commit -m 'chore: finalize release for PR 469 [release-finalized]'
          git push origin HEAD:fix/structural-event-classification-20260825
