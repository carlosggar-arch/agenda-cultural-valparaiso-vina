name: Temporary canonical finalizer PR 486 v242

on:
  push:
    branches: [fix/permanent-event-page-canonical-parity-v242]

permissions:
  contents: write

concurrency:
  group: tmp-finalize-pr486-v242
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify immutable integration base and trigger
        run: |
          git fetch origin main fix/permanent-event-page-canonical-parity-v242
          test "$(git rev-parse origin/main)" = "4db21e6372abca3fa974c62c8806ee096ca29240"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/fix/permanent-event-page-canonical-parity-v242)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor origin/main HEAD
      - name: Create clean source boundary
        id: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-finalize-pr486-v242.yml
          git add .github/workflows/tmp-finalize-pr486-v242.yml
          git commit -m "Remove one-shot PR #486 release finalizer trigger"
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          test -z "$(git diff --name-only 4db21e6372abca3fa974c62c8806ee096ca29240 "${SOURCE_SHA}" | grep -E '^(app/release-version\.js|app/service-worker-assets\.generated\.js|app/venue-registry\.generated\.mjs|app/data/release-bundle\.json|app/data/release-provenance\.json)$' || true)"
          echo "SOURCE_BOUNDARY_OK source=${SOURCE_SHA}"
      - name: Prepare canonical release v242
        run: |
          SOURCE_SHA="${{ steps.source.outputs.source_sha }}"
          python app/scripts/release_finalizer.py --prepare --base-ref origin/main --source-sha "${SOURCE_SHA}" --source-pr 486
          python - <<'PY'
          import subprocess
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          paths = set(subprocess.check_output(["git", "diff", "--name-only", source], text=True).splitlines())
          allowed = {
              "app/release-version.js",
              "app/service-worker-assets.generated.js",
              "app/venue-registry.generated.mjs",
              "app/data/release-bundle.json",
              "app/data/release-provenance.json",
              "app/index.html",
          }
          bad = sorted(paths - allowed)
          if bad:
              raise SystemExit("FINALIZER_UNEXPECTED_PATHS=" + ",".join(bad))
          print("FINALIZER_OUTPUT_PATHS_OK " + ",".join(sorted(paths)))
          PY
      - name: Commit and validate canonical finalizer
        run: |
          SOURCE_SHA="${{ steps.source.outputs.source_sha }}"
          git add app/release-version.js app/service-worker-assets.generated.js app/venue-registry.generated.mjs app/data/release-bundle.json app/data/release-provenance.json app/index.html
          git commit -m "[release-finalized] finalize PR #486 v242"
          python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref HEAD
          echo "FINALIZER_SHA=$(git rev-parse HEAD)"
          echo "SOURCE_SHA=${SOURCE_SHA}"
      - name: Publish source boundary and finalizer atomically
        run: |
          test "$(git rev-parse origin/fix/permanent-event-page-canonical-parity-v242)" = "${GITHUB_SHA}"
          git push origin HEAD:fix/permanent-event-page-canonical-parity-v242
