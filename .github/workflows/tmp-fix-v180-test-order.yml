name: Temporary fix v180 test order

on:
  push:
    branches:
      - fix/multicity-exhibition-group-hours-20260821

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multicity-exhibition-group-hours-20260821
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix expected chronological order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tmp-structural-exhibition-fix-v180.yml')
          text = p.read_text(encoding='utf-8')
          old = '["short-1", "short-2", "long-1", "long-2"]'
          new = '["short-1", "long-1", "short-2", "long-2"]'
          if old not in text:
              raise SystemExit('expected-order anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-fix-v180-test-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta prueba al orden cronológico del agrupador"
          git push origin HEAD:fix/multicity-exhibition-group-hours-20260821
