name: TEMP finalize corrected PR 478

on:
  push:
    branches:
      - diag/matriarcas-final-category-20260825

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dedup-category-consensus-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare canonical release finalizer
        env:
          EXPECTED_SOURCE: 6a58a769b0a30e8f112a82530eeb6bf489f36e53
          EXPECTED_BASE: 0d9a19016f0a8b697ae6c0f721bf971338fe81dc
        run: |
          set -euo pipefail
          git config user.name "carlosggar-arch"
          git config user.email "carlosggar@gmail.com"
          git fetch --no-tags origin main fix/dedup-category-consensus-20260825
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          python app/scripts/test_production_pwa_smoke_contract.py
          python app/scripts/release_finalizer.py --prepare --base-ref origin/main --source-sha "$EXPECTED_SOURCE" --source-pr 478
          git diff --check
          git status --short
          git add app/release-version.js app/service-worker-assets.generated.js app/venue-registry.generated.mjs app/data/release-bundle.json app/data/release-provenance.json app/index.html
          test -n "$(git diff --cached --name-only)"
          git commit -m "[release-finalized] finalize PR #478"
          python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref HEAD
          git push origin HEAD:fix/dedup-category-consensus-20260825
