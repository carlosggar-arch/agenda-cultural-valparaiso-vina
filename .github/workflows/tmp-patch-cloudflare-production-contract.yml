name: Temporary materialize Cloudflare publisher patch

on:
  push:
    branches:
      - fix/cloudflare-production-build-contract-20260826

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: fix/cloudflare-production-build-contract-20260826
          fetch-depth: 0
      - name: Materialize patched publisher deterministically
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/publish.yml')
          text = path.read_text(encoding='utf-8')
          old_path = '      - ".github/workflows/publish.yml"\n'
          new_path = old_path + '      - "cloudflare-build.sh"\n'
          if text.count(old_path) != 1:
              raise SystemExit(f'publish trigger marker count={text.count(old_path)}')
          text = text.replace(old_path, new_path, 1)
          replacements = (
              ('      - name: Guard Cloudflare-only divergence from exact candidate', '      - name: Require exact deployment-branch parity with candidate'),
              ('          unexpected="$(git diff --name-only "$CANDIDATE_SHA" HEAD | grep -v \'^cloudflare-build\\.sh$\' || true)"', '          unexpected="$(git diff --name-only "$CANDIDATE_SHA" HEAD)"'),
              ('            echo "cloudflare-preview diverged from candidate $CANDIDATE_SHA outside cloudflare-build.sh:"', '            echo "cloudflare-preview diverged from candidate $CANDIDATE_SHA:"'),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'publisher marker count={text.count(old)} marker={old!r}')
              text = text.replace(old, new, 1)
          Path('tmp-publish-patched.yml.txt').write_text(text, encoding='utf-8')
          PY
      - name: Validate patched publisher in place
        run: |
          cp tmp-publish-patched.yml.txt .github/workflows/publish.yml
          bash cloudflare-build.sh
          test -f _cloudflare_site/fuentes_publicas.json
          python scripts/verify_canonical_main_writer.py
      - name: Publish only the non-workflow materialization
        run: |
          git checkout -- .github/workflows/publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-publish-patched.yml.txt
          git commit -m "Materialize validated Cloudflare publisher patch"
          git push origin HEAD:fix/cloudflare-production-build-contract-20260826
