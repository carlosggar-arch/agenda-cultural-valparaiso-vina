name: TEMP production freshness fix

on:
  push:
    branches:
      - diag/review-current-theatre-category-20260825

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-dataset-freshness-scope-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate structural freshness logic
        run: |
          set -euo pipefail
          python app/scripts/test_fast_close_dataset_validation.py
          python -m py_compile app/scripts/fast_close_dataset_validation.py scripts/materialize_public_categories.py
      - name: Normalize semantic materialization metadata
        run: |
          set -euo pipefail
          python scripts/materialize_public_categories.py agenda_web.json
          python app/scripts/fast_close_dataset_validation.py --base-ref main
      - name: Commit normalized Valparaiso metadata only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda_web.json
          if git diff --cached --quiet; then
            echo 'No dataset metadata changes needed.'
            exit 0
          fi
          git commit -m 'fix: normalize Valparaiso publication metadata'
          git push origin HEAD:fix/production-dataset-freshness-scope-20260825
