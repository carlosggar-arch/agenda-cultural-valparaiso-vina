name: TEMP refine musical context

on:
  push:
    branches:
      - fix/structural-event-classification-20260825

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[musical-refined]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/structural-event-classification-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refine contextual musical rule
        run: python scripts/_tmp_refine_musical_context.py
      - name: Regenerate browser taxonomy
        run: python scripts/generate_public_category_module.py
      - name: Validate category authority and regressions
        run: |
          node app/category-authority.test.mjs
          python app/scripts/test_public_category_regressions.py
          node app/public-category-regressions.test.mjs
          python scripts/generate_public_category_module.py --check
      - name: Commit generated taxonomy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/public-category-taxonomy.json app/public-category-taxonomy.generated.mjs
          git commit -m 'fix: distinguish contextual stage musicals from film titles [musical-refined]'
          git push origin HEAD:fix/structural-event-classification-20260825
