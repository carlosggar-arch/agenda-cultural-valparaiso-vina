name: Temporary regenerate v178 contracts

on:
  push:
    branches:
      - fix/gijon-date-hours-count-20260821

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gijon-date-hours-count-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate runtime and release bundle
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/generate_runtime_contracts.py --write
          python app/scripts/release_bundle.py --write
          rm -f .github/workflows/tmp-gijon-count-diagnostic.yml
          rm -f .github/workflows/tmp-regenerate-v178.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Release: regenerate v178 runtime contracts'
          git push origin HEAD:fix/gijon-date-hours-count-20260821
