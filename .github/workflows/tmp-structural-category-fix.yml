name: TEMP structural category fix

on:
  push:
    branches:
      - diag/review-current-theatre-category-20260825

permissions:
  contents: write

concurrency:
  group: tmp-structural-category-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[category-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diag/review-current-theatre-category-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply structural classifier changes
        run: |
          python scripts/_tmp_apply_structural_category_fix.py
          python scripts/_tmp_adjust_category_regression_fixture.py
      - name: Regenerate shared browser taxonomy
        run: python scripts/generate_public_category_module.py
      - name: Verify category regressions before materialization
        run: |
          python app/scripts/test_public_category_regressions.py
          node app/public-category-regressions.test.mjs
      - name: Regenerate category projections for both cities
        run: python scripts/materialize_public_categories.py agenda_web.json app/data/gijon/agenda_web.json
      - name: Verify all current explicit source tags after regeneration
        run: |
          python app/scripts/test_public_category_regressions.py
          node app/public-category-regressions.test.mjs
          python scripts/generate_public_category_module.py --check
          python scripts/semantic_quality_audit.py --json-output /tmp/category-semantic-quality.json
          python scripts/classification_uncertainty_audit.py --json-output /tmp/category-uncertainty.json
      - name: Commit generated structural fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/public-category-taxonomy.json app/public-category-taxonomy.generated.mjs scripts/public_category_rules.py app/public-category-rules.mjs app/scripts/test_public_category_regressions.py app/public-category-regressions.test.mjs scripts/materialize_public_categories.py .github/workflows/source-validation.yml agenda_web.json app/data/gijon/agenda_web.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix: reconcile public categories from semantic source evidence [category-generated]'
          git push origin HEAD:diag/review-current-theatre-category-20260825
