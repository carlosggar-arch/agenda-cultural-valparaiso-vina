name: Temporary structural exhibition fix v180

on:
  push:
    branches:
      - fix/multicity-exhibition-group-hours-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tmp-structural-exhibition-v180
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multicity-exhibition-group-hours-20260821
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply structural changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique in {path}: count={text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/exhibition-groups.js',
              '  groupStandaloneExhibitions,\n  partitionExhibitionsByDuration,\n  publicExhibitionCategoryId,',
              '  groupStandaloneExhibitions,\n  publicExhibitionCategoryId,',
          )
          replace_once(
              'app/exhibition-groups.js',
              '''  const config = currentConfig();\n  const { regular, long } = partitionExhibitionsByDuration(events, config);\n  const groups = [regular, long].flatMap((partition) => groupStandaloneExhibitions(partition, {\n    timezone: config?.timezone || "UTC",\n    minSize: EXHIBITION_GROUP_MIN,\n  }));''',
              '''  const config = currentConfig();\n  // Duration affects temporal priority, not venue identity. At this stage we\n  // only inspect cards that are still standalone, so overlapping exhibitions\n  // at the same canonical venue may be grouped even when one is a one-day\n  // activity and another is long-running. Existing groups are not reopened.\n  const groups = groupStandaloneExhibitions(events, {\n    timezone: config?.timezone || "UTC",\n    minSize: EXHIBITION_GROUP_MIN,\n  });''',
          )

          replace_once(
              'app/exhibition-hours.js',
              'import { venueRecordForEvent, venueRecordForName } from "./venue-identity.mjs?v=20260820-venues1";\n',
              '',
          )
          replace_once(
              'app/exhibition-hours.js',
              'import { gijonVenueHoursForDate } from "./gijon-venue-hours.js?v=20260821-visible-date1";\n',
              'import { venueHoursForDate } from "./venue-hours.mjs?v=20260821-datevenue1";\n',
          )
          replace_once(
              'app/exhibition-hours.js',
              '''function structuredRegistryHours(record, referenceDate) {\n  const hours = record?.opening_hours;\n  if (!hours || typeof hours !== "object") return null;\n  const hasStructuredWeekdays = Array.isArray(hours.open_weekdays) && hours.open_weekdays.length > 0;\n  const hasStructuredRange = /^\\d{2}:\\d{2}$/.test(String(hours.opening_time || ""))\n    && /^\\d{2}:\\d{2}$/.test(String(hours.closing_time || ""));\n  if (!(hasStructuredWeekdays || hasStructuredRange)) return null;\n  return dailyExhibitionHours({ opening_hours: hours }, {\n    timezone: indexedTimezone,\n    referenceDate,\n  })?.label || null;\n}\n\n''',
              '',
          )
          replace_once(
              'app/exhibition-hours.js',
              '''function explicitVenueHours(event) {\n  if (!isExhibition(event)) return null;\n  const referenceDate = referenceDateKey();\n  const scheduleHours = dailyExhibitionHours(event?.schedule, {\n    timezone: indexedTimezone,\n    referenceDate,\n  })?.label || null;\n  if (scheduleHours) return scheduleHours;\n\n  if (indexedCity === "gijon") {\n    return gijonVenueHoursForDate(event, referenceDate)?.display || null;\n  }\n\n  return structuredRegistryHours(venueRecordForEvent(event), referenceDate);\n}''',
              '''function explicitVenueHours(event) {\n  if (!isExhibition(event)) return null;\n  const referenceDate = referenceDateKey();\n  const scheduleHours = dailyExhibitionHours(event?.schedule, {\n    timezone: indexedTimezone,\n    referenceDate,\n  })?.label || null;\n  if (scheduleHours) return scheduleHours;\n\n  // Canonical venue hours are resolved through one shared, city-neutral path.\n  return venueHoursForDate(event, indexedCity, referenceDate)?.display || null;\n}''',
          )
          start = '''function patchGroupCard(card) {\n  if (!card.classList.contains("exhibition-venue-card")) return;'''
          end = '''\n  setGroupedOpeningHours(card, hours);\n}'''
          p = Path('app/exhibition-hours.js')
          text = p.read_text(encoding='utf-8')
          i = text.index(start)
          j = text.index(end, i) + len(end)
          replacement = '''function patchGroupCard(card) {\n  if (!card.classList.contains("exhibition-venue-card")) return;\n  const ids = String(card.dataset.eventGroup || "").split(",").map((value) => value.trim()).filter(Boolean);\n  if (!ids.length) return;\n  const events = ids.map((id) => eventsById.get(id)).filter(Boolean);\n  const referenceDate = referenceDateKey();\n  let hours = null;\n  for (const event of events) {\n    const venueHours = venueHoursForDate(event, indexedCity, referenceDate)?.display || null;\n    if (venueHours) {\n      hours = venueHours;\n      break;\n    }\n  }\n  if (!hours) hours = commonExplicitHours(events);\n  setGroupedOpeningHours(card, hours);\n}'''
          p.write_text(text[:i] + replacement + text[j:], encoding='utf-8')

          registry = Path('app/data/venue-registry.json')
          text = registry.read_text(encoding='utf-8')
          if '"id": "laboral_centro_arte"' not in text:
              anchor = '''    {\n      "id": "palacio_revillagigedo",'''
              entry = '''    {\n      "id": "laboral_centro_arte",\n      "city_names": ["Gijón", "Gijón/Xixón"],\n      "canonical_name": "LABoral Centro de Arte y Creación Industrial",\n      "aliases": ["LABoral Centro de Arte y Creación Industrial", "LABoral Centro de Arte"],\n      "opening_hours": {\n        "display": "Mar–vie 10:00–19:30 · sáb 11:00–19:30.",\n        "source_name": "LABoral Centro de Arte y Creación Industrial — Visita",\n        "source_url": "https://laboralcentrodearte.org/es/es-visita/",\n        "verified_at": "2026-08-21"\n      }\n    },\n'''
              if anchor not in text:
                  raise SystemExit('venue registry insertion anchor not found')
              registry.write_text(text.replace(anchor, entry + anchor, 1), encoding='utf-8')

          replace_once(
              'app/exhibition-group-core.test.mjs',
              '''const durationSafeGroups = [partitions.regular, partitions.long].flatMap((partition) =>\n  groupStandaloneExhibitions(partition, { timezone, minSize: EXHIBITION_GROUP_MIN }),\n);\nassert.equal(durationSafeGroups.length, 2, "short and long exhibitions at one venue must form separate groups");\nfor (const group of durationSafeGroups) {\n  const durationClasses = new Set(group.events.map((event) => isLongExhibitionDuration(event, durationOptions)));\n  assert.equal(durationClasses.size, 1, "a grouped card must never mix short and long exhibitions");\n}''',
              '''const crossDurationGroups = groupStandaloneExhibitions(mixedDurationSameVenue, {\n  timezone,\n  minSize: EXHIBITION_GROUP_MIN,\n});\nassert.equal(crossDurationGroups.length, 1, "standalone exhibitions at one venue may group across duration classes");\nassert.deepEqual(\n  crossDurationGroups[0].events.map((event) => event.id),\n  ["short-1", "short-2", "long-1", "long-2"],\n);\n\nconst pinoleMixedCategories = [\n  exhibition("pinole-itinerary", "Museo Nicanor Piñole", "2026-08-22", "2026-08-22", "museos"),\n  exhibition("pinole-sirio", "Museo Nicanor Piñole", "2026-03-12", "2026-08-23", "exposiciones"),\n];\nconst pinoleGroups = groupStandaloneExhibitions(pinoleMixedCategories, { timezone, minSize: EXHIBITION_GROUP_MIN });\nassert.equal(pinoleGroups.length, 1, "museum/exhibition labels must not prevent same-venue grouping");\nassert.deepEqual(pinoleGroups[0].events.map((event) => event.id), ["pinole-sirio", "pinole-itinerary"]);''',
          )

          release = Path('app/release-version.js')
          text = release.read_text(encoding='utf-8')
          text = text.replace('v179 restores date-specific exhibition hours and removes duplicated venue text in Gijón.',
                              'v180 unifies exhibition grouping and date-specific venue hours across cities.')
          text = text.replace('const RELEASE = 179;', 'const RELEASE = 180;')
          release.write_text(text, encoding='utf-8')
          PY

      - name: Add structural regression tests
        shell: bash
        run: |
          cat > app/venue-hours.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { dateSpecificHours, venueHoursForDate } from "./venue-hours.mjs";

          const pinole = "Mar–vie 09:30–14:00 y 17:00–19:30 · sáb, dom y festivos 10:00–14:00 y 17:00–19:30 · lunes cerrado.";
          assert.equal(dateSpecificHours(pinole, "2026-08-21"), "09:30–14:00 y 17:00–19:30");
          assert.equal(dateSpecificHours(pinole, "2026-08-22"), "10:00–14:00 y 17:00–19:30");
          const larena = "Lun–vie 08:00–21:30.";
          assert.equal(dateSpecificHours(larena, "2026-08-21"), "08:00–21:30");
          assert.equal(dateSpecificHours(larena, "2026-08-22"), "Cerrado");
          const laboral = "Mar–vie 10:00–19:30 · sáb 11:00–19:30.";
          assert.equal(dateSpecificHours(laboral, "2026-08-22"), "11:00–19:30");
          assert.equal(dateSpecificHours(laboral, "2026-08-23"), "Cerrado");
          const laboralEvent = { location: { venue: "LABoral Centro de Arte y Creación Industrial", city: "Gijón" }, schedule: {} };
          assert.equal(venueHoursForDate(laboralEvent, "gijon", "2026-08-22")?.display, "11:00–19:30");
          console.log("VENUE_HOURS_DATE_SPECIFIC_OK");
          EOF

          cat > app/exhibition-group-architecture.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const source = readFileSync(new URL("./exhibition-groups.js", import.meta.url), "utf8");
          assert.doesNotMatch(source, /partitionExhibitionsByDuration\(events, config\)/);
          assert.match(source, /const id = String\(card\.dataset\.eventId \|\| ""\)\.trim\(\);[\s\S]*?if \(!id\) continue;/);
          assert.match(source, /if \(!card\.dataset\.eventGroup \|\| card\.dataset\.unifiedExhibitionGroup === "true"\) continue;/);
          console.log("EXHIBITION_GROUP_ARCHITECTURE_OK");
          EOF

      - name: Run focused tests
        run: |
          node app/exhibition-group-core.test.mjs
          node app/exhibition-group-architecture.test.mjs
          node app/venue-hours.test.mjs
          node app/date-filter-architecture.test.mjs

      - name: Regenerate release contracts
        run: |
          python app/scripts/generate_runtime_contracts.py --write
          python app/scripts/generate_runtime_contracts.py --check
          python app/scripts/release_bundle.py --write
          python app/scripts/release_bundle.py --check

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-structural-exhibition-fix-v180.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige agrupación y horarios de exposiciones multiciudad (v180)"
          git push origin HEAD:fix/multicity-exhibition-group-hours-20260821
