name: TEMP audit visible unclassified Valpo

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Audit before and after PortalTickets enrichment
        run: |
          cp agenda_web.json /tmp/agenda-before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { classifyPublicCategory } from './app/public-category-rules.mjs';
          const data=JSON.parse(fs.readFileSync('agenda_web.json','utf8'));
          const rows=data.events.map(e=>({e,c:classifyPublicCategory(e)})).filter(x=>x.c.category.id==='unclassified');
          console.log(`UNCLASSIFIED_BEFORE=${rows.length}`);
          for (const {e,c} of rows) console.log('BEFORE '+JSON.stringify({id:e.id,title:e.title,start:e.schedule?.start||'',end:e.schedule?.end||'',source_id:e.source_id||'',description:e.description||'',tags:e.tags||[],editorial:e.editorial||null,score:c.score,candidates:c.candidates}));
          NODE
          python app/scripts/refresh_portaltickets_editorial.py
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { classifyPublicCategory } from './app/public-category-rules.mjs';
          const before=JSON.parse(fs.readFileSync('/tmp/agenda-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('agenda_web.json','utf8'));
          const bm=new Map(before.events.map(e=>[e.id,e]));
          const rows=after.events.map(e=>({e,c:classifyPublicCategory(e)}));
          const unclassified=rows.filter(x=>x.c.category.id==='unclassified');
          console.log(`UNCLASSIFIED_AFTER=${unclassified.length}`);
          for (const {e,c} of rows) {
            const b=bm.get(e.id); if (!b) continue;
            const bc=classifyPublicCategory(b);
            if (bc.category.id==='unclassified' || c.category.id==='unclassified') {
              console.log('AFTER '+JSON.stringify({id:e.id,title:e.title,start:e.schedule?.start||'',end:e.schedule?.end||'',source_id:e.source_id||'',before_category:bc.category,after_category:c.category,description:e.description||'',tags:e.tags||[],editorial:e.editorial||null,score:c.score,evidence:c.evidence,candidates:c.candidates}));
            }
          }
          NODE
