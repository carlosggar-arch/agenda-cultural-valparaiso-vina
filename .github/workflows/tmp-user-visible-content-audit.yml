name: TEMP Gijon semantic identity fix

on:
  push:
    branches:
      - diag/user-visible-category-content-20260825

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/valpo-semantic-content-integrity-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply candidate fix and inspect identity
        run: |
          set -euo pipefail
          git fetch origin diag/user-visible-category-content-20260825
          test "$(git rev-parse HEAD)" = "53f88c41bad8526c1405bbea89caaae9e093f321"
          git show origin/diag/user-visible-category-content-20260825:scripts/_tmp_gijon_capsula_structural_fix.py > /tmp/a.py
          git show origin/diag/user-visible-category-content-20260825:scripts/_tmp_gijon_recovery_score_fix.py > /tmp/b.py
          python /tmp/a.py
          python /tmp/b.py
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadAgendaDataset } from './app/data-pipeline.js';
          import { areProbableDuplicateEvents, venuesLikelySame, titlesLikelySame } from './app/event-identity-core.mjs';
          import { sameLocalOccurrenceStart, sameLocalOccurrenceDate, minimumOccurrenceStartDifferenceMinutes } from './app/occurrence-identity-core.mjs';
          const city = JSON.parse(fs.readFileSync('./app/cities.json','utf8')).cities.find(x=>x.id==='gijon');
          const payload = JSON.parse(fs.readFileSync('./app/data/gijon/agenda_web.json','utf8'));
          const fetchImpl=async url=>({ok:String(url)===String(city.dataset),status:200,json:async()=>structuredClone(payload)});
          const result=await loadAgendaDataset(city,{fetchImpl,now:new Date('2026-08-25T17:30:00-04:00')});
          const matches=result.dataset.events.filter(e=>`${e.title||''} ${e.description||''}`.toLowerCase().includes('tercera luz'));
          console.log('MATCHES='+JSON.stringify(matches.map(e=>({id:e.id,title:e.title,source:e.source_id,venue:e.location?.venue,venue_id:e.location?.venue_id,start:e.schedule?.start,end:e.schedule?.end,dates:e.schedule?.dates,event_type:e.event_type,official:e.public_status?.source_official})),null,2));
          if(matches.length===2){const[a,b]=matches; console.log('IDENTITY='+JSON.stringify({venues:venuesLikelySame(a,b),titles:titlesLikelySame(a.title,b.title),sameStart:sameLocalOccurrenceStart(a,b),sameDate:sameLocalOccurrenceDate(a,b),minutes:minimumOccurrenceStartDifferenceMinutes(a,b),probable:areProbableDuplicateEvents(a,b)}));}
          NODE
