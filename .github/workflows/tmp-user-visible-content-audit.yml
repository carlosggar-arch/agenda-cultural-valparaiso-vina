name: TEMP Gijon semantic identity fix

on:
  push:
    branches:
      - diag/user-visible-category-content-20260825

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/valpo-semantic-content-integrity-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply structural Gijon fix
        run: |
          set -euo pipefail
          git fetch origin main diag/user-visible-category-content-20260825 fix/valpo-semantic-content-integrity-20260825
          test "$(git rev-parse HEAD)" = "53f88c41bad8526c1405bbea89caaae9e093f321"
          git show origin/diag/user-visible-category-content-20260825:scripts/_tmp_gijon_capsula_structural_fix.py > /tmp/gijon_fix.py
          git show origin/diag/user-visible-category-content-20260825:scripts/_tmp_gijon_recovery_score_fix.py > /tmp/gijon_score.py
          git show origin/diag/user-visible-category-content-20260825:scripts/_tmp_gijon_production_semantic_guard.py > /tmp/gijon_smoke.py
          python /tmp/gijon_fix.py
          python /tmp/gijon_score.py
          python /tmp/gijon_smoke.py
      - name: Run permanent regressions and exact Gijon runtime proof
        run: |
          set -euo pipefail
          node app/title-normalizer-bootstrap.test.mjs
          node --test app/cross-source-deduplication.test.mjs
          python -m py_compile app/scripts/production_browser_selenium_smoke.py
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadAgendaDataset } from './app/data-pipeline.js';
          const cities = JSON.parse(fs.readFileSync('./app/cities.json','utf8')).cities;
          const city = cities.find(x => x.id === 'gijon');
          const payload = JSON.parse(fs.readFileSync('./app/data/gijon/agenda_web.json','utf8'));
          const fetchImpl = async url => ({ok:String(url)===String(city.dataset), status:200, json:async()=>structuredClone(payload)});
          const result = await loadAgendaDataset(city,{fetchImpl,now:new Date('2026-08-25T17:30:00-04:00')});
          const events = result.dataset.events;
          const malformed = events.filter(e => String(e.title||'').toLowerCase().includes('00 y las 07:30h'));
          const matches = events.filter(e => {
            const text = `${e.title||''} ${e.description||''}`.toLowerCase();
            return text.includes('cápsula radio') && text.includes('tercera luz');
          });
          console.log('GIJON_CAPSULA_RUNTIME='+JSON.stringify(matches.map(e=>({id:e.id,title:e.title,category:e.primary_category?.id,source:e.source_id,merged:e.editorial?.merged_duplicate_ids||[]}))));
          console.log(`GIJON_MALFORMED_VISIBLE=${malformed.length}`);
          if (malformed.length !== 0) process.exit(1);
          if (matches.length !== 1) process.exit(2);
          if (matches[0].primary_category?.id !== 'exposiciones') process.exit(3);
          if (matches[0].source_id !== 'gijon_opendata_events') process.exit(4);
          NODE
          python app/scripts/run_changed_source_tests.py --base origin/main
      - name: Commit source changes only
        run: |
          set -euo pipefail
          git config user.name "carlosggar-arch"
          git config user.email "carlosggar@gmail.com"
          git diff --check
          git add app/title-normalizer-bootstrap.js app/event-identity-core.mjs app/title-normalizer-bootstrap.test.mjs app/cross-source-deduplication.test.mjs app/scripts/production_browser_selenium_smoke.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "Reconcile malformed Gijon social events with official records"
          git push origin HEAD:fix/valpo-semantic-content-integrity-20260825
