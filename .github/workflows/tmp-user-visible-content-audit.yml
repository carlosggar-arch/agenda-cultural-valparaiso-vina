name: TEMP finalize PR 479

on:
  push:
    branches:
      - diag/user-visible-category-content-20260825

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/valpo-semantic-content-integrity-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare canonical release finalizer
        env:
          EXPECTED_SOURCE: 53f88c41bad8526c1405bbea89caaae9e093f321
        run: |
          set -euo pipefail
          git config user.name "carlosggar-arch"
          git config user.email "carlosggar@gmail.com"
          git fetch --no-tags origin main fix/valpo-semantic-content-integrity-20260825
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse origin/main)" = "54c8a58e17b283bc2f1fe7303738bc00fbc75e61"
          python app/scripts/release_finalizer.py --prepare --base-ref origin/main --source-sha "$EXPECTED_SOURCE" --source-pr 479
          git diff --check
          git status --short
          git add app/release-version.js app/service-worker-assets.generated.js app/venue-registry.generated.mjs app/data/release-bundle.json app/data/release-provenance.json app/index.html
          test -n "$(git diff --cached --name-only)"
          git commit -m "[release-finalized] finalize PR #479"
          python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref HEAD
          git push origin HEAD:fix/valpo-semantic-content-integrity-20260825
