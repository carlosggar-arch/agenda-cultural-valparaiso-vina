name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  validate-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/valpo-visible-category-authority-20260825
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh PortalTickets and materialize shared categories
        run: |
          cp agenda_web.json /tmp/agenda-before.json
          python app/scripts/refresh_portaltickets_editorial.py
          python scripts/materialize_public_categories.py agenda_web.json
          python - <<'PY'
          import json
          from pathlib import Path
          before={e['id']:e for e in json.loads(Path('/tmp/agenda-before.json').read_text())['events']}
          after=json.loads(Path('agenda_web.json').read_text())['events']
          portal=[e for e in after if e.get('source_id')=='portaltickets_valparaiso']
          print('PORTAL_COUNT',len(portal))
          for e in portal:
              old=before.get(e['id'])
              oldcat=(old.get('primary_category') or {}).get('id') if old else None
              newcat=(e.get('primary_category') or {}).get('id')
              if oldcat != newcat or newcat == 'unclassified':
                  print('CATEGORY',json.dumps({
                    'id':e.get('id'),'title':e.get('title'),'old':oldcat,'new':newcat,
                    'label':(e.get('primary_category') or {}).get('label'),
                    'description':e.get('description'),'tags':e.get('tags'),
                    'confidence':(e.get('editorial') or {}).get('category_confidence'),
                    'url':(e.get('links') or {}).get('tickets')
                  },ensure_ascii=False))
          targets=['PREVIA ANIVERSARIO','FIESTA ANIVERSARIO POSEIDON','SPECIAL ANNIVERSARY SHOW PLACEBO 30 AÑOS','MARIO REYES LEYENDA GIPSY','2 AÑOS DE WAREBA','SOFÍA ALVEZ EN EL PASAJE']
          for title in targets:
              found=[e for e in portal if e.get('title')==title]
              if found:
                  e=found[0]
                  print('TARGET',json.dumps({'title':title,'category':e.get('primary_category'),'description':e.get('description'),'tags':e.get('tags'),'confidence':(e.get('editorial') or {}).get('category_confidence')},ensure_ascii=False))
          PY
      - name: Run source regression after live refresh
        run: |
          python app/scripts/test_portaltickets_editorial.py
          python app/scripts/test_public_category_regressions.py
          node app/public-category-regressions.test.mjs
          node app/formation-cycle-classifier.test.mjs
