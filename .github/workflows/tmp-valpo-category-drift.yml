name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/valpo-visible-category-authority-20260825
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enumerate current PortalTickets category gaps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('agenda_web.json').read_text())
          pts=[e for e in data['events'] if e.get('source_id')=='portaltickets_valparaiso']
          print('PORTALTICKETS_COUNT', len(pts))
          for e in pts:
              c=(e.get('primary_category') or {}).get('id')
              if c in {'unclassified','cultura'}:
                  print('GAP', json.dumps({
                      'id':e.get('id'),'title':e.get('title'),'category':e.get('primary_category'),
                      'tags':e.get('tags'),'description':e.get('description'),'url':(e.get('links') or {}).get('tickets')
                  }, ensure_ascii=False))
          PY
