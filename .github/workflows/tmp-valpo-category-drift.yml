name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Audit Other panoramas after the same semantic stages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { normalizeAgendaPublicText } from './app/public-text-sanitizer.mjs';
          import { applyEventDataCorrections } from './app/event-data-corrections.js';
          import { normalizeAgendaCategories } from './app/category-normalizer.js';
          import { normalizeVenueAliases } from './app/venue-identity.mjs';
          import { normalizeAgendaTitles, recoverAgendaTitles } from './app/title-normalizer-bootstrap.js';
          import { normalizeSessionOccurrences } from './app/session-occurrence-normalizer.js';
          import { normalizeEventSeries } from './app/event-series-normalizer.mjs';
          import { normalizeFormationCycles } from './app/formation-cycle-classifier.js';
          import { applyDeclarativeEventCorrectionRules } from './app/event-correction-rules.mjs';
          import { normalizeSourceDisplayNames } from './app/data-pipeline.js';
          import { classifyPublicCategory } from './app/public-category-rules.mjs';

          let dataset = JSON.parse(fs.readFileSync('agenda_web.json', 'utf8'));
          const rawById = new Map(dataset.events.map(e => [e.id, e]));
          dataset = normalizeAgendaPublicText(dataset);
          dataset = normalizeSourceDisplayNames(dataset);
          dataset = applyEventDataCorrections(dataset);
          dataset = recoverAgendaTitles(dataset);
          dataset = normalizeAgendaCategories(dataset);
          dataset = {...dataset, events: normalizeVenueAliases(dataset.events)};
          dataset = applyDeclarativeEventCorrectionRules(dataset, {cityId:'valparaiso'});
          dataset = normalizeAgendaTitles(dataset);
          dataset = normalizeEventSeries(dataset, {cityId:'valparaiso'});
          dataset = normalizeSessionOccurrences(dataset);
          dataset = normalizeFormationCycles(dataset);
          const others = dataset.events.filter(e => e.primary_category?.id === 'unclassified');
          console.log(`OTHER_PANORAMAS_TOTAL count=${others.length}`);
          for (const event of others) {
            const raw = rawById.get(event.id) || {};
            const classified = classifyPublicCategory(event);
            console.log('OTHER_PANORAMA', JSON.stringify({
              id:event.id,
              title:event.title,
              original_title:event.original_title,
              raw_title:raw.title,
              source:event.source_name,
              source_id:event.source_id,
              tags:event.tags,
              description:String(event.description || '').slice(0,500),
              raw_category:raw.primary_category,
              candidates:classified.candidates,
              evidence:classified.evidence,
            }));
          }
          NODE
