name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/valpo-visible-category-authority-v2-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare canonical release finalizer
        env:
          EXPECTED_SOURCE: ca4d7c96fb1ea5b0546bd3efd28b0cd5b9d0c54b
        run: |
          set -euo pipefail
          git config user.name "carlosggar-arch"
          git config user.email "carlosggar@gmail.com"
          git fetch --no-tags origin main fix/valpo-visible-category-authority-v2-20260825
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python app/scripts/release_finalizer.py --prepare --base-ref origin/main --source-sha "$EXPECTED_SOURCE" --source-pr 472
          git diff --check
          git status --short
          git add app/release-version.js app/service-worker-assets.generated.js app/venue-registry.generated.mjs app/data/release-bundle.json app/data/release-provenance.json app/index.html
          test -n "$(git diff --cached --name-only)"
          git commit -m "[release-finalized] finalize PR #472"
          python app/scripts/release_finalizer.py --check --base-ref origin/main --finalizer-ref HEAD
          git push origin HEAD:fix/valpo-visible-category-authority-v2-20260825
