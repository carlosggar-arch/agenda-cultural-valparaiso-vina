name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect structured metadata on sparse PortalTickets events
        run: |
          python - <<'PY'
          import json, re
          from html import unescape
          from urllib.request import Request, urlopen

          urls = [
              'https://www.portaldisc.com/evento/aniversariowareba',
              'https://www.portaldisc.com/evento/llenode97',
              'https://www.portaldisc.com/evento/sofiaalvezvinadelmar',
              'https://www.portaldisc.com/evento/esstelarbdayenclubsegundopisovalparaiso',
          ]
          for url in urls:
              req = Request(url, headers={'User-Agent':'Mozilla/5.0', 'Accept-Language':'es-CL,es;q=0.9'})
              with urlopen(req, timeout=20) as response:
                  markup = response.read().decode(response.headers.get_content_charset() or 'utf-8', errors='replace')
              print('\nURL', url)
              print('HAS_MUSICEVENT', bool(re.search(r'MusicEvent', markup, re.I)))
              for match in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', markup, re.I|re.S):
                  text = unescape(match).strip()
                  try:
                      obj = json.loads(text)
                      print('JSONLD', json.dumps(obj, ensure_ascii=False)[:4000])
                  except Exception:
                      print('JSONLD_RAW', re.sub(r'\s+',' ',text)[:2000])
              for pattern in [r'<meta[^>]+(?:property|name)=["\']([^"\']+)["\'][^>]+content=["\']([^"\']*)["\']', r'<meta[^>]+content=["\']([^"\']*)["\'][^>]+(?:property|name)=["\']([^"\']+)["\']']:
                  for a,b in re.findall(pattern, markup, re.I):
                      pair = (a,b)
                      if any(k in (' '.join(pair)).lower() for k in ['type','category','genre','music','description','title']):
                          print('META', pair)
              for keyword in ['categoria', 'category', 'genero', 'genre', 'music', 'musica']:
                  positions = [m.start() for m in re.finditer(keyword, markup, re.I)]
                  if positions:
                      p = positions[0]
                      print('KW', keyword, re.sub(r'\s+',' ',markup[max(0,p-180):p+420])[:600])
          PY
