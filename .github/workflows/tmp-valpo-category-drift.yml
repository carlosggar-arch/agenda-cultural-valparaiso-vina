name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compare repository and deployed datasets
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path

          event_id = 'agenda_9007884dd819ed9a575ebda9'
          local_bytes = Path('agenda_web.json').read_bytes()
          local = json.loads(local_bytes)
          local_event = next(e for e in local['events'] if e.get('id') == event_id)
          print('LOCAL_DATASET', {
              'sha256': hashlib.sha256(local_bytes).hexdigest(),
              'generated_at': local.get('generated_at'),
              'publication_date': local.get('publication_date'),
              'event_title': local_event.get('title'),
              'event_category': local_event.get('primary_category'),
          })

          urls = {
              'github-pages': 'https://carlosggar-arch.github.io/agenda-cultural-valparaiso-vina/agenda_web.json',
              'cloudflare': 'https://vivamos.pages.dev/agenda_web.json',
          }
          for name, base in urls.items():
              url = f'{base}?categorydiag={time.time_ns()}'
              req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  headers = dict(response.headers.items())
              data = json.loads(raw)
              event = next(e for e in data['events'] if e.get('id') == event_id)
              print('DEPLOYED_DATASET', name, {
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'generated_at': data.get('generated_at'),
                  'publication_date': data.get('publication_date'),
                  'event_title': event.get('title'),
                  'event_category': event.get('primary_category'),
                  'cache_control': headers.get('Cache-Control'),
                  'etag': headers.get('ETag'),
                  'age': headers.get('Age'),
              })
          PY
