name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/valpo-visible-category-authority-20260825
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compare PortalTickets related-tag links
        env:
          PYTHONPATH: app/scripts
        run: |
          python - <<'PY'
          from refresh_portaltickets_editorial import fetch_url, PortalTokenParser, norm
          urls=[
            'https://www.portaldisc.com/evento/aniversariowareba',
            'https://www.portaldisc.com/evento/sofiaalvezvinadelmar',
            'https://www.portaldisc.com/evento/matriarcas-en-parque-cultural-devalparaiso',
            'https://www.portaldisc.com/evento/trip28-08',
          ]
          for url in urls:
            ok,status,markup,error=fetch_url(url)
            print('\nURL',url,ok,status,error)
            if not ok: continue
            p=PortalTokenParser(); p.feed(markup); p.close()
            toks=p.tokens
            start=next((i for i,t in enumerate(toks) if norm(t.get('text'))=='artistas y tags relacionados'),None)
            if start is None:
              print('NO_SECTION'); continue
            for t in toks[start:start+25]:
              text=str(t.get('text') or '').strip()
              if norm(text)=='produce': break
              print('REL',repr(text),'HREF',repr(t.get('href')))
          PY
