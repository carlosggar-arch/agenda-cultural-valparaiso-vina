name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect current PortalTickets detail semantics
        shell: bash
        run: |
          PYTHONPATH=app/scripts python - <<'PY'
          import json
          from pathlib import Path
          from refresh_portaltickets_editorial import fetch_url, PortalTokenParser, norm

          data = json.loads(Path('agenda_web.json').read_text())
          targets = [e for e in data['events'] if e.get('source_id') == 'portaltickets_valparaiso' and (e.get('primary_category') or {}).get('id') in {'unclassified','cultura'}]
          for event in targets:
              url = (event.get('links') or {}).get('tickets') or event.get('source_url')
              ok, status, markup, error = fetch_url(url)
              print('PT_TARGET', json.dumps({'id':event.get('id'),'title':event.get('title'),'url':url,'ok':ok,'status':status,'error':error}, ensure_ascii=False))
              if not ok:
                  continue
              parser = PortalTokenParser(); parser.feed(markup); parser.close()
              texts = [str(t.get('text') or '').strip() for t in parser.tokens if str(t.get('text') or '').strip()]
              idx = next((i for i,t in enumerate(texts) if norm(t) == 'artistas y tags relacionados'), None)
              if idx is None:
                  print('PT_TAGS', json.dumps({'id':event.get('id'),'found':False}, ensure_ascii=False))
                  continue
              excerpt = texts[idx:idx+18]
              print('PT_TAGS', json.dumps({'id':event.get('id'),'found':True,'excerpt':excerpt}, ensure_ascii=False))
          PY
