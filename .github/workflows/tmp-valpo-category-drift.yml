name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/valpo-visible-category-authority-20260825
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Diagnose shared classifier probes
        run: |
          python - <<'PY'
          import json
          from scripts.public_category_rules import classify_public_category, description_evidence_text
          probes = [
            {
              'title':'PAULA RIVAS', 'description':'Paula Rivas presenta un concierto especial en Valparaíso.',
              'event_type':'event','primary_category':{'id':'cultura','label':'Cultura'},
              'categories':[{'id':'cultura','label':'Cultura'}], 'tags':['Cultura','PortalTickets'],
              'source_id':'portaltickets_valparaiso', 'source_name':'PortalTickets — Región de Valparaíso',
              'location':{'city':'Valparaíso','venue':'Teatro Mauri SCD, Valparaíso'}
            },
            {
              'title':'PREVIA ANIVERSARIO', 'description':'Comienza la previa de nuestro segundo aniversario en Valparaíso. Una jornada para encontrarnos, brindar y celebrar juntos. La noche continúa con música en vivo y dos bandas invitadas. Rock & Roll y más sonidos para comenzar la celebración.',
              'event_type':'event','primary_category':{'id':'cultura','label':'Cultura'},
              'categories':[{'id':'cultura','label':'Cultura'}], 'tags':['Cultura','PortalTickets'],
              'source_id':'portaltickets_valparaiso','source_name':'PortalTickets — Región de Valparaíso',
              'location':{'city':'Valparaíso','venue':'Poseidón Valparaíso, Valparaíso'}
            }
          ]
          for p in probes:
            print('TEXT', description_evidence_text(p))
            print('RESULT', json.dumps(classify_public_category(p), ensure_ascii=False))
          PY
