name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect raw related entity markup
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request,urlopen
          cases=[
            ('wareba','https://www.portaldisc.com/evento/aniversariowareba','CUANDO EL PROBLEMA NO EXISTE'),
            ('sofia','https://www.portaldisc.com/evento/sofiaalvezvinadelmar','SOFÍA ALVEZ'),
            ('matriarcas','https://www.portaldisc.com/evento/matriarcas-en-parque-cultural-devalparaiso','COMPAÑIA EL TIEMPO'),
            ('mujer','https://www.portaldisc.com/evento/trip28-08','PAULA GONZÁLEZ'),
          ]
          for label,url,needle in cases:
            req=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'es-CL,es;q=0.9'})
            with urlopen(req,timeout=20) as r: html=r.read().decode(r.headers.get_content_charset() or 'utf-8','replace')
            p=html.casefold().find(needle.casefold())
            print('\nCASE',label,'POS',p)
            frag=html[max(0,p-600):p+900] if p>=0 else ''
            print(re.sub(r'\s+',' ',frag))
          PY
