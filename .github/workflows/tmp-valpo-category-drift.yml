name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild second change on current main
        run: |
          git config user.name "carlosggar-arch"
          git config user.email "carlosggar@gmail.com"
          git fetch origin fix/valpo-visible-category-authority-20260825 diag/valpo-visible-category-drift-20260825
          git checkout -B fix/valpo-visible-category-authority-v2-20260825 origin/main
          mapfile -t COMMITS < <(git rev-list --reverse origin/main..origin/fix/valpo-visible-category-authority-20260825)
          echo "SECOND_CHANGE_COMMITS=${#COMMITS[@]}"
          test "${#COMMITS[@]}" -gt 0
          git cherry-pick "${COMMITS[@]}"
          git show origin/diag/valpo-visible-category-drift-20260825:scripts/_tmp_second_category_fix.py > /tmp/second_category_fix.py
      - name: Apply shared semantic hardening
        run: |
          python /tmp/second_category_fix.py
          python scripts/generate_public_category_module.py
      - name: Run deterministic regressions
        run: |
          python -m py_compile scripts/public_category_rules.py app/scripts/test_public_category_regressions.py app/scripts/refresh_portaltickets_editorial.py
          python scripts/generate_public_category_module.py --check
          python app/scripts/test_public_category_regressions.py
          node app/public-category-regressions.test.mjs
          python app/scripts/test_portaltickets_editorial.py
          node app/formation-cycle-classifier.test.mjs
          python app/scripts/test_classification_uncertainty_audit.py
          python app/scripts/run_changed_source_tests.py --base origin/main
      - name: Validate against live PortalTickets
        run: |
          cp agenda_web.json /tmp/agenda-before.json
          python app/scripts/refresh_portaltickets_editorial.py
          python scripts/materialize_public_categories.py agenda_web.json
          python /tmp/second_category_fix.py --validate-live
          python app/scripts/test_portaltickets_editorial.py
          python app/scripts/test_public_category_regressions.py
          node app/public-category-regressions.test.mjs
      - name: Restore live data and push implementation branch
        run: |
          git checkout -- agenda_web.json app/data/quality/portaltickets-editorial.json || true
          git add app/category-normalizer.js app/formation-cycle-classifier.js app/formation-cycle-classifier.test.mjs app/scripts/atomic_maintenance_hook.py app/scripts/refresh_portaltickets_editorial.py app/scripts/run_changed_source_tests.py app/scripts/test_portaltickets_editorial.py scripts/public_category_rules.py app/public-category-rules.mjs shared/public-category-taxonomy.json app/public-category-taxonomy.generated.mjs app/scripts/test_public_category_regressions.py app/public-category-regressions.test.mjs
          git diff --cached --check
          git commit -m "Harden shared category authority against venue contamination"
          git push --force-with-lease origin HEAD:fix/valpo-visible-category-authority-v2-20260825
