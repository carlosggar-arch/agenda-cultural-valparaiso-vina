name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Trace Matriarcas through pipeline stages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { normalizeAgendaPublicText } from './app/public-text-sanitizer.mjs';
          import { applyEventDataCorrections } from './app/event-data-corrections.js';
          import { normalizeAgendaCategories } from './app/category-normalizer.js';
          import { normalizeVenueAliases } from './app/venue-identity.mjs';
          import { normalizeAgendaTitles, recoverAgendaTitles } from './app/title-normalizer-bootstrap.js';
          import { normalizeSessionOccurrences } from './app/session-occurrence-normalizer.js';
          import { normalizeEventSeries } from './app/event-series-normalizer.mjs';
          import { normalizeFormationCycles } from './app/formation-cycle-classifier.js';
          import { correctArtequinNaturalArtSessions } from './app/artequin-session-correction.js';
          import { deduplicateCrossSourceDataset } from './app/cross-source-deduplication.mjs';
          import { enrichCitySourceEvidence } from './app/city-source-evidence-adapter.mjs';
          import { normalizeAgendaSourceEvidence } from './app/source-evidence-normalizer.mjs';
          import { applyDeclarativeEventCorrectionRules } from './app/event-correction-rules.mjs';
          import { normalizeSourceDisplayNames } from './app/data-pipeline.js';

          const id = 'agenda_9007884dd819ed9a575ebda9';
          let dataset = JSON.parse(fs.readFileSync('agenda_web.json', 'utf8'));
          function show(stage) {
            const e = dataset.events.find(e => e.id === id);
            console.log('PIPELINE_STAGE', stage, JSON.stringify({
              title:e?.title,
              original_title:e?.original_title,
              primary_category:e?.primary_category,
              categories:e?.categories,
              editorial:e?.editorial,
            }));
          }
          function stage(name, fn) { dataset = fn(dataset); show(name); }
          show('raw');
          stage('public-text-sanitizer', normalizeAgendaPublicText);
          stage('source-display-name-normalizer', normalizeSourceDisplayNames);
          stage('event-data-corrections', applyEventDataCorrections);
          stage('title-recovery', recoverAgendaTitles);
          stage('category-normalizer', normalizeAgendaCategories);
          stage('venue-identity-normalizer', current => ({...current, events: normalizeVenueAliases(current.events)}));
          stage('declarative-event-correction-rules', current => applyDeclarativeEventCorrectionRules(current, {cityId:'valparaiso'}));
          stage('title-normalizer', normalizeAgendaTitles);
          stage('event-series-normalizer', current => normalizeEventSeries(current, {cityId:'valparaiso'}));
          stage('session-occurrence-normalizer', normalizeSessionOccurrences);
          stage('formation-lifecycle-classifier', normalizeFormationCycles);
          stage('artequin-session-correction', correctArtequinNaturalArtSessions);
          stage('cross-source-deduplication', deduplicateCrossSourceDataset);
          stage('city-source-evidence-adapter', current => ({...current, events: current.events.map(event => enrichCitySourceEvidence(event, 'valparaiso'))}));
          stage('source-evidence-normalizer', normalizeAgendaSourceEvidence);
          stage('public-text-sanitizer-final', normalizeAgendaPublicText);
          NODE
