name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect related tag hrefs and embedded metadata
        shell: bash
        run: |
          PYTHONPATH=app/scripts python - <<'PY'
          import json, re
          from refresh_portaltickets_editorial import fetch_url, PortalTokenParser, norm

          urls = {
            'wareba':'https://www.portaldisc.com/evento/aniversariowareba',
            'sofia':'https://www.portaldisc.com/evento/sofiaalvezvinadelmar',
            'seba':'https://www.portaldisc.com/evento/llenode97',
            'mario':'https://www.portaldisc.com/evento/gipsyvalparaiso',
          }
          for name,url in urls.items():
              ok,status,markup,error=fetch_url(url)
              print('DETAIL',name,ok,status,error)
              if not ok: continue
              p=PortalTokenParser(); p.feed(markup); p.close()
              idx=next((i for i,t in enumerate(p.tokens) if norm(t.get('text'))=='artistas y tags relacionados'),None)
              rows=[] if idx is None else p.tokens[idx:idx+12]
              print('RELATED_TOKENS',name,json.dumps(rows,ensure_ascii=False))
              meta=[]
              for pat in (r'(?is)<meta[^>]+(?:property|name)=["\']([^"\']+)["\'][^>]+content=["\']([^"\']+)["\']', r'(?is)"(?:category|genre|eventStatus|eventAttendanceMode)"\s*:\s*"([^"]+)"'):
                  meta.extend(re.findall(pat,markup)[:30])
              print('META',name,json.dumps(meta,ensure_ascii=False)[:6000])
          PY
