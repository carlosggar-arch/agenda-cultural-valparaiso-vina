name: TEMP Valpo category drift

on:
  push:
    branches:
      - diag/valpo-visible-category-drift-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compare PortalTickets meta keywords
        run: |
          python - <<'PY'
          import re
          from html import unescape
          from urllib.request import Request,urlopen
          urls=[
            'https://www.portaldisc.com/evento/aniversariowareba',
            'https://www.portaldisc.com/evento/sofiaalvezvinadelmar',
            'https://www.portaldisc.com/evento/matriarcas-en-parque-cultural-devalparaiso',
            'https://www.portaldisc.com/evento/trip28-08',
          ]
          for url in urls:
            req=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'es-CL,es;q=0.9'})
            with urlopen(req,timeout=20) as r: html=r.read().decode(r.headers.get_content_charset() or 'utf-8','replace')
            m=re.search(r'<meta\s+name=["\']keywords["\']\s+content=["\']([^"\']*)',html,re.I)
            print('KEYWORDS',url,unescape(m.group(1)) if m else None)
          PY
