name: TEMP verify Matriarcas production

on:
  push:
    branches:
      - diag/verify-matriarcas-production-20260825

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 54c8a58e17b283bc2f1fe7303738bc00fbc75e61
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install browser dependency
        run: pip install -r requirements-ci.txt
      - name: Inspect Matriarcas on both live origins
        run: |
          python - <<'PY'
          import json, tempfile, uuid
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          EXPECTED_RELEASE = 237
          ORIGINS = {
              'cloudflare': 'https://vivamos.pages.dev/app/',
              'github-pages': 'https://carlosggar-arch.github.io/agenda-cultural-valparaiso-vina/app/',
          }

          def options(profile):
              o = Options(); o.page_load_strategy = 'eager'
              for arg in (
                  '--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage',
                  '--disable-extensions','--disable-sync','--disable-background-networking',
                  '--no-first-run','--no-default-browser-check','--window-size=1280,1000',
                  f'--user-data-dir={profile}',
              ):
                  o.add_argument(arg)
              return o

          def ready(driver):
              return bool(driver.execute_script("""
                  return document.documentElement.dataset.vivamosReady === 'true'
                    && document.documentElement.dataset.city === 'valparaiso'
                    && Number(globalThis.__VIVAMOS_RELEASE__) === arguments[0]
                    && document.querySelectorAll('.event-card').length > 0;
              """, EXPECTED_RELEASE))

          js = r"""
          const cards = [...document.querySelectorAll('.event-card')]
            .filter(card => (card.innerText || '').toLowerCase().includes('matriarcas'));
          function compact(s) { return String(s || '').replace(/\s+/g,' ').trim(); }
          return cards.map(card => {
            const attrs = {};
            for (const a of card.attributes) attrs[a.name] = a.value;
            const categoryNodes = [...card.querySelectorAll('[class*="categor"], [data-category], [data-category-id], [data-primary-category]')]
              .map(el => ({tag: el.tagName, cls: el.className || '', text: compact(el.innerText), data: {...el.dataset}}))
              .filter(x => x.text || Object.keys(x.data).length);
            const section = card.closest('section, [data-category-section], [data-section]');
            const sectionHeadings = section ? [...section.querySelectorAll('h1,h2,h3,h4,[role="heading"]')]
              .map(el => compact(el.innerText)).filter(Boolean).slice(0,8) : [];
            let p = card.parentElement, ancestorHints = [];
            for (let depth=0; p && depth<5; depth++, p=p.parentElement) {
              const ds = {...p.dataset};
              const cls = compact(p.className);
              if (Object.keys(ds).some(k => k.toLowerCase().includes('categor')) || cls.toLowerCase().includes('categor')) {
                ancestorHints.push({tag:p.tagName, cls, data:ds});
              }
            }
            return {
              eventId: card.dataset.eventId || null,
              attrs,
              text: compact(card.innerText),
              categoryNodes,
              sectionHeadings,
              ancestorHints,
              htmlPrefix: card.outerHTML.slice(0, 5000),
            };
          });
          """

          all_results = {}
          for name, base in ORIGINS.items():
              with tempfile.TemporaryDirectory(prefix=f'matriarcas-{name}-') as profile:
                  driver = webdriver.Chrome(options=options(profile))
                  try:
                      driver.set_page_load_timeout(45)
                      url = f"{base}?city=valparaiso&when=todos&verify={uuid.uuid4().hex}"
                      driver.get(url)
                      WebDriverWait(driver, 35, poll_frequency=0.1).until(ready)
                      release = driver.execute_script('return Number(globalThis.__VIVAMOS_RELEASE__)')
                      result = driver.execute_script(js)
                      print(f'ORIGIN_RELEASE origin={name} release={release} url={url}')
                      print('MATRIARCAS_DIAGNOSTIC origin=' + name + ' ' + json.dumps(result, ensure_ascii=False))
                      if len(result) != 1:
                          raise SystemExit(f'MATRIARCAS_COUNT_MISMATCH origin={name} count={len(result)}')
                      all_results[name] = result[0]
                  finally:
                      driver.quit()

          print('MATRIARCAS_BOTH_ORIGINS_FOUND ' + json.dumps({k:v.get('eventId') for k,v in all_results.items()}, ensure_ascii=False))
          PY
