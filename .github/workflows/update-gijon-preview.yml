name: Update Gijon preview agenda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-gijon-preview.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-gijon-preview-agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout multi-city preview
        uses: actions/checkout@v4
        with:
          ref: feature/multi-city-pwa

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Gijon editorial classification
        run: |
          set -euo pipefail
          python app/scripts/test_gijon_editorial.py

      - name: Test multi-city UI partition
        run: |
          set -euo pipefail
          python app/scripts/test_multi_city_ui.py

      - name: Test PWA installability and cache contract
        run: |
          set -euo pipefail
          python app/scripts/test_pwa.py

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/pwa.js
          node --check app/service-worker.js

      - name: Generate Gijon dataset candidate
        run: |
          set -euo pipefail
          python app/scripts/fetch_gijon_xhtml.py --output /tmp/gijon-agenda.json --look-ahead-days 14

      - name: Validate candidate and detect material changes
        id: compare
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          candidate = json.loads(Path('/tmp/gijon-agenda.json').read_text(encoding='utf-8'))
          target = Path('app/data/gijon/agenda_web.json')
          current = json.loads(target.read_text(encoding='utf-8')) if target.exists() else {"events": []}

          required = {"schema_version", "generated_at", "publication_date", "timezone", "counts", "events"}
          missing = sorted(required - set(candidate))
          if missing:
              raise SystemExit(f"Candidate missing keys: {missing}")
          if candidate["schema_version"] != "1.2.0":
              raise SystemExit("Unexpected schema version")
          if candidate["timezone"] != "Europe/Madrid":
              raise SystemExit("Unexpected timezone")
          events = candidate["events"]
          if not isinstance(events, list):
              raise SystemExit("events must be a list")
          if any(event.get("location", {}).get("city") != "Gijón" for event in events):
              raise SystemExit("Candidate contains a non-Gijon event")
          if len(events) == 0 and len(current.get("events", [])) > 0:
              raise SystemExit("Refusing to replace a non-empty Gijon dataset with an empty candidate")

          allowed_types = {"event", "course", "flexible_offer", "program"}
          bad_types = [(event.get("id"), event.get("event_type")) for event in events if event.get("event_type") not in allowed_types]
          if bad_types:
              raise SystemExit(f"Candidate contains invalid event types: {bad_types[:3]}")

          ids = [event.get("id") for event in events]
          if any(not event_id for event_id in ids) or len(ids) != len(set(ids)):
              raise SystemExit("Candidate contains missing or duplicate event IDs")

          expected_counts = {
              "total": len(events),
              "events": sum(event.get("event_type") == "event" for event in events),
              "courses": sum(event.get("event_type") == "course" for event in events),
              "flexible_offers": sum(event.get("event_type") == "flexible_offer" for event in events),
              "programs": sum(event.get("event_type") == "program" for event in events),
          }
          if candidate.get("counts") != expected_counts:
              raise SystemExit(f"Candidate counts mismatch: {candidate.get('counts')} != {expected_counts}")

          generic_venues = {"", "gijón/xixón", "gijón", "xixón"}
          editorial_errors = []
          for event in events:
              editorial = event.get("editorial") or {}
              if editorial.get("classification") != event.get("event_type"):
                  editorial_errors.append((event.get("id"), "classification mismatch"))
                  continue
              try:
                  duration = int(editorial.get("duration_days", 0))
              except (TypeError, ValueError):
                  editorial_errors.append((event.get("id"), "invalid duration"))
                  continue
              venue = str(event.get("location", {}).get("venue") or "").strip().casefold()
              if event.get("event_type") == "event" and duration >= 90 and venue in generic_venues:
                  editorial_errors.append((event.get("id"), "long generic entry classified as event"))
          if editorial_errors:
              raise SystemExit(f"Candidate editorial classification errors: {editorial_errors[:3]}")

          bad_urls = []
          for event in events:
              official = event.get("links", {}).get("official")
              parsed = urlparse(str(official or ""))
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  bad_urls.append((event.get("id"), official))
          if bad_urls:
              raise SystemExit(f"Candidate contains invalid official URLs: {bad_urls[:3]}")

          serialized = json.dumps(candidate, ensure_ascii=False)
          mojibake_markers = ("Ã", "Â", "â€", "ðŸ", "�", "\u0081", "\u008d", "\u008f", "\u0090", "\u009d")
          found_markers = [marker for marker in mojibake_markers if marker in serialized]
          if found_markers:
              raise SystemExit(f"Candidate contains mojibake markers: {found_markers}")

          def stable(payload):
              payload = json.loads(json.dumps(payload))
              payload.pop("generated_at", None)
              payload.pop("publication_date", None)
              for event in payload.get("events", []):
                  event["last_verified_at"] = None
                  if isinstance(event.get("public_status"), dict):
                      event["public_status"]["last_verified_at"] = None
              return payload

          changed = stable(candidate) != stable(current)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")

          if changed:
              target.write_text(json.dumps(candidate, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit only Gijon preview dataset
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "agenda-cultural-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- app/data/gijon/agenda_web.json
          CHANGED="$(git diff --cached --name-only)"
          if [ "$CHANGED" != "app/data/gijon/agenda_web.json" ]; then
            echo "Unexpected changed paths: $CHANGED"
            exit 1
          fi
          git commit -m "Update Gijon preview dataset"
          git push origin HEAD:feature/multi-city-pwa

      - name: Report no material change
        if: steps.compare.outputs.changed == 'false'
        run: echo "No material Gijon agenda changes."
