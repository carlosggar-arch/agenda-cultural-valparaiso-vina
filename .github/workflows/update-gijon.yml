name: Update Gijon agenda

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-gijon-agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/multi-city-pwa

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Gijon dataset candidate
        run: |
          set -euo pipefail
          python app/scripts/update_gijon.py --output /tmp/gijon-agenda.json --look-ahead-days 14

      - name: Validate candidate and guard against accidental emptying
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          candidate = json.loads(Path('/tmp/gijon-agenda.json').read_text(encoding='utf-8'))
          target = Path('app/data/gijon/agenda_web.json')
          current = json.loads(target.read_text(encoding='utf-8')) if target.exists() else {"events": []}

          required = {"schema_version", "generated_at", "publication_date", "timezone", "counts", "events"}
          missing = sorted(required - set(candidate))
          if missing:
              raise SystemExit(f"Candidate missing keys: {missing}")
          if candidate["schema_version"] != "1.2.0":
              raise SystemExit("Unexpected schema version")
          if candidate["timezone"] != "Europe/Madrid":
              raise SystemExit("Unexpected timezone")
          if not isinstance(candidate["events"], list):
              raise SystemExit("events must be a list")
          if any(event.get("location", {}).get("city") != "Gijón" for event in candidate["events"]):
              raise SystemExit("Candidate contains a non-Gijon event")
          if len(candidate["events"]) == 0 and len(current.get("events", [])) > 0:
              raise SystemExit("Refusing to replace a non-empty Gijon dataset with an empty candidate")

          # Ignore volatile timestamps when deciding whether content really changed.
          def stable(payload):
              payload = json.loads(json.dumps(payload))
              payload.pop("generated_at", None)
              payload.pop("publication_date", None)
              for event in payload.get("events", []):
                  event["last_verified_at"] = None
                  if isinstance(event.get("public_status"), dict):
                      event["public_status"]["last_verified_at"] = None
              return payload

          if stable(candidate) == stable(current):
              Path('/tmp/no-gijon-change').write_text('1', encoding='utf-8')
          else:
              target.write_text(json.dumps(candidate, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Stop when there is no material change
        if: ${{ hashFiles('/tmp/no-gijon-change') != '' }}
        run: echo "No material Gijon agenda changes."

      - name: Commit Gijon dataset only
        if: ${{ hashFiles('/tmp/no-gijon-change') == '' }}
        run: |
          set -euo pipefail
          git config user.name "agenda-cultural-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- app/data/gijon/agenda_web.json
          CHANGED="$(git diff --cached --name-only)"
          if [ "$CHANGED" != "app/data/gijon/agenda_web.json" ]; then
            echo "Unexpected changed paths: $CHANGED"
            exit 1
          fi
          git commit -m "Update Gijon agenda dataset"
          git push origin HEAD:feature/multi-city-pwa
