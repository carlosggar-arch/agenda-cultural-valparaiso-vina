name: v177 production speed probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v177-production-speed-probe.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout probe
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Verify deployed parity and measure cold/warm
        run: |
          set -euo pipefail
          python app/scripts/production_pwa_smoke.py http
          python app/scripts/production_warm_start_smoke.py
