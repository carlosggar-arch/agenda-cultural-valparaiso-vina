name: Verify v212 production attestation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with exact public main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          actual="$(git rev-parse HEAD)"
          echo "PRODUCTION_ATTESTATION_VERIFY_HEAD=$actual"
          test "$actual" = "7cb0c7692d3f86becb08d58d972e6af12d86c0fd"
          mkdir -p /tmp/production-release-verification

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Validate local production contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/production_pwa_smoke.py \
            app/scripts/production_browser_selenium_smoke.py \
            app/scripts/production_warm_start_smoke.py \
            app/scripts/test_web_pwa_visibility_parity.py \
            app/scripts/production_release_attestation.py
          python app/scripts/production_pwa_smoke.py local

      - name: 1 GitHub Pages + Cloudflare byte parity
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_pwa_smoke.py http | tee /tmp/production-release-verification/http.log

      - name: 2 Cold-load both cities on both origins
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_browser_selenium_smoke.py | tee /tmp/production-release-verification/browser.log

      - name: 3 Warm-reopen Valpo PWA on both origins
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_warm_start_smoke.py | tee /tmp/production-release-verification/warm.log

      - name: 4 Exact live WEB versus cached PWA event-ID parity
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/test_web_pwa_visibility_parity.py \
            --production \
            --json-output /tmp/production-release-verification/web-pwa-parity.json \
            | tee /tmp/production-release-verification/parity.log

      - name: 5 Emit final production release attestation
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/production_release_attestation.py \
            --http-log /tmp/production-release-verification/http.log \
            --browser-log /tmp/production-release-verification/browser.log \
            --warm-log /tmp/production-release-verification/warm.log \
            --parity-report /tmp/production-release-verification/web-pwa-parity.json \
            --output /tmp/production-release-verification/production-release-attestation.json \
            --markdown-output /tmp/production-release-verification/summary.md \
            | tee /tmp/production-release-verification/attestation.log
          grep -q '^PRODUCTION_RELEASE_VERIFIED ' /tmp/production-release-verification/attestation.log
          cat /tmp/production-release-verification/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload attestation evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-release-verification-v212-${{ github.run_id }}
          path: /tmp/production-release-verification/
          if-no-files-found: error
          retention-days: 30
