name: Verify production now

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-production-now.yml"

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align verification with deployed public main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "PRODUCTION_VERIFY_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "0213ede2644a7d5ca0da584267bfbf5d3f10ca5e"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser timing dependency
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Validate smoke scripts locally
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/production_pwa_smoke.py \
            app/scripts/production_warm_start_smoke.py \
            app/scripts/test_web_pwa_visibility_parity.py
          python app/scripts/production_pwa_smoke.py local

      - name: GitHub Pages + Cloudflare byte parity
        run: python app/scripts/production_pwa_smoke.py http

      - name: Cold-load both cities on both origins
        run: python app/scripts/production_pwa_smoke.py browser

      - name: Warm-reopen Valpo PWA on both origins
        run: python app/scripts/production_warm_start_smoke.py

      - name: Exact live WEB versus cached PWA event-ID parity
        run: python app/scripts/test_web_pwa_visibility_parity.py --production
