name: Visita Vina Estadio Espanol validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/scripts/refresh_visitavina_estadio_espanol.py"
      - "app/scripts/test_visitavina_estadio_espanol.py"
      - "app/scripts/apply_estadio_espanol_coverage.py"
      - "app/scripts/test_estadio_espanol_coverage.py"
      - ".github/workflows/visitavina-estadio-espanol-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate recovery policy
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/refresh_visitavina_estadio_espanol.py \
            app/scripts/test_visitavina_estadio_espanol.py \
            app/scripts/apply_estadio_espanol_coverage.py \
            app/scripts/test_estadio_espanol_coverage.py
          python app/scripts/test_visitavina_estadio_espanol.py
          python app/scripts/test_estadio_espanol_coverage.py

      - name: Probe official Visita Vina listing
        run: |
          set -euo pipefail
          python app/scripts/refresh_visitavina_estadio_espanol.py --no-write > visitavina-estadio-espanol-live.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('visitavina-estadio-espanol-live.json').read_text(encoding='utf-8'))
          listing = report.get('listing') or {}
          details = report.get('details') or []
          if not listing.get('fetch_ok'):
              raise SystemExit('Official Visita Viña activities listing is not reachable')
          if not details:
              raise SystemExit('No future Estadio Español candidate was found in the official municipal listing')
          confirmed = [row for row in details if row.get('fetch_ok') and row.get('venue_ok')]
          if not confirmed:
              raise SystemExit('Future Estadio Español candidates were not confirmed by their detail pages')
          if int(report.get('events_published') or 0) <= 0 or not report.get('coverage'):
              raise SystemExit('Verified Estadio Español event did not become publishable/covered')
          print('VISITAVINA_ESTADIO_ESPANOL_LIVE_OK', json.dumps({
              'state': report.get('state'),
              'events_published': report.get('events_published'),
              'confirmed': confirmed,
              'coverage': report.get('coverage'),
          }, ensure_ascii=False))
          PY

      - name: Upload source diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visitavina-estadio-espanol-live
          path: visitavina-estadio-espanol-live.json
          if-no-files-found: ignore
          retention-days: 7
