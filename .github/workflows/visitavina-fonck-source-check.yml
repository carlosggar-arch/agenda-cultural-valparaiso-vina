name: Visita Vina Fonck recurrence validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/scripts/refresh_visitavina_fonck.py"
      - "app/scripts/test_visitavina_fonck.py"
      - "app/scripts/apply_fonck_coverage.py"
      - "app/scripts/test_fonck_coverage.py"
      - ".github/workflows/visitavina-fonck-source-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run recurrence policy tests
        run: |
          set -euo pipefail
          python -m py_compile \
            app/scripts/refresh_visitavina_fonck.py \
            app/scripts/test_visitavina_fonck.py \
            app/scripts/apply_fonck_coverage.py \
            app/scripts/test_fonck_coverage.py
          python app/scripts/test_visitavina_fonck.py
          python app/scripts/test_fonck_coverage.py

      - name: Probe official municipal recurrence
        run: |
          set -euo pipefail
          python app/scripts/refresh_visitavina_fonck.py --no-write > visitavina-fonck-live-check.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('visitavina-fonck-live-check.json').read_text(encoding='utf-8'))
          listing = report.get('listing') or {}
          discovery = report.get('occurrence_discovery') or {}
          details = report.get('details') or []
          future_dates = discovery.get('future_dates') or []
          if not listing.get('fetch_ok'):
              raise SystemExit('Official Visita Viña activities listing is not reachable')
          if discovery.get('method') != 'exact_event_slug_occurrence_links':
              raise SystemExit('Fonck recurrence is not using the exact event-link method')
          if not future_dates:
              raise SystemExit('No future occurrence for the Museo Fonck workshop was found in the official listing')
          if not all(item.get('fetch_ok') and item.get('title_ok') and item.get('venue_ok') for item in details):
              raise SystemExit('A future Fonck occurrence could not be confirmed by its official detail page')
          if int(report.get('events_published') or 0) <= 0 or not report.get('coverage'):
              raise SystemExit('The verified future Fonck occurrence was not made publishable')
          print('VISITAVINA_FONCK_LIVE_OK', json.dumps({
              'state': report.get('state'),
              'future_dates': future_dates,
              'details': details,
              'events_published': report.get('events_published'),
              'coverage': report.get('coverage'),
          }, ensure_ascii=False))
          PY

      - name: Upload recurrence diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visitavina-fonck-live-check
          path: visitavina-fonck-live-check.json
          if-no-files-found: ignore
          retention-days: 7
