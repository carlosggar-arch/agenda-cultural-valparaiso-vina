<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="¡Vivamos! Agenda cultural de Valparaíso, Viña del Mar y Gijón/Xixón.">
  <meta name="theme-color" content="#0d4555">
  <title>¡Vivamos! Agenda cultural</title>
  <link rel="canonical" href="https://carlosggar-arch.github.io/agenda-cultural-valparaiso-vina/app/?city=valparaiso">
  <meta http-equiv="refresh" content="0; url=./app/?city=valparaiso">
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const requested = String(params.get("city") || "").toLowerCase();
      const city = requested === "gijon" ? "gijon" : "valparaiso";
      const target = new URL("./app/", window.location.href);
      target.searchParams.set("city", city);
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <p>Abriendo <strong>¡Vivamos! Agenda cultural</strong>…</p>
    <p><a href="./app/?city=valparaiso">Continuar a la agenda</a></p>
  </main>
</body>
</html>
