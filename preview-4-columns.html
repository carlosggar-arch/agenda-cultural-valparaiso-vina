<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>¡Vivamos! · ensayo 4 columnas</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f2e9}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="vivamos-preview" title="¡Vivamos! · ensayo visual de cuatro columnas"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('vivamos-preview');
      const target = new URL('./app/', window.location.href);
      const params = new URLSearchParams(window.location.search);
      if (!params.has('city')) params.set('city', 'valparaiso');
      if (!params.has('when')) params.set('when', 'hoy');
      target.search = params.toString();
      frame.src = target.href;

      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;
          const style = doc.createElement('style');
          style.dataset.previewFourColumns = 'true';
          style.textContent = '@media (min-width:801px){.event-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}}';
          doc.head.appendChild(style);
        } catch (error) {
          console.error('No se pudo aplicar el ensayo visual de cuatro columnas.', error);
        }
      });
    })();
  </script>
</body>
</html>
